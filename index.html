<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Departmental Operations Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f4f1eb; --surface: #ffffff; --border: #e8e3d8;
    --text: #1a1714; --text-muted: #7a7268; --text-faint: #b0a99e;
    --green: #2d6a4f; --green-light: #d8f3dc;
    --amber: #b5460f; --amber-light: #fde8d8;
    --blue: #1b4f72; --blue-light: #d6eaf8;
    --teal: #0e6655; --teal-light: #d5f5e3;
    --purple: #6b3fa0; --purple-light: #ede0ff;
    --coral: #a0402a; --coral-light: #fde0d8;
    --radius: 10px; --radius-lg: 16px;
  }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; line-height: 1.5; }

  .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 2rem; position: sticky; top: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; height: 60px; }
  .header-brand { display: flex; align-items: center; gap: 10px; }
  .brand-icon { width: 32px; height: 32px; border-radius: 8px; background: var(--green); display: flex; align-items: center; justify-content: center; font-size: 16px; }
  .brand-name { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; }
  .brand-sub { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
  .header-right { font-size: 12px; color: var(--text-muted); font-family: 'DM Mono', monospace; }

  .layout { display: flex; min-height: calc(100vh - 60px); }

  .sidebar { width: 210px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); padding: 1.25rem 0; position: sticky; top: 60px; height: calc(100vh - 60px); overflow-y: auto; }
  .sidebar-section { padding: 0 1rem; margin-bottom: 1.5rem; }
  .sidebar-label { font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-faint); padding: 0 0.5rem; margin-bottom: 4px; }
  .nav-item { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 8px; cursor: pointer; transition: all 0.15s; font-size: 13px; color: var(--text-muted); border: none; background: none; width: 100%; text-align: left; font-family: 'DM Sans', sans-serif; }
  .nav-item:hover { background: var(--bg); color: var(--text); }
  .nav-item.active { background: var(--green-light); color: var(--green); font-weight: 500; }
  .nav-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  #nav-tabs { /* dynamic */ }

  .main { flex: 1; padding: 1.75rem 2rem; overflow-x: hidden; max-width: calc(100vw - 210px); }

  .page-header { margin-bottom: 1.5rem; }
  .page-title { font-size: 22px; font-weight: 600; letter-spacing: -0.5px; }
  .page-subtitle { font-size: 13px; color: var(--text-muted); margin-top: 3px; }

  .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(155px, 1fr)); gap: 12px; margin-bottom: 1.75rem; }
  .metric-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1.1rem 1.25rem; }
  .metric-label { font-size: 11px; font-weight: 500; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
  .metric-value { font-size: 24px; font-weight: 600; letter-spacing: -0.8px; line-height: 1.1; }
  .metric-unit { font-size: 13px; font-weight: 400; color: var(--text-muted); margin-left: 3px; }
  .metric-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; padding: 3px 8px; border-radius: 20px; margin-top: 6px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1.25rem; margin-bottom: 1rem; }
  .card-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 1rem; }
  .card-title { font-size: 14px; font-weight: 600; }
  .card-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

  .chart-container { position: relative; }
  .charts-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1rem; margin-bottom: 1rem; }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; border: 1px solid var(--border); }
  thead tr { border-bottom: 2px solid var(--border); background: var(--bg); }
  th { padding: 8px 12px; text-align: left; font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap; border-right: 1px solid var(--border); }
  th:last-child { border-right: none; }
  td { padding: 9px 12px; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); color: var(--text); }
  td:last-child { border-right: none; }
  tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--bg); }
  .td-num { font-family: 'DM Mono', monospace; font-size: 12px; text-align: right; }

  .state-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 3rem 2rem; text-align: center; }
  .spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--green); border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 1rem; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .state-title { font-size: 15px; font-weight: 500; margin-bottom: 6px; }
  .state-sub { font-size: 13px; color: var(--text-muted); max-width: 440px; margin: 0 auto; line-height: 1.6; }
  .error-box { border-color: #f5c6c6; background: #fff8f8; }

  .legend { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted); }
  .legend-swatch { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }

  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 8px; font-size: 13px; font-weight: 500; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; transition: all 0.15s; font-family: 'DM Sans', sans-serif; }
  .btn:hover { background: var(--bg); }
  .btn-primary { background: var(--green); color: white; border-color: var(--green); }
  .btn-primary:hover { background: #245a41; }

  /* ── Export button & dropdown ───────────────────────────────────────────── */
  .export-wrap { position: relative; display: inline-flex; }
  .export-btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 13px; border-radius: 8px; font-size: 13px; font-weight: 500; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; transition: all 0.15s; font-family: 'DM Sans', sans-serif; white-space: nowrap; }
  .export-btn:hover { background: var(--bg); }
  .export-dropdown { display: none; position: absolute; top: calc(100% + 5px); right: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 6px 24px rgba(0,0,0,0.11); z-index: 300; min-width: 190px; padding: 5px; }
  .export-dropdown.open { display: block; }
  .export-opt { display: flex; align-items: center; gap: 9px; width: 100%; padding: 8px 12px; border-radius: 7px; font-size: 13px; font-weight: 500; border: none; background: none; color: var(--text); cursor: pointer; text-align: left; font-family: 'DM Sans', sans-serif; transition: background 0.12s; }
  .export-opt:hover { background: var(--bg); }
  .export-opt-icon { font-size: 15px; flex-shrink: 0; }
  .export-opt-sub { font-size: 11px; color: var(--text-muted); font-weight: 400; display: block; }
  .show-more-wrap { text-align: center; padding: 12px 0 4px; }

  .summary-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 1.75rem; background: var(--surface); }
  .sbi { padding: 1rem 1.25rem; border-right: 1px solid var(--border); cursor: pointer; transition: background 0.15s; }
  .sbi:last-child { border-right: none; }
  .sbi:hover { background: var(--bg); }
  .sbi.active { background: var(--green-light); }
  .sbi-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-faint); margin-bottom: 4px; }
  .sbi-value { font-size: 18px; font-weight: 600; letter-spacing: -0.5px; word-break: break-all; }
  .sbi-sub { font-size: 11px; color: var(--text-muted); margin-top: 3px; }

  .hidden { display: none !important; }
  .fade-in { animation: fadeIn 0.25s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

  /* ── Date Range Filter Bar ─────────────────────────────────────────────── */
  .filter-bar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 10px 14px;
    margin-bottom: 1.25rem;
  }
  .filter-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); white-space: nowrap; }
  .filter-presets { display: flex; gap: 5px; flex-wrap: wrap; }
  .filter-preset {
    padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 500;
    border: 1px solid var(--border); background: var(--surface); color: var(--text-muted);
    cursor: pointer; transition: all 0.15s; font-family: 'DM Sans', sans-serif; white-space: nowrap;
  }
  .filter-preset:hover { background: var(--bg); color: var(--text); }
  .filter-preset.active { background: var(--green); color: #fff; border-color: var(--green); }
  .filter-divider { width: 1px; height: 24px; background: var(--border); flex-shrink: 0; }
  .filter-custom { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .filter-date-input {
    padding: 5px 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); font-size: 12px; font-family: 'DM Sans', sans-serif;
    color: var(--text); cursor: pointer; outline: none;
  }
  .filter-date-input:focus { border-color: var(--green); }
  .filter-range-label { font-size: 11px; color: var(--text-muted); white-space: nowrap; }
  .filter-apply {
    padding: 5px 14px; border-radius: 8px; font-size: 12px; font-weight: 600;
    background: var(--green); color: #fff; border: none; cursor: pointer;
    font-family: 'DM Sans', sans-serif; transition: background 0.15s;
  }
  .filter-apply:hover { background: #245a41; }
  .filter-clear {
    padding: 5px 10px; border-radius: 8px; font-size: 12px; font-weight: 500;
    background: var(--surface); color: var(--text-muted); border: 1px solid var(--border);
    cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.15s;
  }
  .filter-clear:hover { background: var(--bg); color: var(--text); }
  .filter-status { font-size: 11px; color: var(--green); font-weight: 600; white-space: nowrap; margin-left: auto; }
  .filter-status.off { color: var(--text-faint); font-weight: 400; }

  /* ── Auto-Refresh ─────────────────────────────────────────────────────────── */
  .refresh-ring-wrap {
    display: flex; align-items: center; gap: 10px;
  }
  .refresh-ring {
    position: relative; width: 32px; height: 32px; flex-shrink: 0; cursor: pointer;
  }
  .refresh-ring svg { transform: rotate(-90deg); }
  .refresh-ring-bg   { fill: none; stroke: var(--border); stroke-width: 3; }
  .refresh-ring-fill { fill: none; stroke: var(--green); stroke-width: 3;
    stroke-linecap: round; transition: stroke-dashoffset 1s linear;
    stroke-dasharray: 82; stroke-dashoffset: 82; }
  .refresh-ring-icon {
    position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; font-size: 13px; transition: transform 0.4s;
  }
  .refresh-ring:hover .refresh-ring-icon { transform: rotate(180deg); }
  .refresh-ring.spinning .refresh-ring-icon { animation: spin 0.7s linear infinite; }

  .refresh-info { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.3; }
  .refresh-updated { font-size: 11px; color: var(--text-muted); font-family: 'DM Mono', monospace; }
  .refresh-countdown { font-size: 10px; color: var(--text-faint); }
  .refresh-countdown.active { color: var(--green); font-weight: 600; }

  /* Sidebar auto-refresh control */
  .ar-control { padding: 0.75rem 1rem; margin: 0 0.25rem; background: var(--bg); border-radius: 10px; }
  .ar-control-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-faint); margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; }
  .ar-toggle { position: relative; width: 32px; height: 18px; cursor: pointer; }
  .ar-toggle input { opacity: 0; width: 0; height: 0; }
  .ar-slider { position: absolute; inset: 0; background: var(--border); border-radius: 18px; transition: background 0.2s; }
  .ar-slider::before { content: ''; position: absolute; width: 12px; height: 12px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: transform 0.2s; }
  .ar-toggle input:checked + .ar-slider { background: var(--green); }
  .ar-toggle input:checked + .ar-slider::before { transform: translateX(14px); }
  .ar-intervals { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
  .ar-interval-btn {
    flex: 1; min-width: 40px; padding: 5px 4px; border-radius: 6px; font-size: 11px;
    font-weight: 500; text-align: center; border: 1px solid var(--border);
    background: var(--surface); color: var(--text-muted); cursor: pointer;
    transition: all 0.15s; font-family: 'DM Sans', sans-serif;
  }
  .ar-interval-btn:hover { background: var(--bg); color: var(--text); }
  .ar-interval-btn.active { background: var(--green); color: #fff; border-color: var(--green); }
  .ar-status { font-size: 10px; color: var(--text-muted); margin-top: 6px; text-align: center; }
  .ar-status.live { color: var(--green); font-weight: 600; }

  /* Silent refresh flash */
  @keyframes refreshFlash { 0%,100%{opacity:1} 50%{opacity:0.55} }
  .refresh-flash { animation: refreshFlash 0.6s ease; }


  /* ── Mobile Nav Overlay ─────────────────────────────────────────────────── */
  .mobile-nav-toggle {
    display: none; align-items: center; justify-content: center;
    width: 36px; height: 36px; border-radius: 8px;
    background: var(--surface); border: 1px solid var(--border);
    cursor: pointer; font-size: 18px; flex-shrink: 0;
  }
  .sidebar-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.35);
    z-index: 200; opacity: 0; transition: opacity 0.2s;
  }
  .sidebar-overlay.open { opacity: 1; }

  @media (max-width: 768px) {
    /* Header */
    .header { padding: 0 0.75rem; height: 52px; gap: 8px; }
    .brand-name { font-size: 13px; }
    .brand-sub  { display: none; }
    .header-right { font-size: 11px; }
    .refresh-updated { font-size: 10px; }
    .mobile-nav-toggle { display: flex; }

    /* Sidebar — slides in from left as overlay on mobile */
    .sidebar {
      position: fixed; top: 0; left: -220px; height: 100vh;
      z-index: 250; transition: left 0.25s ease; box-shadow: none;
      padding-top: 3rem; overflow-y: auto;
    }
    .sidebar.mobile-open {
      left: 0; box-shadow: 4px 0 24px rgba(0,0,0,0.18);
    }
    .sidebar-overlay { display: block; pointer-events: none; }
    .sidebar-overlay.open { pointer-events: auto; }

    /* Main content: full width */
    .main {
      max-width: 100vw;
      padding: 0.85rem 0.85rem 2rem;
      min-width: 0;
    }
    .layout { display: block; }

    /* Page header */
    .page-title  { font-size: 17px; }
    .page-subtitle { font-size: 12px; }

    /* Filter bar — stack vertically */
    .filter-bar  { flex-direction: column; align-items: stretch; gap: 8px; padding: 10px 12px; }
    .filter-presets { flex-wrap: wrap; }
    .filter-custom  { flex-wrap: wrap; gap: 6px; }
    .filter-divider { display: none; }
    .filter-status  { margin-left: 0; }
    .filter-date-input { flex: 1; min-width: 120px; }

    /* Metric grid — 2 columns on phone */
    .metrics-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
    .metric-value { font-size: 20px; }

    /* Charts row — stack */
    .charts-row { grid-template-columns: 1fr; }

    /* Summary bar — horizontal scroll, don't squish */
    .summary-bar {
      display: flex; overflow-x: auto; -webkit-overflow-scrolling: touch;
      border-radius: var(--radius); scroll-snap-type: x mandatory;
      border-bottom: 1px solid var(--border);
    }
    .sbi { min-width: 130px; flex-shrink: 0; scroll-snap-align: start; border-right: 1px solid var(--border); }

    /* Drill-down bar — horizontal scroll */
    .dd-bar {
      display: flex; overflow-x: auto; -webkit-overflow-scrolling: touch;
      border-radius: var(--radius); scroll-snap-type: x mandatory;
    }
    .dd-cell { min-width: 130px; flex-shrink: 0; scroll-snap-align: start; border-right: 1px solid var(--border); }

    /* Tables — horizontal scroll */
    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { min-width: 480px; }

    /* Overview snap strip */
    .snap-strip { grid-template-columns: 1fr; }

    /* Score grid — 2 col */
    .score-grid { grid-template-columns: 1fr 1fr; }

    /* Trend grid — 1 col */
    .trend-grid { grid-template-columns: 1fr; }

    /* Cards */
    .card { padding: 1rem; }
    .card-header { flex-wrap: wrap; gap: 6px; }

    /* Chart buttons wrap */
    .ov-chart-btns  { flex-wrap: wrap; gap: 4px; }
    .ov-chart-btn   { font-size: 10px; padding: 3px 9px; }

    /* State box */
    .state-box { padding: 2rem 1rem; }
    .state-sub { font-size: 12px; }

    /* Buttons */
    .btn { font-size: 12px; padding: 5px 11px; }
  }

  @media (max-width: 400px) {
    .metrics-grid { grid-template-columns: 1fr; }
    .score-grid   { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleMobileNav()"></div>
<header class="header">
  <div style="display:flex;align-items:center;gap:8px;">
    <button class="mobile-nav-toggle" onclick="toggleMobileNav()" aria-label="Open menu" id="mobile-nav-btn">☰</button>
    <div class="header-brand">
      <div class="brand-icon">🥛</div>
      <div>
        <div class="brand-name">Departmental Operations</div>
        <div class="brand-sub">Live Dashboard</div>
      </div>
    </div>
  </div>
  </div>
  <div class="refresh-ring-wrap">
    <div class="refresh-info">
      <span class="refresh-updated" id="last-updated">Loading…</span>
      <span class="refresh-countdown" id="refresh-countdown"></span>
    </div>
    <div class="refresh-ring" id="refresh-ring" onclick="triggerManualRefresh()" title="Click to refresh now">
      <svg width="32" height="32" viewBox="0 0 32 32">
        <circle class="refresh-ring-bg"   cx="16" cy="16" r="13"/>
        <circle class="refresh-ring-fill" cx="16" cy="16" r="13" id="ring-arc"/>
      </svg>
      <div class="refresh-ring-icon" id="ring-icon">↻</div>
    </div>
  </div>
</header>

<div class="layout">
  <nav class="sidebar" id="sidebar">
    <div style="display:flex;justify-content:flex-end;padding:0.5rem 1rem 0;"><button onclick="toggleMobileNav()" style="background:none;border:none;font-size:18px;cursor:pointer;color:var(--text-muted);display:none;" id="sidebar-close-btn">✕</button></div>    <div class="sidebar-section">
      <div class="sidebar-label">Departments</div>
      <div id="nav-tabs">
        <!-- Populated dynamically after sheets load -->
        <button class="nav-item active" onclick="switchTab('__overview__')" id="nav-__overview__">
          <span class="nav-dot" style="background:#888"></span> Overview
        </button>
      </div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-label">Auto-Refresh</div>
      <div class="ar-control">
        <div class="ar-control-label">
          <span>Auto-Refresh</span>
          <label class="ar-toggle">
            <input type="checkbox" id="ar-toggle-input" onchange="toggleAutoRefresh(this.checked)">
            <span class="ar-slider"></span>
          </label>
        </div>
        <div class="ar-intervals">
          <button class="ar-interval-btn" data-mins="5"  onclick="setRefreshInterval(5)">5m</button>
          <button class="ar-interval-btn active" data-mins="15" onclick="setRefreshInterval(15)">15m</button>
          <button class="ar-interval-btn" data-mins="30" onclick="setRefreshInterval(30)">30m</button>
          <button class="ar-interval-btn" data-mins="60" onclick="setRefreshInterval(60)">1h</button>
        </div>
        <div class="ar-status" id="ar-status">Off</div>
      </div>
      <button class="nav-item" onclick="triggerManualRefresh()">↻ Refresh now</button>
    </div>
  </nav>
  <main class="main">
    <div id="loading-state" class="state-box">
      <div class="spinner"></div>
      <div class="state-title" id="loading-msg">Connecting to Google Sheets…</div>
      <div class="state-sub" id="loading-sub">Discovering sheet tabs…</div>
    </div>
    <div id="error-state" class="state-box error-box hidden">
      <div style="font-size:28px;margin-bottom:10px">⚠️</div>
      <div class="state-title">Could not load data</div>
      <div class="state-sub" id="error-detail"></div>
      <br><button class="btn btn-primary" onclick="loadAllData()">Try again</button>
    </div>
    <div id="dashboard" class="hidden"></div>
  </main>
</div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// CONFIG — only the spreadsheet ID is fixed. Everything else is discovered.
// ─────────────────────────────────────────────────────────────────────────────
const FILE_ID = '13LiH5I_0qdB6REtOx26cOpBBQLhkJceArjNwc1uUPPM';

// Colour palette rotated across however many tabs are found — vibrant & distinct for bar charts
const TAB_COLORS = [
  { main: '#1f77b4', light: '#d6eaf8', badge: 'blue'   },   // Deep Blue
  { main: '#ff7f0e', light: '#ffe8cc', badge: 'amber'  },   // Vibrant Orange

let sheetMeta   = [];   // [{ name, color }]  — discovered at runtime

// ── Date Range Filter State ───────────────────────────────────────────────────
let dateFilter = {
  preset: 'all',      // 'all' | '7d' | '30d' | 'mtd' | 'custom'
  from:   null,       // Date or null
  to:     null,       // Date or null
};

// Resolve dateFilter into a {from, to} window (both inclusive, or null = no bound)
function getFilterWindow() {
  const now   = new Date();
  const sysToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());

  // For relative presets, anchor to the latest date found across all loaded sheets,
  // capped at today so future-dated rows (typos, formulas) don't skew the window.
  // Only rows with actual non-zero data are considered — blank placeholder rows are ignored.
  function latestDataDate() {
    let latest = null;
    Object.values(allData).forEach(({ cols, rows }) => {
      const dateCol = getDateCol(cols, rows);
      if (!dateCol) return;
      rows.forEach(r => {
        // Skip placeholder rows (all numeric values are 0 or null)
        if (!rowHasRealData(r)) return;
        const d = parseRowDate(r[dateCol]);
        if (!d) return;
        const day = new Date(d.getFullYear(), d.getMonth(), d.getDate());
        if (day > sysToday) return; // ignore future-dated rows
        if (!latest || day > latest) latest = day;
      });
    });
    return latest || sysToday;
  }

  if (dateFilter.preset === '7d') {
    const to = latestDataDate();
    return { from: new Date(to - 6 * 864e5), to };
  }
  if (dateFilter.preset === '30d') {
    const to = latestDataDate();
    return { from: new Date(to - 29 * 864e5), to };
  }
  if (dateFilter.preset === 'mtd') {
    const to = latestDataDate();
    return { from: new Date(to.getFullYear(), to.getMonth(), 1), to };
  }
  if (dateFilter.preset === 'custom') return { from: dateFilter.from, to: dateFilter.to };
  return { from: null, to: null }; // 'all'
}

// Returns true if a row has at least one real (non-zero, non-null) numeric value.
// Rows that exist only as date placeholders (e.g. 29/05, 30/05, 31/05 with 0.00
// in every cell) are treated as "not yet entered" and excluded from aggregations.
function rowHasRealData(row) {
  return Object.entries(row).some(([k, v]) =>
    !k.startsWith('_') && typeof v === 'number' && v !== 0 && !isNaN(v)
  );
}

// Filter rows by the current date filter window using the detected date column.
// Also strips out placeholder rows that have no real numeric data.
function applyDateFilter(rows, dateCol) {
  const { from, to } = getFilterWindow();
  // Always strip empty placeholder rows regardless of date filter
  const realRows = rows.filter(rowHasRealData);
  if (!from && !to) return realRows;  // no date filter active
  if (!dateCol) return realRows;      // can't date-filter without a date column
  return realRows.filter(r => {
    const d = parseRowDate(r[dateCol]);
    if (!d) return false; // when a date filter is active, exclude rows with no parseable date
    const day = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    if (from && day < from) return false;
    if (to   && day > to)   return false;
    return true;
  });
}

// Human-readable description of the active filter
function filterDescription() {
  if (dateFilter.preset === 'all') return null;
  const { from, to } = getFilterWindow();
  const fd = d => d ? d.toLocaleDateString('en-KE', { day: 'numeric', month: 'short', year: 'numeric' }) : '?';
  if (from && to)   return `${fd(from)} – ${fd(to)}`;
  if (from)         return `From ${fd(from)}`;
  if (to)           return `Up to ${fd(to)}`;
  return null;
}

// Set a preset and re-render current tab
function setFilterPreset(preset) {
  dateFilter.preset = preset;
  dateFilter.from = null;
  dateFilter.to   = null;
  tableShown = {}; // reset pagination when filter changes
  switchTab(activeTab);
}

// Parse a YYYY-MM-DD string as LOCAL midnight (not UTC).
// new Date('2026-05-28') gives UTC midnight = 03:00 in Nairobi (UTC+3),
// so day comparisons can exclude the selected day entirely.
// Parsing manually as local midnight fixes this for all timezones east of UTC.
function parseDateInputAsLocal(str) {
  if (!str) return null;
  const parts = str.split('-');
  if (parts.length !== 3) return new Date(str);
  return new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
}

// Apply custom date range from inputs
function applyCustomFilter() {
  const fromVal = document.getElementById('filter-from') ? document.getElementById('filter-from').value : '';
  const toVal   = document.getElementById('filter-to')   ? document.getElementById('filter-to').value   : '';
  dateFilter.preset = 'custom';
  dateFilter.from = parseDateInputAsLocal(fromVal);
  dateFilter.to   = parseDateInputAsLocal(toVal);
  tableShown = {};
  switchTab(activeTab);
}

// Clear all filters
function clearFilter() {
  dateFilter = { preset: 'all', from: null, to: null };
  tableShown = {};
  switchTab(activeTab);
}

// ── Auto-Refresh State ────────────────────────────────────────────────────────
let arEnabled      = false;
let arIntervalMins = 15;       // selected interval in minutes
let arTimerId      = null;     // setInterval handle
let arCountdownId  = null;     // setInterval for the 1-second ticker
let arSecondsLeft  = 0;        // countdown seconds remaining
const CIRCUMFERENCE = 2 * Math.PI * 13; // matches r="13" in the SVG ring

// ── Toggle auto-refresh on/off ────────────────────────────────────────────────
function toggleAutoRefresh(on) {
  arEnabled = on;
  if (on) {
    startAutoRefresh();
  } else {
    stopAutoRefresh();
  }
  updateArUI();
}

// ── Set interval and restart if currently running ─────────────────────────────
function setRefreshInterval(mins) {
  arIntervalMins = mins;
  // Update button styles
  document.querySelectorAll('.ar-interval-btn').forEach(btn => {
    btn.classList.toggle('active', parseInt(btn.dataset.mins) === mins);
  });
  if (arEnabled) {
    stopAutoRefresh();
    startAutoRefresh();
  }
  updateArUI();
}

// ── Start the interval + countdown ticker ─────────────────────────────────────
function startAutoRefresh() {
  stopAutoRefresh(); // clear any existing timers first
  arSecondsLeft = arIntervalMins * 60;
  tickCountdown();
  arCountdownId = setInterval(tickCountdown, 1000);
  // The actual data refresh fires when countdown hits 0 (handled inside tickCountdown)
}

// ── 1-second countdown tick ───────────────────────────────────────────────────
function tickCountdown() {
  if (!arEnabled) return;
  arSecondsLeft--;
  updateRingArc();
  updateCountdownLabel();

  if (arSecondsLeft <= 0) {
    // Time's up — do a silent background refresh
    silentRefresh();
    arSecondsLeft = arIntervalMins * 60; // reset
  }
}

// ── Stop all timers ───────────────────────────────────────────────────────────
function stopAutoRefresh() {
  if (arTimerId)     { clearInterval(arTimerId);     arTimerId     = null; }
  if (arCountdownId) { clearInterval(arCountdownId); arCountdownId = null; }
  arSecondsLeft = 0;
  updateRingArc();
  updateCountdownLabel();
}

// ── Silent refresh: fetch fresh data, re-render current tab without full reload ──
async function silentRefresh() {
  const ring = document.getElementById('refresh-ring');
  if (ring) ring.classList.add('spinning');

  try {
    // Re-discover sheets and fetch data quietly
    let tabNames = [];
    try { tabNames = await discoverSheets(); } catch(e) {}
    if (!tabNames.length) tabNames = ['Milk Intake', 'Production', 'Sales', 'Finance'];

    const newData = {};
    const newMeta = [];
    for (let i = 0; i < tabNames.length; i++) {
      try {
        const data = await fetchSheet(tabNames[i]);
        if (data.cols.length && data.rows.length) {
          if (isProductionSheet(tabNames[i], data.cols)) {
            data.rows = applyProductionCalculations(data.cols, data.rows);
          }
          newData[tabNames[i]] = data;
          newMeta.push({ name: tabNames[i], color: TAB_COLORS[newMeta.length % TAB_COLORS.length] });
        }
      } catch(e) {}
    }

    if (newMeta.length) {
      allData   = newData;
      sheetMeta = newMeta;
      tableShown = {};
      buildNav();
      // Re-render current tab without disrupting the user's position
      const dash = document.getElementById('dashboard');
      if (dash && !dash.classList.contains('hidden')) {
        dash.classList.add('refresh-flash');
        setTimeout(() => dash.classList.remove('refresh-flash'), 700);
        destroyCharts();
        dash.innerHTML = '';
        activeTab === '__overview__' ? renderOverview(dash) : renderSheet(activeTab, allData[activeTab] || {cols:[],rows:[]}, dash);
      }
      // Update timestamp
      document.getElementById('last-updated').textContent =
        'Updated ' + new Date().toLocaleTimeString('en-KE', { hour: '2-digit', minute: '2-digit' });
    }
  } catch(e) {
    // Silent failure — don't disrupt the user, just log
    console.warn('Silent refresh failed:', e);
  } finally {
    if (ring) ring.classList.remove('spinning');
  }
}

// ── Manual refresh button ─────────────────────────────────────────────────────
function triggerManualRefresh() {
  if (arEnabled) {
    // Reset countdown and refresh immediately
    arSecondsLeft = arIntervalMins * 60;
    updateRingArc();
    updateCountdownLabel();
  }
  loadAllData();
}

// ── Update the SVG ring arc based on countdown progress ───────────────────────
function updateRingArc() {
  const arc = document.getElementById('ring-arc');
  if (!arc) return;
  if (!arEnabled || arSecondsLeft <= 0) {
    arc.style.strokeDashoffset = CIRCUMFERENCE; // empty
    return;
  }
  const total    = arIntervalMins * 60;
  const progress = arSecondsLeft / total;               // 1 → 0 as time passes
  const offset   = CIRCUMFERENCE * (1 - progress);     // fills clockwise
  arc.style.strokeDashoffset = CIRCUMFERENCE - offset; // remaining arc
}

// ── Update the text countdown below "Updated …" ──────────────────────────────
function updateCountdownLabel() {
  const el = document.getElementById('refresh-countdown');
  if (!el) return;
  if (!arEnabled || arSecondsLeft <= 0) {
    el.textContent = '';
    el.className = 'refresh-countdown';
    return;
  }
  const m = Math.floor(arSecondsLeft / 60);
  const s = arSecondsLeft % 60;
  el.textContent = `Next refresh in ${m > 0 ? m + 'm ' : ''}${s}s`;
  el.className = 'refresh-countdown active';
}

// ── Sync sidebar status label ─────────────────────────────────────────────────
function updateArUI() {
  const status = document.getElementById('ar-status');
  if (!status) return;
  if (arEnabled) {
    const m = arIntervalMins;
    status.textContent = `Refreshing every ${m >= 60 ? '1 hour' : m + ' min'}`;
    status.className = 'ar-status live';
  } else {
    status.textContent = 'Off';
    status.className = 'ar-status';
  }
  // Sync toggle checkbox state
  const toggle = document.getElementById('ar-toggle-input');
  if (toggle) toggle.checked = arEnabled;
}
function detectUnit(sheetName, colName) {
  const s = (colName   || '').toLowerCase();
  const n = (sheetName || '').toLowerCase();
  if (/\b(l|ltr|litr|litre|liter|litres|liters|volume)\b/.test(s)) return 'L';
  if (/\b(b\/?f|c\/?f|brought.forward|carried.forward|opening|closing)\b/.test(s)) return 'L';
  if (n.includes('milk') || n.includes('dairy') || n.includes('prod'))  return 'L';
  if (/\b(kes|ksh|amount|revenue|cost|expense|income|profit|loss|price|value|sales|payment|cash|fee|total)\b/.test(s)) return 'KES';
  if (/\b(kg|kgs|kilogram|weight)\b/.test(s)) return 'kg';
  if (/\b(qty|quantity|units|pcs|pieces|count|no\.?|number)\b/.test(s)) return 'units';
  return '';
}

// ── Formatting ───────────────────────────────────────────────────────────────
// ── Chart label formatter ─────────────────────────────────────────────────────
// Converts raw gviz "Date(2026,4,28)" strings, JS Dates, or plain strings
// into a short DD/MM/YY label for chart axes.
function fmtChartLabel(v) {
  if (v == null) return '';
  const d = parseRowDate(v);
  if (d) {
    const dd = String(d.getDate()).padStart(2, '0');
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const yy = String(d.getFullYear()).slice(-2);
    return dd + '/' + mm + '/' + yy;
  }
  return String(v).substring(0, 10);
}

function fmt(v, dp) {
  if (v == null || isNaN(v)) return '—';
  return Number(v).toLocaleString('en-KE', { maximumFractionDigits: dp ?? 0, minimumFractionDigits: 0 });
}
function fmtU(v, unit, dp) {
  if (v == null || isNaN(v)) return '—';
  const n = Number(v).toLocaleString('en-KE', { maximumFractionDigits: dp ?? (Math.abs(v) > 999 ? 0 : 1), minimumFractionDigits: 0 });
  return unit ? `${n} ${unit}` : n;
}

// ── Production B/F → C/F calculation ─────────────────────────────────────────
// For production sheets:
//   C/F(L) = B/F(L) + Receipts(L) + Production(L) - Dispatches(L) - Wastage(L)
//   B/F of next row = C/F of current row
function applyProductionCalculations(cols, rows) {
  // Identify relevant columns (case-insensitive fuzzy match)
  function matchCol(patterns) {
    for (const pat of patterns) {
      const re = new RegExp(pat, 'i');
      const c = cols.find(c => re.test(c));
      if (c) return c;
    }
    return null;
  }

  const bfCol       = matchCol(['b\\/?f','brought.forward','opening.stock','opening.balance','balance.b\\/?f']);
  const cfCol       = matchCol(['c\\/?f','carried.forward','closing.stock','closing.balance','balance.c\\/?f']);
  const receiptCol  = matchCol(['receipt','recon','received','location.*in','incoming']);
  const prodCol     = matchCol(['production','produced','output']);
  const dispatchCol = matchCol(['dispatch','transfer.*out','sent.*out','other.location']);
  const wasteCol    = matchCol(['waste','staff.tea','wastage','loss','spoil','reject']);

  if (!bfCol || !cfCol) return rows; // Can't compute without both B/F and C/F columns

  const computed = rows.map((row, i) => {
    const newRow = { ...row };

    // Auto-fill B/F from previous row's C/F (skip first row)
    if (i > 0) {
      const prevCF = rows[i - 1][cfCol];
      if (prevCF != null && typeof prevCF === 'number') {
        newRow[bfCol] = prevCF;
        newRow['_bf_auto'] = true; // flag that B/F was auto-populated
      }
    }

    // Calculate C/F
    const bf       = typeof newRow[bfCol]  === 'number' ? newRow[bfCol]  : 0;
    const receipt  = receiptCol  && typeof newRow[receiptCol]  === 'number' ? newRow[receiptCol]  : 0;
    const prod     = prodCol     && typeof newRow[prodCol]     === 'number' ? newRow[prodCol]     : 0;
    const dispatch = dispatchCol && typeof newRow[dispatchCol] === 'number' ? newRow[dispatchCol] : 0;
    const waste    = wasteCol    && typeof newRow[wasteCol]    === 'number' ? newRow[wasteCol]    : 0;

    const calculatedCF = bf + receipt + prod - dispatch - waste;
    newRow[cfCol] = calculatedCF;
    newRow['_cf_calc'] = true; // flag that C/F was calculated

    return newRow;
  });

  return computed;
}

// Detect if a sheet is a production/milk balance sheet (has B/F and C/F columns)
// NOTE: "Milk Intake" sheets are NOT production balance sheets — they track raw intake per station.
// Only flag a sheet as production if it actually has B/F and C/F columns present.
function isProductionSheet(name, cols) {
  const n = (name || '').toLowerCase();
  // Milk Intake sheets are explicitly excluded — they use a different per-station renderer
  if (n.includes('intake') || n.includes('milk intake')) return false;
  const colStr = cols.join(' ').toLowerCase();
  const hasBF = /\bb\/?f\b/.test(colStr) || /brought.forward/.test(colStr) || /opening.stock/.test(colStr);
  const hasCF = /\bc\/?f\b/.test(colStr) || /carried.forward/.test(colStr) || /closing.stock/.test(colStr);
  // Must have actual B/F and C/F columns to be treated as a production balance sheet
  if (hasBF && hasCF) return true;
  // Also match by name only if it's a production sheet (not generic milk/dairy)
  if ((n.includes('prod') || n.includes('balance')) && hasBF) return true;
  return false;
}

// ── Sheet helpers ─────────────────────────────────────────────────────────────
function getNumCols(cols, rows) {
  return cols.filter(c => rows.some(r => typeof r[c] === 'number'));
}
function getLabelCol(cols, rows) {
  // Prefer first non-numeric, non-blank column; fallback to cols[0]
  const numSet = new Set(getNumCols(cols, rows));
  return cols.find(c => !numSet.has(c)) || cols[0];
}
function colSum(rows, col) {
  return rows.reduce((s, r) => s + (typeof r[col] === 'number' ? r[col] : 0), 0);
}
function makeCanvas(id, height) {
  const wrap = document.createElement('div');
  wrap.className = 'chart-container';
  wrap.style.height = (height || 240) + 'px';
  const c = document.createElement('canvas'); c.id = id;
  wrap.appendChild(c);
  return { wrap, canvas: c };
}
function tabColor(name) {
  const idx = sheetMeta.findIndex(s => s.name === name);
  return TAB_COLORS[idx >= 0 ? idx % TAB_COLORS.length : 0];
}
function tabId(name) { return 'nav-' + name.replace(/\W/g, '_'); }

// ── JSONP helper — bypasses CORS for Google gviz endpoint ────────────────────
let _jsonpCounter = 0;
function jsonpFetch(url, callbackParam) {
  return new Promise((resolve, reject) => {
    const cbName = '__gvizCb_' + (_jsonpCounter++);
    const script = document.createElement('script');
    const timer  = setTimeout(() => {
      cleanup();
      reject(new Error('Request timed out'));
    }, 12000);
    function cleanup() {
      clearTimeout(timer);
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
    }
    window[cbName] = function(data) { cleanup(); resolve(data); };
    script.onerror = () => { cleanup(); reject(new Error('Script load failed')); };
    script.src = url + (url.includes('?') ? '&' : '?') + callbackParam + '=' + cbName;
    document.head.appendChild(script);
  });
}

// ── Discover sheet tabs via gviz (sheet index 0..N until error) ───────────────
async function discoverSheets() {
  // Try to load sheets by gid index; gviz returns an error table when gid doesn't exist.
  // We also probe by known fallback names if that fails.
  // Primary strategy: use the Sheets API JSON export to get sheet names
  const feedUrl = `https://spreadsheets.google.com/feeds/worksheets/${FILE_ID}/public/basic?alt=json`;
  try {
    const data = await jsonpFetch(feedUrl, 'callback');
    if (data && data.feed && data.feed.entry) {
      return data.feed.entry.map(e => e.title.$t);
    }
  } catch(e) { /* fall through */ }
  return []; // caller will use fallback names
}

// ── Fetch one sheet's data via JSONP (no CORS issues) ────────────────────────
function fetchSheet(name) {
  const url = `https://docs.google.com/spreadsheets/d/${FILE_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(name)}`;
  return new Promise((resolve, reject) => {
    const cbName = '__gvizCb_' + (_jsonpCounter++);
    const script = document.createElement('script');
    const timer  = setTimeout(() => {
      cleanup();
      reject(new Error('Request timed out'));
    }, 12000);
    function cleanup() {
      clearTimeout(timer);
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
    }
    window[cbName] = function(raw) {
      cleanup();
      try {
        const json = (typeof raw === 'string') ? JSON.parse(raw) : raw;
        if (!json || !json.table) return reject(new Error('Empty table'));
        const cols = json.table.cols.map(c => (c.label || c.id || '').trim()).filter(Boolean);
        const rows = (json.table.rows || [])
          .map(r => {
            const obj = {};
            if (r && r.c) r.c.forEach((cell, i) => {
              if (cols[i] !== undefined) obj[cols[i]] = cell ? cell.v : null;
            });
            return obj;
          })
          .filter(r => Object.values(r).some(v => v !== null && v !== ''));
        resolve({ cols, rows });
      } catch(e) { reject(e); }
    };
    script.onerror = () => { cleanup(); reject(new Error('Script load failed — check sheet sharing')); };
    // tqx=out:json;responseHandler:cbName tells gviz to call our function
    script.src = `https://docs.google.com/spreadsheets/d/${FILE_ID}/gviz/tq?tqx=out:json;responseHandler:${cbName}&sheet=${encodeURIComponent(name)}`;
    document.head.appendChild(script);
  });
}

// ── Load everything ───────────────────────────────────────────────────────────
async function loadAllData() {
  // Reset UI
  document.getElementById('loading-state').classList.remove('hidden');
  document.getElementById('error-state').classList.add('hidden');
  document.getElementById('dashboard').classList.add('hidden');
  allData   = {};
  sheetMeta = [];
  tableShown = {};

  const setMsg = (msg, sub) => {
    document.getElementById('loading-msg').textContent = msg;
    if (sub) document.getElementById('loading-sub').textContent = sub;
  };

  try {
    // 1. Discover sheet tab names
    setMsg('Discovering sheet tabs…', 'Reading spreadsheet structure');
    let tabNames = [];
    try { tabNames = await discoverSheets(); } catch(e) { /* fallback below */ }

    // Fallback: if discovery failed or returned nothing, try known department names
    if (!tabNames.length) {
      tabNames = ['Milk Intake', 'Production', 'Sales', 'Finance'];
    }

    // 2. Fetch each tab's data
    const errors = [];
    for (let i = 0; i < tabNames.length; i++) {
      const name = tabNames[i];
      setMsg(`Loading "${name}"…`, `Tab ${i + 1} of ${tabNames.length}`);
      try {
        const data = await fetchSheet(name);
        if (data.cols.length && data.rows.length) {
          // Apply B/F → C/F calculations for production/balance sheets
          if (isProductionSheet(name, data.cols)) {
            data.rows = applyProductionCalculations(data.cols, data.rows);
          }
          allData[name] = data;
          sheetMeta.push({ name, color: TAB_COLORS[sheetMeta.length % TAB_COLORS.length] });
        }
      } catch(e) { errors.push(`${name}: ${e.message}`); }
    }

    if (!sheetMeta.length) throw new Error('No sheet data loaded. ' + errors.join(' | '));

    // 3. Build sidebar nav dynamically
    buildNav();

    // 4. Render
    document.getElementById('loading-state').classList.add('hidden');
    document.getElementById('dashboard').classList.remove('hidden');
    document.getElementById('last-updated').textContent =
      'Updated ' + new Date().toLocaleTimeString('en-KE', { hour: '2-digit', minute: '2-digit' });

    activeTab = '__overview__';
    switchTab('__overview__');
    // Re-sync the auto-refresh UI after nav rebuild
    updateArUI();

  } catch (err) {
    document.getElementById('loading-state').classList.add('hidden');
    document.getElementById('error-detail').innerHTML =
      err.message + '<br><br>Make sure the sheet is set to <strong>"Anyone with the link → Viewer"</strong> and published via <em>File → Share → Publish to web</em>.';
    document.getElementById('error-state').classList.remove('hidden');
  }
}

// ── Date helpers ──────────────────────────────────────────────────────────────
function getDateCol(cols, rows) {
  // First, try to find a column with date-like name
  const dateLike = cols.find(c => /\b(date|day|period|week|month|when|datum)\b/i.test(c));
  if (dateLike) return dateLike;
  
  // Then, check if first column looks like it contains dates
  if (cols.length > 0) {
    const firstCol = cols[0];
    const hasDates = rows.some(r => {
      const v = r[firstCol];
      if (v instanceof Date) return true;
      if (typeof v === 'string') {
        if (/^Date\(\d{4},\d{1,2},\d{1,2}\)/.test(v)) return true;
        if (/^\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4}/.test(v)) return true; // DD/MM/YYYY or MM/DD/YYYY
        const d = new Date(v);
        return !isNaN(d.getTime()) && d.getFullYear() > 1970;
      }
      return false;
    });
    if (hasDates) return firstCol;
  }
  
  // Finally, check all columns
  return cols.find(c => rows.some(r => {
    const v = r[c];
    if (v instanceof Date) return true;
    if (typeof v === 'string') {
      if (/^Date\(\d{4},\d{1,2},\d{1,2}\)/.test(v)) return true;
      if (/^\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4}/.test(v)) return true;
      const d = new Date(v);
      return !isNaN(d.getTime()) && d.getFullYear() > 1970;
    }
    return false;
  })) || null;
}

function parseRowDate(v) {
  if (!v) return null;
  if (v instanceof Date) return isNaN(v.getTime()) ? null : v;
  if (typeof v === 'string') {
    // Google Sheets gviz returns dates as "Date(yyyy,m,d)" — month is 0-indexed
    const gviz = v.match(/^Date\((\d{4}),(\d{1,2}),(\d{1,2})\)/);
    if (gviz) {
      const d = new Date(parseInt(gviz[1]), parseInt(gviz[2]), parseInt(gviz[3]));
      return isNaN(d.getTime()) ? null : d;
    }
    // Handle "dd/mm/yyyy" or "dd-mm-yyyy" format (most common)
    const dmy = v.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
    if (dmy) {
      const day = parseInt(dmy[1], 10);
      const month = parseInt(dmy[2], 10);
      const year = parseInt(dmy[3], 10);
      const d = new Date(year, month - 1, day);
      if (!isNaN(d.getTime()) && d.getFullYear() > 1970) return d;
    }
    // Try generic date parsing as fallback
    const d = new Date(v);
    return !isNaN(d.getTime()) && d.getFullYear() > 1970 ? d : null;
  }
  if (typeof v === 'number') { const d = new Date(v); return !isNaN(d.getTime()) && d.getFullYear() > 1970 ? d : null; }
  return null;
}

// Returns rows for the target day and the previous day, plus labels.
// • When no date filter is active (preset === 'all'):  anchors to TODAY's actual
//   system date.  If no data exists for today, falls back to the latest available
//   date in the data so the cards are never empty.
// • When a filter is active: uses the latest date inside the filtered window,
//   exactly as the user requested.
// Skips days where every numeric cell is 0 or null (e.g. a date row with no data yet).
function getLatestRows(rows, dateCol) {
  const fallback = { today: rows.slice(-1), prev: rows.slice(-2,-1), latestDate: null, label: 'Latest', prevLabel: 'Previous' };
  if (!dateCol) return fallback;
  const dated = rows.map(r => ({ row: r, d: parseRowDate(r[dateCol]) })).filter(x => x.d);
  if (!dated.length) return fallback;
  dated.sort((a, b) => b.d - a.d);

  // Group by date string
  const byDate = [];
  dated.forEach(({ row, d }) => {
    const key = d.toDateString();
    let grp = byDate.find(g => g.key === key);
    if (!grp) { grp = { key, d, rows: [] }; byDate.push(grp); }
    grp.rows.push(row);
  });

  // Find a group that has at least one non-zero numeric value
  function hasRealData(grpRows) {
    return grpRows.some(r =>
      Object.values(r).some(v => typeof v === 'number' && v !== 0 && !isNaN(v))
    );
  }

  let latestGrp;
  let todayMissing = false; // true when today has no data yet (no-filter mode only)

  if (dateFilter.preset === 'all') {
    // ── No filter: try to show TODAY first ───────────────────────────────────
    const sysToday = new Date();
    sysToday.setHours(0, 0, 0, 0);
    const todayKey = sysToday.toDateString();

    const todayGrp = byDate.find(g => g.key === todayKey);
    if (todayGrp && hasRealData(todayGrp.rows)) {
      // Today's data exists and has real values — use it
      latestGrp = todayGrp;
    } else {
      // Today has no data yet — flag it and fall back to latest available date
      todayMissing = true;
      latestGrp = byDate.find(g => hasRealData(g.rows)) || byDate[0];
    }
  } else {
    // ── Filter active: use latest date inside the filtered window ─────────────
    latestGrp = byDate.find(g => hasRealData(g.rows)) || byDate[0];
  }

  const prevGrp = byDate.find(g => g.key !== latestGrp.key && hasRealData(g.rows))
               || byDate.find(g => g.key !== latestGrp.key);

  const fd = d => d.toLocaleDateString('en-KE', { weekday:'short', day:'numeric', month:'short' });
  return {
    today:        latestGrp.rows,
    prev:         prevGrp ? prevGrp.rows : [],
    latestDate:   latestGrp.d,
    label:        fd(latestGrp.d),
    prevLabel:    prevGrp ? fd(prevGrp.d) : '—',
    todayMissing, // true → today's row not in sheet yet
  };
}

function pct(a, b) { if (!b) return null; return ((a - b) / Math.abs(b)) * 100; }

function trendBadge(p, reverse) {
  if (p === null) return `<span class="tb-flat">— n/a</span>`;
  const good = reverse ? p < -5 : p > 5;
  const bad  = reverse ? p > 5  : p < -5;
  const txt  = (p > 0 ? '+' : '') + p.toFixed(1) + '%';
  if (good) return `<span class="tb-up">▲ ${txt}</span>`;
  if (bad)  return `<span class="tb-dn">▼ ${txt}</span>`;
  return `<span class="tb-flat">→ ${txt}</span>`;
}

// Sum a column for a set of rows
function sumCol(rows, col) {
  return rows.reduce((s, r) => s + (typeof r[col] === 'number' ? r[col] : 0), 0);
}

// Find column by keyword patterns in name
function findCol(cols, patterns) {
  for (const pat of patterns) {
    const re = new RegExp(pat, 'i');
    const c = cols.find(c => re.test(c));
    if (c) return c;
  }
  return null;
}

// Get last N days aggregated data: [{label, vals:{col: total}}]
function getDailyAgg(rows, dateCol, valueCols, n) {
  const byDay = {};
  rows.forEach(r => {
    const d = dateCol ? parseRowDate(r[dateCol]) : null;
    const key = d ? d.toDateString() : '__single__';
    if (!byDay[key]) byDay[key] = { d: d || new Date(0), totals: {} };
    valueCols.forEach(col => {
      byDay[key].totals[col] = (byDay[key].totals[col] || 0) + (typeof r[col] === 'number' ? r[col] : 0);
    });
  });
  return Object.values(byDay)
    .sort((a, b) => a.d - b.d)
    .slice(-n)
    .map(x => ({
      label: x.d.getFullYear() > 1970 ? x.d.toLocaleDateString('en-KE', { day:'numeric', month:'short' }) : 'Entry',
      totals: x.totals,
      d: x.d
    }));
}

    : `Department Snapshots · ${filterDescription() || 'Filtered Period'}`;

    const dateCol = getDateCol(cols, rawRows);
    const rows = applyDateFilter(rawRows, dateCol);
    const { today: todayRows, prev: prevRows, label, prevLabel, todayMissing } = getLatestRows(rows, dateCol);
    const n  = name.toLowerCase();

    const card = document.createElement('div');

    body.className = 'snap-body';
