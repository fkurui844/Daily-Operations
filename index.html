<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dairy Operations Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f4f1eb; --surface: #ffffff; --border: #e8e3d8;
    --text: #1a1714; --text-muted: #7a7268; --text-faint: #b0a99e;
    --green: #2d6a4f; --green-light: #d8f3dc;
    --amber: #b5460f; --amber-light: #fde8d8;
    --blue: #1b4f72; --blue-light: #d6eaf8;
    --teal: #0e6655; --teal-light: #d5f5e3;
    --purple: #6b3fa0; --purple-light: #ede0ff;
    --coral: #a0402a; --coral-light: #fde0d8;
    --radius: 10px; --radius-lg: 16px;
  }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; line-height: 1.5; }

  .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 2rem; position: sticky; top: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; height: 60px; }
  .header-brand { display: flex; align-items: center; gap: 10px; }
  .brand-icon { width: 32px; height: 32px; border-radius: 8px; background: var(--green); display: flex; align-items: center; justify-content: center; font-size: 16px; }
  .brand-name { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; }
  .brand-sub { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
  .header-right { font-size: 12px; color: var(--text-muted); font-family: 'DM Mono', monospace; }

  .layout { display: flex; min-height: calc(100vh - 60px); }

  .sidebar { width: 210px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); padding: 1.25rem 0; position: sticky; top: 60px; height: calc(100vh - 60px); overflow-y: auto; }
  .sidebar-section { padding: 0 1rem; margin-bottom: 1.5rem; }
  .sidebar-label { font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-faint); padding: 0 0.5rem; margin-bottom: 4px; }
  .nav-item { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 8px; cursor: pointer; transition: all 0.15s; font-size: 13px; color: var(--text-muted); border: none; background: none; width: 100%; text-align: left; font-family: 'DM Sans', sans-serif; }
  .nav-item:hover { background: var(--bg); color: var(--text); }
  .nav-item.active { background: var(--green-light); color: var(--green); font-weight: 500; }
  .nav-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  #nav-tabs { /* dynamic */ }

  .main { flex: 1; padding: 1.75rem 2rem; overflow-x: hidden; max-width: calc(100vw - 210px); }

  .page-header { margin-bottom: 1.5rem; }
  .page-title { font-size: 22px; font-weight: 600; letter-spacing: -0.5px; }
  .page-subtitle { font-size: 13px; color: var(--text-muted); margin-top: 3px; }

  .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(155px, 1fr)); gap: 12px; margin-bottom: 1.75rem; }
  .metric-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1.1rem 1.25rem; }
  .metric-label { font-size: 11px; font-weight: 500; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
  .metric-value { font-size: 24px; font-weight: 600; letter-spacing: -0.8px; line-height: 1.1; }
  .metric-unit { font-size: 13px; font-weight: 400; color: var(--text-muted); margin-left: 3px; }
  .metric-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; padding: 3px 8px; border-radius: 20px; margin-top: 6px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1.25rem; margin-bottom: 1rem; }
  .card-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 1rem; }
  .card-title { font-size: 14px; font-weight: 600; }
  .card-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

  .chart-container { position: relative; }
  .charts-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1rem; margin-bottom: 1rem; }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead tr { border-bottom: 1px solid var(--border); }
  th { padding: 8px 12px; text-align: left; font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap; }
  td { padding: 9px 12px; border-bottom: 1px solid var(--border); color: var(--text); }
  tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--bg); }
  .td-num { font-family: 'DM Mono', monospace; font-size: 12px; text-align: right; }

  .state-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 3rem 2rem; text-align: center; }
  .spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--green); border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 1rem; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .state-title { font-size: 15px; font-weight: 500; margin-bottom: 6px; }
  .state-sub { font-size: 13px; color: var(--text-muted); max-width: 440px; margin: 0 auto; line-height: 1.6; }
  .error-box { border-color: #f5c6c6; background: #fff8f8; }

  .legend { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted); }
  .legend-swatch { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }

  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 8px; font-size: 13px; font-weight: 500; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; transition: all 0.15s; font-family: 'DM Sans', sans-serif; }
  .btn:hover { background: var(--bg); }
  .btn-primary { background: var(--green); color: white; border-color: var(--green); }
  .btn-primary:hover { background: #245a41; }
  .show-more-wrap { text-align: center; padding: 12px 0 4px; }

  .summary-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 1.75rem; background: var(--surface); }
  .sbi { padding: 1rem 1.25rem; border-right: 1px solid var(--border); cursor: pointer; transition: background 0.15s; }
  .sbi:last-child { border-right: none; }
  .sbi:hover { background: var(--bg); }
  .sbi.active { background: var(--green-light); }
  .sbi-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-faint); margin-bottom: 4px; }
  .sbi-value { font-size: 18px; font-weight: 600; letter-spacing: -0.5px; word-break: break-all; }
  .sbi-sub { font-size: 11px; color: var(--text-muted); margin-top: 3px; }

  .hidden { display: none !important; }
  .fade-in { animation: fadeIn 0.25s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

  @media (max-width: 768px) { .sidebar { display: none; } .main { max-width: 100vw; padding: 1rem; } .header { padding: 0 1rem; } }
</style>
</head>
<body>

<header class="header">
  <div class="header-brand">
    <div class="brand-icon">🥛</div>
    <div>
      <div class="brand-name">Dairy Operations</div>
      <div class="brand-sub">Live Dashboard</div>
    </div>
  </div>
  <div class="header-right" id="last-updated">Loading…</div>
</header>

<div class="layout">
  <nav class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">Departments</div>
      <div id="nav-tabs">
        <!-- Populated dynamically after sheets load -->
        <button class="nav-item active" onclick="switchTab('__overview__')" id="nav-__overview__">
          <span class="nav-dot" style="background:#888"></span> Overview
        </button>
      </div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-label">Actions</div>
      <button class="nav-item" onclick="loadAllData()">↻ Refresh data</button>
    </div>
  </nav>
  <main class="main">
    <div id="loading-state" class="state-box">
      <div class="spinner"></div>
      <div class="state-title" id="loading-msg">Connecting to Google Sheets…</div>
      <div class="state-sub" id="loading-sub">Discovering sheet tabs…</div>
    </div>
    <div id="error-state" class="state-box error-box hidden">
      <div style="font-size:28px;margin-bottom:10px">⚠️</div>
      <div class="state-title">Could not load data</div>
      <div class="state-sub" id="error-detail"></div>
      <br><button class="btn btn-primary" onclick="loadAllData()">Try again</button>
    </div>
    <div id="dashboard" class="hidden"></div>
  </main>
</div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// CONFIG — only the spreadsheet ID is fixed. Everything else is discovered.
// ─────────────────────────────────────────────────────────────────────────────
const FILE_ID = '13LiH5I_0qdB6REtOx26cOpBBQLhkJceArjNwc1uUPPM';

// Colour palette rotated across however many tabs are found
const TAB_COLORS = [
  { main: '#2d6a4f', light: '#d8f3dc', badge: 'green' },
  { main: '#c97b2a', light: '#fde8d8', badge: 'amber' },
  { main: '#1b4f72', light: '#d6eaf8', badge: 'blue'  },
  { main: '#0e6655', light: '#d5f5e3', badge: 'teal'  },
  { main: '#6b3fa0', light: '#ede0ff', badge: 'purple'},
  { main: '#a0402a', light: '#fde0d8', badge: 'coral' },
];
// CSS for badge classes (injected once)
const BADGE_CSS = `
  .badge-green  { background:#d8f3dc; color:#2d6a4f; }
  .badge-amber  { background:#fde8d8; color:#b5460f; }
  .badge-blue   { background:#d6eaf8; color:#1b4f72; }
  .badge-teal   { background:#d5f5e3; color:#0e6655; }
  .badge-purple { background:#ede0ff; color:#6b3fa0; }
  .badge-coral  { background:#fde0d8; color:#a0402a; }
`;
const styleEl = document.createElement('style');
styleEl.textContent = BADGE_CSS;
document.head.appendChild(styleEl);

// ── State ────────────────────────────────────────────────────────────────────
let sheetMeta   = [];   // [{ name, color }]  — discovered at runtime
let allData     = {};   // { sheetName: { cols, rows } }
let activeTab   = '__overview__';
let chartInst   = {};
let tableShown  = {};   // how many rows are shown per tab

// ── Unit detection ───────────────────────────────────────────────────────────
function detectUnit(sheetName, colName) {
  const s = (colName   || '').toLowerCase();
  const n = (sheetName || '').toLowerCase();
  if (/\b(l|ltr|litr|litre|liter|litres|liters|volume)\b/.test(s)) return 'L';
  if (n.includes('milk'))  return 'L';
  if (/\b(kes|ksh|amount|revenue|cost|expense|income|profit|loss|price|value|sales|payment|cash|fee|total)\b/.test(s)) return 'KES';
  if (/\b(kg|kgs|kilogram|weight)\b/.test(s)) return 'kg';
  if (/\b(qty|quantity|units|pcs|pieces|count|no\.?|number)\b/.test(s)) return 'units';
  return '';
}

// ── Formatting ───────────────────────────────────────────────────────────────
function fmt(v, dp) {
  if (v == null || isNaN(v)) return '—';
  return Number(v).toLocaleString('en-KE', { maximumFractionDigits: dp ?? 0, minimumFractionDigits: 0 });
}
function fmtU(v, unit, dp) {
  if (v == null || isNaN(v)) return '—';
  const n = Number(v).toLocaleString('en-KE', { maximumFractionDigits: dp ?? (Math.abs(v) > 999 ? 0 : 1), minimumFractionDigits: 0 });
  return unit ? `${n} ${unit}` : n;
}

// ── Sheet helpers ─────────────────────────────────────────────────────────────
function getNumCols(cols, rows) {
  return cols.filter(c => rows.some(r => typeof r[c] === 'number'));
}
function getLabelCol(cols, rows) {
  // Prefer first non-numeric, non-blank column; fallback to cols[0]
  const numSet = new Set(getNumCols(cols, rows));
  return cols.find(c => !numSet.has(c)) || cols[0];
}
function colSum(rows, col) {
  return rows.reduce((s, r) => s + (typeof r[col] === 'number' ? r[col] : 0), 0);
}
function makeCanvas(id, height) {
  const wrap = document.createElement('div');
  wrap.className = 'chart-container';
  wrap.style.height = (height || 240) + 'px';
  const c = document.createElement('canvas'); c.id = id;
  wrap.appendChild(c);
  return { wrap, canvas: c };
}
function tabColor(name) {
  const idx = sheetMeta.findIndex(s => s.name === name);
  return TAB_COLORS[idx >= 0 ? idx % TAB_COLORS.length : 0];
}
function tabId(name) { return 'nav-' + name.replace(/\W/g, '_'); }

// ── JSONP helper — bypasses CORS for Google gviz endpoint ────────────────────
let _jsonpCounter = 0;
function jsonpFetch(url, callbackParam) {
  return new Promise((resolve, reject) => {
    const cbName = '__gvizCb_' + (_jsonpCounter++);
    const script = document.createElement('script');
    const timer  = setTimeout(() => {
      cleanup();
      reject(new Error('Request timed out'));
    }, 12000);
    function cleanup() {
      clearTimeout(timer);
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
    }
    window[cbName] = function(data) { cleanup(); resolve(data); };
    script.onerror = () => { cleanup(); reject(new Error('Script load failed')); };
    script.src = url + (url.includes('?') ? '&' : '?') + callbackParam + '=' + cbName;
    document.head.appendChild(script);
  });
}

// ── Discover sheet tabs via gviz (sheet index 0..N until error) ───────────────
async function discoverSheets() {
  // Try to load sheets by gid index; gviz returns an error table when gid doesn't exist.
  // We also probe by known fallback names if that fails.
  // Primary strategy: use the Sheets API JSON export to get sheet names
  const feedUrl = `https://spreadsheets.google.com/feeds/worksheets/${FILE_ID}/public/basic?alt=json`;
  try {
    const data = await jsonpFetch(feedUrl, 'callback');
    if (data && data.feed && data.feed.entry) {
      return data.feed.entry.map(e => e.title.$t);
    }
  } catch(e) { /* fall through */ }
  return []; // caller will use fallback names
}

// ── Fetch one sheet's data via JSONP (no CORS issues) ────────────────────────
function fetchSheet(name) {
  const url = `https://docs.google.com/spreadsheets/d/${FILE_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(name)}`;
  return new Promise((resolve, reject) => {
    const cbName = '__gvizCb_' + (_jsonpCounter++);
    const script = document.createElement('script');
    const timer  = setTimeout(() => {
      cleanup();
      reject(new Error('Request timed out'));
    }, 12000);
    function cleanup() {
      clearTimeout(timer);
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
    }
    window[cbName] = function(raw) {
      cleanup();
      try {
        const json = (typeof raw === 'string') ? JSON.parse(raw) : raw;
        if (!json || !json.table) return reject(new Error('Empty table'));
        const cols = json.table.cols.map(c => (c.label || c.id || '').trim()).filter(Boolean);
        const rows = (json.table.rows || [])
          .map(r => {
            const obj = {};
            if (r && r.c) r.c.forEach((cell, i) => {
              if (cols[i] !== undefined) obj[cols[i]] = cell ? cell.v : null;
            });
            return obj;
          })
          .filter(r => Object.values(r).some(v => v !== null && v !== ''));
        resolve({ cols, rows });
      } catch(e) { reject(e); }
    };
    script.onerror = () => { cleanup(); reject(new Error('Script load failed — check sheet sharing')); };
    // tqx=out:json;responseHandler:cbName tells gviz to call our function
    script.src = `https://docs.google.com/spreadsheets/d/${FILE_ID}/gviz/tq?tqx=out:json;responseHandler:${cbName}&sheet=${encodeURIComponent(name)}`;
    document.head.appendChild(script);
  });
}

// ── Load everything ───────────────────────────────────────────────────────────
async function loadAllData() {
  // Reset UI
  document.getElementById('loading-state').classList.remove('hidden');
  document.getElementById('error-state').classList.add('hidden');
  document.getElementById('dashboard').classList.add('hidden');
  allData   = {};
  sheetMeta = [];
  tableShown = {};

  const setMsg = (msg, sub) => {
    document.getElementById('loading-msg').textContent = msg;
    if (sub) document.getElementById('loading-sub').textContent = sub;
  };

  try {
    // 1. Discover sheet tab names
    setMsg('Discovering sheet tabs…', 'Reading spreadsheet structure');
    let tabNames = [];
    try { tabNames = await discoverSheets(); } catch(e) { /* fallback below */ }

    // Fallback: if discovery failed or returned nothing, try known department names
    if (!tabNames.length) {
      tabNames = ['Milk Intake', 'Production', 'Sales', 'Finance'];
    }

    // 2. Fetch each tab's data
    const errors = [];
    for (let i = 0; i < tabNames.length; i++) {
      const name = tabNames[i];
      setMsg(`Loading "${name}"…`, `Tab ${i + 1} of ${tabNames.length}`);
      try {
        const data = await fetchSheet(name);
        if (data.cols.length && data.rows.length) {
          allData[name] = data;
          sheetMeta.push({ name, color: TAB_COLORS[sheetMeta.length % TAB_COLORS.length] });
        }
      } catch(e) { errors.push(`${name}: ${e.message}`); }
    }

    if (!sheetMeta.length) throw new Error('No sheet data loaded. ' + errors.join(' | '));

    // 3. Build sidebar nav dynamically
    buildNav();

    // 4. Render
    document.getElementById('loading-state').classList.add('hidden');
    document.getElementById('dashboard').classList.remove('hidden');
    document.getElementById('last-updated').textContent =
      'Updated ' + new Date().toLocaleTimeString('en-KE', { hour: '2-digit', minute: '2-digit' });

    activeTab = '__overview__';
    switchTab('__overview__');

  } catch (err) {
    document.getElementById('loading-state').classList.add('hidden');
    document.getElementById('error-detail').innerHTML =
      err.message + '<br><br>Make sure the sheet is set to <strong>"Anyone with the link → Viewer"</strong> and published via <em>File → Share → Publish to web</em>.';
    document.getElementById('error-state').classList.remove('hidden');
  }
}

// ── Build sidebar nav from discovered sheets ──────────────────────────────────
function buildNav() {
  const container = document.getElementById('nav-tabs');
  container.innerHTML = `
    <button class="nav-item active" onclick="switchTab('__overview__')" id="nav-__overview__">
      <span class="nav-dot" style="background:#888"></span> Overview
    </button>`;
  sheetMeta.forEach(({ name, color }) => {
    const btn = document.createElement('button');
    btn.className = 'nav-item';
    btn.id = tabId(name);
    btn.onclick = () => switchTab(name);
    btn.innerHTML = `<span class="nav-dot" style="background:${color.main}"></span> ${name}`;
    container.appendChild(btn);
  });
}

// ── Tab switching ─────────────────────────────────────────────────────────────
function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const el = document.getElementById(tab === '__overview__' ? 'nav-__overview__' : tabId(tab));
  if (el) el.classList.add('active');
  destroyCharts();
  const dash = document.getElementById('dashboard');
  dash.innerHTML = '';
  tab === '__overview__' ? renderOverview(dash) : renderSheet(tab, allData[tab], dash);
}

function destroyCharts() {
  Object.values(chartInst).forEach(c => { try { c.destroy(); } catch(e){} });
  chartInst = {};
}

// ── Overview helpers ──────────────────────────────────────────────────────────
function getDateCol(cols, rows) {
  // Find a column that looks like a date column
  const dateLike = cols.find(c => {
    const s = c.toLowerCase();
    return /\b(date|day|period|week|month)\b/.test(s);
  });
  if (dateLike) return dateLike;
  // Fallback: first column where values look like dates (JS Date objects or parseable strings)
  return cols.find(c => rows.some(r => {
    const v = r[c];
    if (v instanceof Date) return true;
    if (typeof v === 'string') { const d = new Date(v); return !isNaN(d.getTime()); }
    return false;
  })) || null;
}

function parseRowDate(v) {
  if (!v) return null;
  if (v instanceof Date) return isNaN(v.getTime()) ? null : v;
  if (typeof v === 'string') { const d = new Date(v); return isNaN(d.getTime()) ? null : d; }
  if (typeof v === 'number') { const d = new Date(v); return isNaN(d.getTime()) ? null : d; }
  return null;
}

function getLatestRows(rows, dateCol) {
  if (!dateCol) return { today: rows.slice(-1), prev: rows.slice(-2, -1), label: 'Latest entry', prevLabel: 'Previous entry' };
  const dated = rows.map(r => ({ row: r, d: parseRowDate(r[dateCol]) })).filter(x => x.d);
  if (!dated.length) return { today: rows.slice(-1), prev: rows.slice(-2, -1), label: 'Latest entry', prevLabel: 'Previous entry' };
  dated.sort((a, b) => b.d - a.d);
  const latestDate = dated[0].d;
  const latestDay  = latestDate.toDateString();
  const todayRows  = dated.filter(x => x.d.toDateString() === latestDay).map(x => x.row);
  // Previous day
  const prevDated  = dated.filter(x => x.d.toDateString() !== latestDay);
  const prevDay    = prevDated.length ? prevDated[0].d.toDateString() : null;
  const prevRows   = prevDay ? prevDated.filter(x => x.d.toDateString() === prevDay).map(x => x.row) : [];
  const fmtDay = d => d ? new Date(d).toLocaleDateString('en-KE', { weekday: 'short', day: 'numeric', month: 'short' }) : '';
  return { today: todayRows, prev: prevRows, label: fmtDay(latestDate), prevLabel: fmtDay(prevDay ? new Date(prevDay) : null) };
}

function pct(a, b) { if (!b) return null; return ((a - b) / Math.abs(b)) * 100; }

function trendArrow(p) {
  if (p === null) return { icon: '—', cls: 'trend-flat', text: 'n/a' };
  if (p > 5)  return { icon: '↑', cls: 'trend-up',   text: '+' + p.toFixed(1) + '%' };
  if (p < -5) return { icon: '↓', cls: 'trend-down', text: p.toFixed(1) + '%' };
  return { icon: '→', cls: 'trend-flat', text: (p > 0 ? '+' : '') + p.toFixed(1) + '%' };
}

// Get last N days of daily totals for a sparkline
function getDailyTotals(rows, dateCol, valueCol, n) {
  if (!dateCol) {
    return rows.slice(-n).map((r, i) => ({ label: String(i + 1), val: typeof r[valueCol] === 'number' ? r[valueCol] : 0 }));
  }
  const dated = rows.map(r => ({ val: typeof r[valueCol] === 'number' ? r[valueCol] : 0, d: parseRowDate(r[dateCol]) })).filter(x => x.d);
  const byDay = {};
  dated.forEach(({ val, d }) => {
    const key = d.toDateString();
    byDay[key] = (byDay[key] || { d, total: 0 });
    byDay[key].total += val;
  });
  const days = Object.values(byDay).sort((a, b) => a.d - b.d).slice(-n);
  return days.map(x => ({ label: x.d.toLocaleDateString('en-KE', { day: 'numeric', month: 'short' }), val: x.total }));
}

    <div class="page-header" style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:8px;">
      <div>
        <div class="page-title">Daily Performance Overview</div>
        <div class="page-subtitle">${today} · ${sheetMeta.length} department${sheetMeta.length !== 1 ? 's' : ''} · live data</div>
      </div>
      <button class="btn btn-primary" onclick="loadAllData()" style="margin-top:4px;">↻ Refresh</button>
    </div>`;

  // ── 1. KPI Cards (today vs previous period) ────────────────────────────────
  const kpiTitle = document.createElement('div');
  kpiTitle.className = 'ov-section-title';
  kpiTitle.textContent = '📊 Key Performance Indicators — Latest vs Previous Period';
  container.appendChild(kpiTitle);

  const kpiGrid = document.createElement('div');
  kpiGrid.className = 'ov-kpi-grid';

  const alerts = [];

  sheetMeta.forEach(({ name, color }, si) => {
    const sheet   = allData[name];
    const nums    = getNumCols(sheet.cols, sheet.rows);
    if (!nums.length) return;
    const dateCol = getDateCol(sheet.cols, sheet.rows);
    const { today: todayRows, prev: prevRows, label, prevLabel } = getLatestRows(sheet.rows, dateCol);

    nums.slice(0, 3).forEach((col, ci) => {
      const unit     = detectUnit(name, col);
      const todayVal = todayRows.reduce((s, r) => s + (typeof r[col] === 'number' ? r[col] : 0), 0);
      const prevVal  = prevRows.reduce((s, r) => s + (typeof r[col] === 'number' ? r[col] : 0), 0);
      const change   = pct(todayVal, prevVal);
      const trend    = trendArrow(change);
      // Progress vs max ever
      const allVals  = sheet.rows.map(r => typeof r[col] === 'number' ? r[col] : 0);
      const maxVal   = Math.max(...allVals);
      const pctOfMax = maxVal ? (todayVal / maxVal) * 100 : 0;

      // Generate alerts
      if (change !== null && change < -15) alerts.push({ type: 'warn', sheet: name, col, change, label });
      if (change !== null && change > 20)  alerts.push({ type: 'good', sheet: name, col, change, label });

      const card = document.createElement('div');
      card.className = 'ov-kpi';
      card.onclick   = () => switchTab(name);
      card.style.borderTop = `3px solid ${color.main}`;
      card.innerHTML = `
        <div class="ov-kpi-top">
          <div>
            <div class="ov-kpi-label">${col}</div>
            <div class="ov-kpi-sheet">${name}</div>
          </div>
          <span class="${trend.cls}">${trend.icon} ${trend.text}</span>
        </div>
        <div class="ov-kpi-value" style="color:${color.main}">${fmtU(todayVal, unit)}</div>
        <div class="ov-kpi-footer">
          <span class="ov-kpi-prev">Prev: ${fmtU(prevVal, unit) || '—'}</span>
          <span style="font-size:11px;color:var(--text-faint)">${label}</span>
        </div>
        <div class="ov-kpi-bar"><div class="ov-kpi-bar-fill" style="width:${Math.min(pctOfMax,100)}%;background:${color.main}"></div></div>
      `;
      kpiGrid.appendChild(card);
    });
  });
  container.appendChild(kpiGrid);

  // ── 2. Alerts / Flags ─────────────────────────────────────────────────────
  if (alerts.length) {
    const aTitle = document.createElement('div');
    aTitle.className = 'ov-section-title';
    aTitle.textContent = '🚦 Management Alerts';
    container.appendChild(aTitle);
    const aWrap = document.createElement('div');
    alerts.forEach(a => {
      const isWarn = a.type === 'warn';
      const div = document.createElement('div');
      div.className = `ov-alert ov-alert-${a.type}`;
      div.innerHTML = `
        <div class="ov-alert-icon">${isWarn ? '⚠️' : '✅'}</div>
        <div class="ov-alert-text">
          <div class="ov-alert-title">${isWarn ? 'Decline detected' : 'Strong performance'}: ${a.col} (${a.sheet})</div>
          <div class="ov-alert-sub">${isWarn ? 'Down' : 'Up'} ${Math.abs(a.change).toFixed(1)}% compared to previous period · as of ${a.label}</div>
        </div>`;
      aWrap.appendChild(div);
    });
    container.appendChild(aWrap);
  }

  // ── 3. Trend Charts — last 14 periods per sheet ───────────────────────────
  const trendTitle = document.createElement('div');
  trendTitle.className = 'ov-section-title';
  trendTitle.textContent = '📈 14-Period Trend — Primary Metric per Department';
  container.appendChild(trendTitle);

  const trendGrid = document.createElement('div');
  trendGrid.className = 'ov-three-col';

  sheetMeta.forEach(({ name, color }) => {
    const sheet   = allData[name];
    const nums    = getNumCols(sheet.cols, sheet.rows);
    if (!nums.length || sheet.rows.length < 2) return;
    const dateCol  = getDateCol(sheet.cols, sheet.rows);
    const valueCol = nums[0];
    const unit     = detectUnit(name, valueCol);
    const daily    = getDailyTotals(sheet.rows, dateCol, valueCol, 14);
    const vals     = daily.map(d => d.val);
    const total    = vals.reduce((a, b) => a + b, 0);
    const avg      = vals.length ? total / vals.length : 0;
    const latest   = vals[vals.length - 1] || 0;
    const latestChg = pct(latest, avg);
    const trend    = trendArrow(latestChg);

    const card = document.createElement('div');
    card.className = 'card';
    card.style.cursor = 'pointer';
    card.onclick = () => switchTab(name);
    card.innerHTML = `
      <div class="card-header">
        <div>
          <div class="card-title">${name}</div>
          <div class="card-sub">${valueCol}${unit ? ' (' + unit + ')' : ''} · ${daily.length}-period avg: ${fmtU(avg, unit, 1)}</div>
        </div>
        <span class="${trend.cls}">${trend.icon} ${trend.text} vs avg</span>
      </div>`;
    const cid = 'ov_trend_' + name.replace(/\W/g, '');
    const { wrap, canvas } = makeCanvas(cid, 160);
    card.appendChild(wrap);
    trendGrid.appendChild(card);

    setTimeout(() => {
      // Draw avg line as annotation dataset
      const avgArr = vals.map(() => avg);
      chartInst[cid] = new Chart(canvas, {
        type: 'line',
        data: {
          labels: daily.map(d => d.label),
          datasets: [
            {
              label: valueCol, data: vals,
              borderColor: color.main, backgroundColor: color.main + '20',
              borderWidth: 2.5, fill: true, tension: 0.35, pointRadius: 3, pointHoverRadius: 6
            },
            {
              label: 'Average', data: avgArr,
              borderColor: color.main + '55', backgroundColor: 'transparent',
              borderWidth: 1.5, borderDash: [5, 4], pointRadius: 0, fill: false
            }
          ]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: { callbacks: { label: ctx => ctx.dataset.label === 'Average' ? ` Avg: ${fmtU(ctx.parsed.y, unit, 1)}` : ` ${fmtU(ctx.parsed.y, unit)}` } }
          },
          scales: {
            x: { grid: { display: false }, ticks: { font: { size: 9, family: 'DM Mono' }, maxRotation: 45, autoSkip: true, maxTicksLimit: 7 } },
            y: { grid: { color: '#f0ede8' }, ticks: { font: { size: 9, family: 'DM Mono' }, callback: v => fmt(v) + (unit ? ' ' + unit : '') } }
          }
        }
      });
    }, 60 + sheetMeta.indexOf(sheetMeta.find(s => s.name === name)) * 30);
  });
  container.appendChild(trendGrid);

  // ── 4. Department Performance Ranking ─────────────────────────────────────
  const rankTitle = document.createElement('div');
  rankTitle.className = 'ov-section-title';
  rankTitle.textContent = '🏆 Department Performance Ranking — Latest Period';
  container.appendChild(rankTitle);

  const twoCol = document.createElement('div');
  twoCol.className = 'ov-two-col';

  // Build ranking rows across all sheets+numeric cols
  const rankRows = [];
  sheetMeta.forEach(({ name, color }) => {
    const sheet   = allData[name];
    const nums    = getNumCols(sheet.cols, sheet.rows);
    const dateCol = getDateCol(sheet.cols, sheet.rows);
    const { today: todayRows, prev: prevRows, label } = getLatestRows(sheet.rows, dateCol);
    nums.slice(0, 2).forEach(col => {
      const unit     = detectUnit(name, col);
      const todayVal = todayRows.reduce((s, r) => s + (typeof r[col] === 'number' ? r[col] : 0), 0);
      const prevVal  = prevRows.reduce((s, r) => s + (typeof r[col] === 'number' ? r[col] : 0), 0);
      const change   = pct(todayVal, prevVal);
      rankRows.push({ name, col, unit, todayVal, prevVal, change, color, label });
    });
  });

  // Top performers (sorted by % change desc, positive only)
  const positives = [...rankRows].filter(r => r.change !== null).sort((a, b) => b.change - a.change);
  const negatives = [...rankRows].filter(r => r.change !== null).sort((a, b) => a.change - b.change);
  const maxAbsChange = Math.max(...rankRows.filter(r=>r.change!==null).map(r=>Math.abs(r.change)), 1);

  function buildRankCard(title, rows, good) {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<div class="card-header"><div class="card-title">${title}</div></div>`;
    const tbl = document.createElement('table');
    tbl.className = 'perf-table';
    tbl.innerHTML = `<thead><tr><th>#</th><th>Metric</th><th>Latest</th><th>vs Prev</th><th>Bar</th></tr></thead>`;
    const tbody = document.createElement('tbody');
    rows.slice(0, 5).forEach((r, i) => {
      const trend = trendArrow(r.change);
      const barPct = Math.min((Math.abs(r.change) / maxAbsChange) * 100, 100);
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><span class="rank-num rank-${i+1}">${i+1}</span></td>
        <td><div style="font-weight:500">${r.col}</div><div style="font-size:10px;color:var(--text-faint)">${r.name}</div></td>
        <td class="td-num">${fmtU(r.todayVal, r.unit)}</td>
        <td><span class="${trend.cls}">${trend.text}</span></td>
        <td><div class="perf-bar-wrap"><div class="perf-bar-fill" style="width:${barPct}%;background:${good ? '#2d6a4f' : '#a0402a'}"></div></div></td>`;
      tbody.appendChild(tr);
    });
    tbl.appendChild(tbody);
    card.appendChild(tbl);
    return card;
  }

  twoCol.appendChild(buildRankCard('🟢 Top Performers', positives, true));
  twoCol.appendChild(buildRankCard('🔴 Needs Attention', negatives, false));
  container.appendChild(twoCol);

  // ── 5. Department Summary Bar (click to drill down) ───────────────────────
  const sumTitle = document.createElement('div');
  sumTitle.className = 'ov-section-title';
  sumTitle.textContent = '🗂️ Department Totals — Click to Drill Down';
  container.appendChild(sumTitle);

  const bar = document.createElement('div');
  bar.className = 'summary-bar';
  sheetMeta.forEach(({ name, color }) => {
    const sheet = allData[name];
    const nums  = getNumCols(sheet.cols, sheet.rows);
    const primaryCol = nums[0] || null;
    const unit  = primaryCol ? detectUnit(name, primaryCol) : '';
    const total = primaryCol ? colSum(sheet.rows, primaryCol) : 0;
    const dateCol = getDateCol(sheet.cols, sheet.rows);
    const { today: todayRows, label } = getLatestRows(sheet.rows, dateCol);
    const todayVal = primaryCol ? todayRows.reduce((s, r) => s + (typeof r[primaryCol] === 'number' ? r[primaryCol] : 0), 0) : 0;

    const cell = document.createElement('div');
    cell.className = 'sbi';
    cell.onclick   = () => switchTab(name);
    cell.innerHTML = `
      <div class="sbi-label" style="color:${color.main}">${name}</div>
      <div class="sbi-value">${fmtU(todayVal, unit) || '—'}</div>
      <div class="sbi-sub">${label} · All-time: ${fmtU(total, unit)}</div>`;
    bar.appendChild(cell);
  });
  container.appendChild(bar);
}

// ── Single sheet ──────────────────────────────────────────────────────────────
function renderSheet(name, sheet, container) {
  container.classList.add('fade-in');
  const { cols, rows } = sheet;
  const color     = tabColor(name);
  const nums      = getNumCols(cols, rows);
  const labelCol  = getLabelCol(cols, rows);

  // Page header — title = exact sheet tab name; subtitle = exact column names
  const hdr = document.createElement('div');
  hdr.className = 'page-header';
  hdr.innerHTML = `
    <div class="page-title">${name}</div>
    <div class="page-subtitle">${rows.length} rows · ${cols.length} columns: ${cols.join(', ')}</div>`;
  container.appendChild(hdr);

  // Metric cards — one per numeric column, label = exact column header
  if (nums.length) {
    const grid = document.createElement('div');
    grid.className = 'metrics-grid';
    nums.forEach(col => {
      const unit   = detectUnit(name, col);
      const total  = colSum(rows, col);
      const valid  = rows.filter(r => typeof r[col] === 'number');
      const avg    = valid.length ? total / valid.length : 0;
      const dp     = total > 999 ? 0 : 1;
      const card   = document.createElement('div');
      card.className = 'metric-card';
      card.innerHTML = `
        <div class="metric-label">${col}</div>
        <div class="metric-value">${fmt(total, dp)}<span class="metric-unit">${unit}</span></div>
        <div class="metric-badge badge-${color.badge}">avg ${fmtU(avg, unit, avg > 100 ? 0 : 1)}</div>`;
      grid.appendChild(card);
    });
    container.appendChild(grid);
  }

  // Charts
  if (nums.length && rows.length > 1) {
    const chartsRow = document.createElement('div');
    chartsRow.className = 'charts-row';
    const MAX_CHART_ROWS = 30;
    const sliced = rows.slice(0, MAX_CHART_ROWS);

    // Bar — primary numeric column (first found); label = exact column name
    const primaryCol  = nums[0];
    const primaryUnit = detectUnit(name, primaryCol);
    const barCard = document.createElement('div');
    barCard.className = 'card';
    barCard.innerHTML = `
      <div class="card-header">
        <div>
          <div class="card-title">${primaryCol}${primaryUnit ? ' (' + primaryUnit + ')' : ''}</div>
          <div class="card-sub">by ${labelCol}${rows.length > MAX_CHART_ROWS ? ' · first ' + MAX_CHART_ROWS + ' rows' : ''}</div>
        </div>
      </div>`;
    const barId = name.replace(/\W/g,'') + '_bar';
    const { wrap: bw, canvas: bc } = makeCanvas(barId, 260);
    barCard.appendChild(bw);
    chartsRow.appendChild(barCard);
    setTimeout(() => {
      chartInst[barId] = new Chart(bc, {
        type: 'bar',
        data: {
          labels: sliced.map(r => r[labelCol] != null ? String(r[labelCol]).substring(0, 14) : ''),
          datasets: [{ label: primaryCol, data: sliced.map(r => typeof r[primaryCol] === 'number' ? r[primaryCol] : 0), backgroundColor: color.main + 'cc', borderColor: color.main, borderWidth: 1, borderRadius: 4 }]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => ` ${primaryCol}: ${fmtU(ctx.parsed.y, primaryUnit)}` } } },
          scales: {
            x: { grid: { display: false }, ticks: { font: { size: 10, family: 'DM Mono' }, maxRotation: 45, autoSkip: rows.length > 14 } },
            y: { grid: { color: '#f0ede8' }, ticks: { font: { size: 10, family: 'DM Mono' }, callback: v => fmt(v) + (primaryUnit ? ' ' + primaryUnit : '') } }
          }
        }
      });
    }, 50);

    // Multi-series line — ALL numeric columns, each labelled with exact column name
    if (nums.length > 1) {
      const lineCard = document.createElement('div');
      lineCard.className = 'card';
      // Build a colour palette sized to the number of numeric columns
      const palette = nums.map((_, i) => {
        const hues = [color.main, '#52b788','#95d5b2','#74b9e0','#f4a261','#e76f51','#a8dadc','#457b9d'];
        return hues[i % hues.length];
      });
      // Legend uses exact column names
      const legendEl = document.createElement('div');
      legendEl.className = 'legend';
      nums.forEach((col, i) => {
        const u = detectUnit(name, col);
        legendEl.innerHTML += `<div class="legend-item"><div class="legend-swatch" style="background:${palette[i]}"></div>${col}${u ? ' (' + u + ')' : ''}</div>`;
      });
      lineCard.innerHTML = `<div class="card-header"><div><div class="card-title">All metrics — trend</div><div class="card-sub">${nums.length} columns</div></div></div>`;
      lineCard.appendChild(legendEl);
      const lineId = name.replace(/\W/g,'') + '_line';
      const { wrap: lw, canvas: lc } = makeCanvas(lineId, 260);
      lineCard.appendChild(lw);
      chartsRow.appendChild(lineCard);
      setTimeout(() => {
        chartInst[lineId] = new Chart(lc, {
          type: 'line',
          data: {
            labels: sliced.map(r => r[labelCol] != null ? String(r[labelCol]).substring(0, 10) : ''),
            datasets: nums.map((col, i) => {
              const u = detectUnit(name, col);
              return { label: col + (u ? ' (' + u + ')' : ''), data: sliced.map(r => typeof r[col] === 'number' ? r[col] : 0), borderColor: palette[i], backgroundColor: 'transparent', borderWidth: 2, tension: 0.3, pointRadius: 3, borderDash: i % 2 === 1 ? [4,3] : [] };
            })
          },
          options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => { const col = nums[ctx.datasetIndex]; return ` ${col}: ${fmtU(ctx.parsed.y, detectUnit(name, col))}`; } } } },
            scales: {
              x: { grid: { display: false }, ticks: { font: { size: 10, family: 'DM Mono' }, maxRotation: 45, autoSkip: true, maxTicksLimit: 8 } },
              y: { grid: { color: '#f0ede8' }, ticks: { font: { size: 10, family: 'DM Mono' }, callback: v => fmt(v) } }
            }
          }
        });
      }, 80);
    }
    container.appendChild(chartsRow);
  }

  // Data table — headers = exact column names from sheet; all rows with pagination
  const PAGE = 50;
  if (!tableShown[name]) tableShown[name] = PAGE;

  function buildTable(shown) {
    const tableCard = document.createElement('div');
    tableCard.className = 'card';
    tableCard.id = 'table-card-' + name.replace(/\W/g,'');
    tableCard.innerHTML = `
      <div class="card-header">
        <div>
          <div class="card-title">Data — ${name}</div>
          <div class="card-sub">Showing ${Math.min(shown, rows.length)} of ${rows.length} rows · ${cols.length} columns</div>
        </div>
      </div>`;
    const wrap  = document.createElement('div'); wrap.className = 'table-wrap';
    const table = document.createElement('table');
    // TH = exact column header; append detected unit in parentheses
    table.innerHTML = `<thead><tr>${cols.map(c => {
      const u = detectUnit(name, c);
      return `<th>${c}${u ? ' (' + u + ')' : ''}</th>`;
    }).join('')}</tr></thead>`;
    const tbody = document.createElement('tbody');
    rows.slice(0, shown).forEach(row => {
      const tr = document.createElement('tr');
      tr.innerHTML = cols.map(c => {
        const v   = row[c];
        const isN = typeof v === 'number';
        const u   = isN ? detectUnit(name, c) : '';
        const d   = v == null ? '—' : isN ? fmtU(v, u, v % 1 !== 0 ? 2 : 0) : String(v);
        return `<td class="${isN ? 'td-num' : ''}">${d}</td>`;
      }).join('');
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    wrap.appendChild(table);
    tableCard.appendChild(wrap);
    // Show more / show all buttons
    if (shown < rows.length) {
      const btnWrap = document.createElement('div');
      btnWrap.className = 'show-more-wrap';
      btnWrap.innerHTML = `
        <button class="btn" onclick="showMoreRows('${name}',${shown + PAGE})">Show ${Math.min(PAGE, rows.length - shown)} more rows</button>
        &nbsp;
        <button class="btn" onclick="showMoreRows('${name}',${rows.length})">Show all ${rows.length} rows</button>`;
      tableCard.appendChild(btnWrap);
    }
    return tableCard;
  }

  container.appendChild(buildTable(tableShown[name]));
  container._buildTable = buildTable; // store ref for show-more
}

// Called by "Show more" buttons
function showMoreRows(sheetName, newCount) {
  tableShown[sheetName] = newCount;
  const cardId = 'table-card-' + sheetName.replace(/\W/g,'');
  const old    = document.getElementById(cardId);
  if (old) {
    const parent = old.parentElement;
    const built  = parent._buildTable ? parent._buildTable(newCount) : null;
    if (built) { parent.replaceChild(built, old); }
  }
}

// ── Boot ──────────────────────────────────────────────────────────────────────
loadAllData();
</script>
