    // ── MILK INTAKE ──────────────────────────────────────────────────────────
    if (n.includes('milk') || n.includes('intake')) {
      // TOTALS column = the column literally named "TOTALS" or "Total"
      const totalsCol   = cols.find(c => /\btotals?\b/i.test(c) && nums.includes(c));
      // Station cols = all numeric cols that are NOT the totals column
      const stationCols = nums.filter(c => c !== totalsCol);

      // When a filter is active, aggregate across ALL filtered rows (not just latest day)
      const isFiltered = dateFilter.preset !== 'all';
      const aggRows  = isFiltered ? rows : todayRows;   // full period vs single day
      const aggPrev  = isFiltered ? []  : prevRows;     // no "prev" concept for a range

      const aggTotal = totalsCol
        ? sumCol(aggRows, totalsCol)
        : stationCols.reduce((s, c) => s + sumCol(aggRows, c), 0);
      const prevTotal = totalsCol
        ? sumCol(aggPrev, totalsCol)
        : stationCols.reduce((s, c) => s + sumCol(aggPrev, c), 0);

      const chg = isFiltered ? null : pct(aggTotal, prevTotal);
      if (chg !== null && chg < -15) alerts.push({ type:'warn', msg:`Milk intake down ${Math.abs(chg).toFixed(1)}% vs previous day`, sub:`${fmtU(aggTotal,'L')} vs ${fmtU(prevTotal,'L')}` });

      body.innerHTML += `
        <div class="snap-row">
          <span class="snap-lbl">Total Milk Received</span>
          ${isFiltered ? `<span class="tb-flat" style="font-size:10px;color:var(--text-muted)">period total</span>` : trendBadge(chg)}
        </div>
        <div class="snap-row">
          <span class="snap-val snap-ltr">${fmtU(aggTotal, 'L')}</span>
          ${!isFiltered ? `<span class="snap-sub">prev ${fmtU(prevTotal, 'L')}</span>` : ''}
        </div>`;

      // Per-station breakdown — sum over the full period when filtered
      stationCols.slice(0, 5).forEach(col => {
        const v       = sumCol(aggRows, col);
        const vp      = sumCol(aggPrev, col);
        const pctShare = aggTotal > 0 ? (v / aggTotal * 100).toFixed(0) : 0;
        const chgS    = isFiltered ? null : pct(v, vp);
        const chgCol  = chgS === null ? 'var(--text-muted)' : chgS >= 0 ? '#1a7f4b' : '#a0402a';
        if (v === 0 && isFiltered) return; // hide zero-contribution stations when filtered
        body.innerHTML += `
          <div class="snap-row" style="margin-top:1px;">
            <span class="snap-lbl" style="font-size:10px;padding-left:8px;">↳ ${col} <span style="color:var(--text-faint)">(${pctShare}%)</span></span>
            <span style="font-size:11px;font-weight:600;font-family:'DM Mono',monospace;color:${chgCol}">${fmtU(v, 'L')}</span>
          </div>`;
      });
      if (stationCols.length > 5) {
        body.innerHTML += `<div style="font-size:10px;color:var(--text-faint);padding-left:8px;margin-top:2px">+ ${stationCols.length - 5} more stations</div>`;
      }

    // ── PRODUCTION ───────────────────────────────────────────────────────────
    } else if (n.includes('prod')) {
      const volCol  = findCol(cols, ['production','produced','output','volume','litr','ltr','dispatch','packed']) || nums[0];
      const bfCol   = findCol(cols, ['b/f','bf','balance.forward','opening','stock.b']);
      const cfCol   = findCol(cols, ['c/f','cf','closing','carry.forward','stock.c']);
      const intakeC = findCol(cols, ['intake','received','milk.in','input']);
      const wastCol = findCol(cols, ['waste','loss','spoil','reject']);

      const isFiltered = dateFilter.preset !== 'all';
      const aggRows  = isFiltered ? rows : todayRows;
      const aggPrev  = isFiltered ? []  : prevRows;

      const aggVol  = sumCol(aggRows, volCol);
      const prevVol = sumCol(aggPrev, volCol);
      const chg = isFiltered ? null : pct(aggVol, prevVol);
      if (chg !== null && chg < -15) alerts.push({ type:'warn', msg:`Production output down ${Math.abs(chg).toFixed(1)}%`, sub:`${fmtU(aggVol,'L')} produced today` });

      body.innerHTML += `
        <div class="snap-row"><span class="snap-lbl">Production Output</span>${isFiltered ? `<span class="tb-flat" style="font-size:10px;color:var(--text-muted)">period total</span>` : trendBadge(chg)}</div>
        <div class="snap-row">
          <span class="snap-val snap-ltr">${fmtU(aggVol, 'L')}</span>
          ${!isFiltered ? `<span class="snap-sub">prev ${fmtU(prevVol,'L')}</span>` : ''}
        </div>`;

      const dispCol2 = findCol(cols, ['dispatch','transfer','other.location','sent']);
      const rcptCol2 = findCol(cols, ['receipt','recon','received','incoming']);
      body.innerHTML += `<div class="snap-divider" style="margin:4px 0"></div>`;
      if (bfCol)    { const v = sumCol(aggRows,bfCol);    body.innerHTML += `<div class="snap-row"><span class="snap-lbl" style="font-size:10px;padding-left:8px;">Opening B/F</span><span style="font-size:11px;font-weight:600;font-family:'DM Mono',monospace;color:#1b4f72">${fmtU(v,'L')}</span></div>`; }
      if (rcptCol2) { const v = sumCol(aggRows,rcptCol2); if(v) body.innerHTML += `<div class="snap-row"><span class="snap-lbl" style="font-size:10px;padding-left:8px;">＋ Receipts/RECON</span><span style="font-size:11px;font-weight:600;font-family:'DM Mono',monospace;color:#2d6a4f">${fmtU(v,'L')}</span></div>`; }
      if (intakeC)  { const v = sumCol(aggRows,intakeC);  if(v) body.innerHTML += `<div class="snap-row"><span class="snap-lbl" style="font-size:10px;padding-left:8px;">＋ Milk In</span><span style="font-size:11px;font-weight:600;font-family:'DM Mono',monospace;color:#2d6a4f">${fmtU(v,'L')}</span></div>`; }
      { const v = sumCol(aggRows,volCol); if(v) body.innerHTML += `<div class="snap-row"><span class="snap-lbl" style="font-size:10px;padding-left:8px;">＋ Production</span><span style="font-size:11px;font-weight:600;font-family:'DM Mono',monospace;color:#2d6a4f">${fmtU(v,'L')}</span></div>`; }
      if (dispCol2) { const v = sumCol(aggRows,dispCol2); if(v) body.innerHTML += `<div class="snap-row"><span class="snap-lbl" style="font-size:10px;padding-left:8px;">－ Dispatches Out</span><span style="font-size:11px;font-weight:600;font-family:'DM Mono',monospace;color:#b5460f">${fmtU(v,'L')}</span></div>`; }
      if (wastCol)  { const v = sumCol(aggRows,wastCol);  if(v) body.innerHTML += `<div class="snap-row"><span class="snap-lbl" style="font-size:10px;padding-left:8px;color:#a0402a;">－ Waste/Staff Tea</span><span style="font-size:11px;font-weight:600;font-family:'DM Mono',monospace;color:#a0402a">${fmtU(v,'L')}</span></div>`; }
      if (cfCol)    {
        const v = sumCol(aggRows,cfCol);
        body.innerHTML += `<div class="snap-divider" style="margin:4px 0"></div>
          <div class="snap-row"><span class="snap-lbl" style="font-size:10px;padding-left:8px;font-weight:700;">Closing C/F <span style="font-size:9px;font-weight:400;color:var(--text-faint)">(calculated)</span></span><span style="font-size:12px;font-weight:700;font-family:'DM Mono',monospace;color:#2d6a4f">${fmtU(v,'L')}</span></div>`;
      }

    // ── SALES ────────────────────────────────────────────────────────────────
    } else if (n.includes('sale')) {
      const volCol = findCol(cols, ['volume','litr','ltr','qty','quantity','sold.l','sales.l','dispatched']) || nums.find(c => detectUnit(name,c) === 'L');
      const kesCol = findCol(cols, ['amount','revenue','ksh','kes','value','total','income','sales.k','payment']) || nums.find(c => detectUnit(name,c) === 'KES');
      const otherCols = nums.filter(c => c !== volCol && c !== kesCol).slice(0,2);

      const isFiltered = dateFilter.preset !== 'all';
      const aggRows  = isFiltered ? rows : todayRows;
      const aggPrev  = isFiltered ? []  : prevRows;

      const aggVol  = volCol ? sumCol(aggRows, volCol) : 0;
      const prevVol = volCol ? sumCol(aggPrev, volCol) : 0;
      const aggKes  = kesCol ? sumCol(aggRows, kesCol) : 0;
      const prevKes = kesCol ? sumCol(aggPrev, kesCol) : 0;
      const chgV = isFiltered ? null : pct(aggVol,  prevVol);
      const chgK = isFiltered ? null : pct(aggKes,  prevKes);

      if (chgV !== null && chgV < -15) alerts.push({ type:'warn', msg:`Sales volume down ${Math.abs(chgV).toFixed(1)}%`, sub:`${fmtU(aggVol,'L')} sold today` });
      if (chgK !== null && chgK > 20)  alerts.push({ type:'good', msg:`Sales revenue up ${chgK.toFixed(1)}%`, sub:`KES ${fmt(aggKes)} collected today` });

      const periodTag = `<span class="tb-flat" style="font-size:10px;color:var(--text-muted)">period total</span>`;
      if (volCol) body.innerHTML += `
        <div class="snap-row"><span class="snap-lbl">Sales Volume</span>${isFiltered ? periodTag : trendBadge(chgV)}</div>
        <div class="snap-row">
          <span class="snap-val snap-ltr">${fmtU(aggVol,'L')}</span>
          ${!isFiltered ? `<span class="snap-sub">prev ${fmtU(prevVol,'L')}</span>` : ''}
        </div>`;

      if (kesCol) {
        body.innerHTML += `<div class="snap-divider"></div>`;
        body.innerHTML += `
          <div class="snap-row"><span class="snap-lbl">Sales Revenue</span>${isFiltered ? periodTag : trendBadge(chgK)}</div>
          <div class="snap-row">
            <span class="snap-val snap-ksh">KES ${fmt(aggKes)}</span>
            ${!isFiltered ? `<span class="snap-sub">prev KES ${fmt(prevKes)}</span>` : ''}
          </div>`;
      }

      otherCols.forEach(col => {
        const v = sumCol(aggRows, col), u = detectUnit(name, col);
        if (v > 0) body.innerHTML += `<div class="snap-row" style="margin-top:1px;"><span class="snap-lbl" style="font-size:10px;padding-left:8px;">↳ ${col}</span><span style="font-size:11px;font-weight:600;font-family:'DM Mono',monospace;color:var(--text-muted)">${fmtU(v,u)}</span></div>`;
      });

    // ── FINANCE ──────────────────────────────────────────────────────────────
    } else if (n.includes('financ') || n.includes('payment') || n.includes('cash') || n.includes('credit')) {
      const cashCol   = findCol(cols, ['cash','paid','payment','received.cash','cash.in']);
      const creditCol = findCol(cols, ['credit','mpesa','cheque','invoice','debt','pending','receivable','credit.sale']);
      const totalCol  = findCol(cols, ['total','amount','revenue','income','collection']) || nums[0];

      const isFiltered = dateFilter.preset !== 'all';
      const aggRows  = isFiltered ? rows : todayRows;
      const aggPrev  = isFiltered ? []  : prevRows;

      const aggCash    = cashCol   ? sumCol(aggRows, cashCol)   : 0;
      const prevCash   = cashCol   ? sumCol(aggPrev, cashCol)   : 0;
      const aggCredit  = creditCol ? sumCol(aggRows, creditCol) : 0;
      const prevCredit = creditCol ? sumCol(aggPrev, creditCol) : 0;
      const aggTotal   = totalCol  ? sumCol(aggRows, totalCol)  : aggCash + aggCredit;
      const prevTotal  = totalCol  ? sumCol(aggPrev, totalCol)  : prevCash + prevCredit;
      const chgT = isFiltered ? null : pct(aggTotal, prevTotal);

      if (chgT !== null && chgT < -20) alerts.push({ type:'warn', msg:`Finance collections down ${Math.abs(chgT).toFixed(1)}%`, sub:`KES ${fmt(aggTotal)} vs KES ${fmt(prevTotal)} previous` });

      const periodTag = `<span class="tb-flat" style="font-size:10px;color:var(--text-muted)">period total</span>`;
      body.innerHTML += `
        <div class="snap-row"><span class="snap-lbl">Total Received</span>${isFiltered ? periodTag : trendBadge(chgT)}</div>
        <div class="snap-row">
          <span class="snap-val snap-ksh">KES ${fmt(aggTotal)}</span>
          ${!isFiltered ? `<span class="snap-sub">prev KES ${fmt(prevTotal)}</span>` : ''}
        </div>`;

      if (cashCol) {
        const chgC = isFiltered ? null : pct(aggCash, prevCash);
        body.innerHTML += `<div class="snap-divider"></div>
          <div class="snap-row"><span class="snap-lbl">Cash Received</span>${isFiltered ? periodTag : trendBadge(chgC)}</div>
          <div class="snap-row">
            <span class="snap-val snap-cash">KES ${fmt(aggCash)}</span>
            ${!isFiltered ? `<span class="snap-sub">prev KES ${fmt(prevCash)}</span>` : ''}
          </div>`;
      }

      if (creditCol) {
        const chgCr = isFiltered ? null : pct(aggCredit, prevCredit);
        body.innerHTML += `<div class="snap-divider"></div>
          <div class="snap-row"><span class="snap-lbl">Credit / Receivable</span>${isFiltered ? periodTag : trendBadge(chgCr)}</div>
          <div class="snap-row">
            <span class="snap-val snap-credit">KES ${fmt(aggCredit)}</span>
            ${!isFiltered ? `<span class="snap-sub">prev KES ${fmt(prevCredit)}</span>` : ''}
          </div>`;
      }

      nums.filter(c => c !== cashCol && c !== creditCol && c !== totalCol).slice(0,2).forEach(col => {
        const v = sumCol(aggRows, col), u = detectUnit(name, col);
        if (v > 0) body.innerHTML += `<div class="snap-row" style="margin-top:1px;"><span class="snap-lbl" style="font-size:10px;padding-left:8px;">↳ ${col}</span><span style="font-size:11px;font-weight:600;font-family:'DM Mono',monospace;color:var(--text-muted)">${fmtU(v,u)}</span></div>`;
      });

    // ── FALLBACK for any other sheet ─────────────────────────────────────────
    } else {
      const isFiltered = dateFilter.preset !== 'all';
      const aggRows  = isFiltered ? rows : todayRows;
      const aggPrev  = isFiltered ? []  : prevRows;
      nums.slice(0, 4).forEach((col, i) => {
        const unit   = detectUnit(name, col);
        const aggVal = sumCol(aggRows, col);
        const prevVal = sumCol(aggPrev, col);
        const chg = isFiltered ? null : pct(aggVal, prevVal);
        if (i > 0) body.innerHTML += `<div class="snap-divider"></div>`;
        body.innerHTML += `
          <div class="snap-row"><span class="snap-lbl">${col}</span>${isFiltered ? `<span class="tb-flat" style="font-size:10px;color:var(--text-muted)">period total</span>` : trendBadge(chg)}</div>
          <div class="snap-row">
            <span class="snap-val" style="color:${color.main}">${fmtU(aggVal, unit)}</span>
            ${!isFiltered ? `<span class="snap-sub">prev ${fmtU(prevVal, unit)}</span>` : ''}
          </div>`;
      });
    }

    card.appendChild(body);
    snapStrip.appendChild(card);
  });
  container.appendChild(snapStrip);

  // ═══════════════════════════════════════════════════════════════════════════
  // SECTION 2 — MANAGEMENT ALERTS
  // ═══════════════════════════════════════════════════════════════════════════
  if (alerts.length) {
    const sec2 = document.createElement('div'); sec2.className = 'ov-sec'; sec2.textContent = 'Management Alerts';
    container.appendChild(sec2);
    alerts.forEach(a => {
      const div = document.createElement('div');
      div.className = `alert-row alert-${a.type}`;
      div.innerHTML = `<div class="alert-icon">${a.type === 'warn' ? '⚠️' : '✅'}</div>
        <div class="alert-body"><div class="alert-ttl">${a.msg}</div><div class="alert-sub">${a.sub}</div></div>`;
      container.appendChild(div);
    });
  }

  // ═══════════════════════════════════════════════════════════════════════════
  // SECTION 2.5 — COMBINED CROSS-DEPARTMENT OVERVIEW CHART
  // Single chart showing all departments' primary metrics over time
  // ═══════════════════════════════════════════════════════════════════════════
  {
    // Gather daily series for every department

    // Build per-dept series: { name, color, primaryCol, unit, daily }
    const deptSeries = [];
    sheetMeta.forEach(({ name, color }) => {
      const sheet = allData[name];
      const nums  = getNumCols(sheet.cols, sheet.rows);
      if (!nums.length) return;
      const dateCol = getDateCol(sheet.cols, sheet.rows);
      const rows    = applyDateFilter(sheet.rows, dateCol);
      if (!rows.length) return;

      const n = name.toLowerCase();
      let primaryCol = nums[0];
      if (n.includes('milk') || n.includes('intake'))
        primaryCol = sheet.cols.find(c => /\btotals?\b/i.test(c) && nums.includes(c)) || nums[nums.length - 1];
      if (n.includes('sale'))
        primaryCol = findCol(sheet.cols, ['volume','litr','ltr','qty','quantity']) || nums[0];
      if (n.includes('financ') || n.includes('cash'))
        primaryCol = findCol(sheet.cols, ['total','amount','revenue','cash','collection']) || nums[0];
      if (n.includes('prod'))
        primaryCol = findCol(sheet.cols, ['production','produced','output','volume','litr']) || nums[0];

      const unit  = detectUnit(name, primaryCol);
      const daily = getDailyAgg(rows, dateCol, [primaryCol], daysWindow);
      if (daily.length < 2) return;
      deptSeries.push({ name, color, primaryCol, unit, daily });
    });

    if (deptSeries.length >= 2) {
      // Build a unified sorted date label set across all departments
      const allDates = new Map(); // dateString → Date object
      deptSeries.forEach(s => s.daily.forEach(d => {
        if (!allDates.has(d.label)) allDates.set(d.label, d.d);
      }));
      const sortedDates = [...allDates.entries()]
        .sort((a, b) => a[1] - b[1])
        .map(e => e[0]);

      // Map each series to the unified labels (fill 0 for missing days)
      const seriesData = deptSeries.map(s => {
        const byLabel = {};
        s.daily.forEach(d => { byLabel[d.label] = d.totals[s.primaryCol] || 0; });
        return sortedDates.map(lbl => byLabel[lbl] || 0);
      });

      const sec25 = document.createElement('div');
      sec25.className = 'ov-sec';
      sec25.textContent = 'Cross-Department Trend';
      container.appendChild(sec25);

      const chartCard = document.createElement('div');
      chartCard.className = 'ov-chart-card';

      // Build view-mode toggle buttons
      const modes = [
        { key: 'line',      label: '📈 Lines' },
        { key: 'bar',       label: '📊 Bars' },
        { key: 'stacked',   label: '⬛ Stacked' },
        { key: 'pct',       label: '% Share' },
      ];
      const btnIds = modes.map(m => 'ovc_btn_' + m.key);

      // Legend items — use data-dept attribute to avoid quoting issues with sheet names
      const legendHTML = deptSeries.map((s, i) =>
        `<div class="ov-chart-legend-item" data-ovc-dept="${i}">
          <div class="ov-chart-legend-dot" id="ovc_dot_${i}" style="background:${s.color.main}"></div>
          <span id="ovc_lbl_${i}">${s.name}</span>
         </div>`
      ).join('');

      chartCard.innerHTML = `
        <div class="ov-chart-head">
          <div>
            <div class="ov-chart-title">All Departments — Daily Primary Metric</div>
            <div class="ov-chart-sub" id="ovc-sub">Click legend items to show/hide · Click bars/points to drill down</div>
          </div>
        </div>
        <div class="ov-chart-legend">${legendHTML}</div>`;

      const { wrap: ovWrap, canvas: ovCanvas } = makeCanvas('ovc_main', 280);
      chartCard.appendChild(ovWrap);
      container.appendChild(chartCard);

      // Hidden dept toggle state
      const hiddenDepts = new Set();

      // Build Chart.js datasets
      function buildOvcDatasets(mode) {
        return deptSeries.map((s, i) => {
          const vals = mode === 'pct'
            ? seriesData[i].map((v, di) => {
                const total = deptSeries.reduce((sum, _, j) => sum + (seriesData[j][di] || 0), 0);
                return total > 0 ? +(v / total * 100).toFixed(1) : 0;
              })
            : seriesData[i];

          const hidden = hiddenDepts.has(s.name);
          const base = {
            label: s.name,
            data: vals,
            hidden,
            borderColor: s.color.main,
            backgroundColor: s.color.main + (mode === 'line' ? '18' : 'ff'),
            borderWidth: mode === 'line' ? 2 : 1.5,
            borderRadius: mode !== 'line' ? 4 : 0,
            tension: 0.35,
            pointRadius: mode === 'line' ? 3 : 0,
            pointHoverRadius: 5,
            fill: mode === 'line' ? false : undefined,
          };
          if (mode === 'stacked' || mode === 'pct') base.stack = 'dept';
          return base;
        });
      }

      function buildOvcOptions(mode) {
        const isStacked = mode === 'stacked' || mode === 'pct';
        const isPct     = mode === 'pct';
        return {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          onClick: (evt, elements) => {
            if (!elements.length) return;
            const deptIdx = elements[0].datasetIndex;
            if (deptSeries[deptIdx]) switchTab(deptSeries[deptIdx].name);
          },
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                title: ctx => ctx[0]?.label || '',
                label: ctx => {
                  const s = deptSeries[ctx.datasetIndex];
                  if (!s) return '';
                  const v = ctx.parsed.y;
                  return isPct
                    ? ` ${s.name}: ${v.toFixed(1)}%`
                    : ` ${s.name}: ${fmtU(v, s.unit)}`;
                },
                footer: ctx => {
                  if (isPct) return '';
                  const di = ctx[0]?.dataIndex;
                  if (di === undefined) return '';
                  const total = deptSeries.reduce((sum, _, j) => sum + (seriesData[j][di] || 0), 0);
                  return total > 0 ? `Total: ${fmt(total)}` : '';
                }
              }
            }
          },
          scales: {
            x: {
              stacked: isStacked,
              grid: { display: false },
              ticks: { font: { size: 9, family: 'DM Mono' }, maxRotation: 45, autoSkip: true, maxTicksLimit: 12 }
            },
            y: {
              stacked: isStacked,
              grid: { color: '#f0ede8' },
              ticks: {
                font: { size: 9, family: 'DM Mono' },
                callback: v => isPct ? v + '%' : fmt(v)
              },
              max: isPct ? 100 : undefined,
            }
          }
        };
      }

      // Render chart after DOM is ready
      setTimeout(() => {
        const chartType = 'bar'; // Chart.js type — we control line/bar via dataset type overrides
        chartInst['ovc_main'] = new Chart(ovCanvas, {
          type: 'bar',
          data: { labels: sortedDates, datasets: buildOvcDatasets('bar') },
          options: buildOvcOptions('bar')
        });

        // Expose mode switcher globally
        window.ovcSetMode = function(mode) {
          const inst = chartInst['ovc_main'];
          if (!inst) return;
          // Update button styles
          modes.forEach(m => {
            const btn = document.getElementById('ovc_btn_' + m.key);
            if (btn) btn.classList.toggle('active', m.key === mode);
          });
          // Rebuild
          const type = (mode === 'line') ? 'line' : 'bar';
          inst.config.type = type;
          inst.data.datasets = buildOvcDatasets(mode);
          inst.options = buildOvcOptions(mode);
          // Sub label
          const sub = document.getElementById('ovc-sub');
          if (sub) {
            sub.textContent = mode === 'pct'
              ? 'Each band shows each department\'s % share of the combined daily total'
              : mode === 'stacked'
              ? 'Bars stacked to show combined daily total across all departments'
              : 'Click legend to hide/show · Click a point or bar to open that department';
          }
          inst.update();
        };

        window.ovcToggleSeries = function(deptIdx) {
          const inst = chartInst['ovc_main'];
          if (!inst) return;
          const s = deptSeries[deptIdx];
          if (!s) return;
          if (hiddenDepts.has(s.name)) hiddenDepts.delete(s.name);
          else hiddenDepts.add(s.name);
          // Update legend visual
          const dot = document.getElementById('ovc_dot_' + deptIdx);
          const lbl = document.getElementById('ovc_lbl_' + deptIdx);
          const isHidden = hiddenDepts.has(s.name);
          if (dot) dot.style.opacity = isHidden ? '0.25' : '1';
          if (lbl) lbl.style.opacity = isHidden ? '0.4'  : '1';
          // Re-render datasets
          const currentMode = modes.find(m => {
            const btn = document.getElementById('ovc_btn_' + m.key);
            return btn && btn.classList.contains('active');
          });
          inst.data.datasets = buildOvcDatasets(currentMode ? currentMode.key : 'line');
          inst.update();
        };

        // Wire legend clicks via event delegation (avoids inline onclick quoting issues)
        const legendEl = chartCard.querySelector('.ov-chart-legend');
        if (legendEl) {
          legendEl.addEventListener('click', e => {
            const item = e.target.closest('[data-ovc-dept]');
            if (item) window.ovcToggleSeries(parseInt(item.dataset.ovcDept));
          });
        }

      }, 30);
    }
  }
  // ═══════════════════════════════════════════════════════════════════════════
  const sec3 = document.createElement('div'); sec3.className = 'ov-sec'; sec3.textContent = 'Current Month Trend — Daily Totals per Department';
  container.appendChild(sec3);

  const trendGrid = document.createElement('div');
  trendGrid.className = 'trend-grid';

  sheetMeta.forEach(({ name, color }, si) => {
    const sheet   = allData[name];
    const nums    = getNumCols(sheet.cols, sheet.rows);
    if (!nums.length || sheet.rows.length < 2) return;
    const dateCol  = getDateCol(sheet.cols, sheet.rows);
    const rows     = applyDateFilter(sheet.rows, dateCol);

    // Pick the most meaningful primary column per dept
    const n = name.toLowerCase();
    let primaryCol = nums[0];
    if (n.includes('milk') || n.includes('intake')) {
      primaryCol = sheet.cols.find(c => /\btotals?\b/i.test(c) && nums.includes(c)) || nums[nums.length - 1];
    }
    if (n.includes('sale'))   primaryCol = findCol(sheet.cols, ['volume','litr','ltr','qty','quantity']) || nums[0];
    if (n.includes('financ') || n.includes('cash')) primaryCol = findCol(sheet.cols, ['total','amount','revenue','cash','collection']) || nums[0];
    if (n.includes('prod'))   primaryCol = findCol(sheet.cols, ['production','produced','output','volume','litr']) || nums[0];

    // Use current month's day count as window (up to 31 days)
    const daysThisMonth = new Date(new Date().getFullYear(), new Date().getMonth() + 1, 0).getDate();
    const unit  = detectUnit(name, primaryCol);
    const daily = getDailyAgg(rows, dateCol, [primaryCol], daysThisMonth);
    const vals  = daily.map(d => d.totals[primaryCol] || 0);
    const avg   = vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : 0;
    const latest = vals[vals.length-1] || 0;
    const chg = pct(latest, avg);

    const card = document.createElement('div');
    card.className = 'card';
    card.style.cursor = 'pointer';
    card.onclick = () => switchTab(name);
    const filterDesc2 = filterDescription();
    const monthName = filterDesc2 || new Date().toLocaleDateString('en-KE', { month: 'long', year: 'numeric' });
    card.innerHTML = `
      <div class="card-header">
        <div>
          <div class="card-title">${name} — ${primaryCol}</div>
          <div class="card-sub">${monthName} · ${daily.length} days · avg/day ${fmtU(avg, unit, 1)} · latest ${fmtU(latest, unit)}</div>
        </div>
        ${trendBadge(chg)}
      </div>`;
    const cid = 'ov14_' + name.replace(/\W/g,'');
    const { wrap, canvas } = makeCanvas(cid, 155);
    card.appendChild(wrap);
    trendGrid.appendChild(card);

    setTimeout(() => {
      chartInst[cid] = new Chart(canvas, {
        type: 'bar',
        data: {
          labels: daily.map(d => d.label),
          datasets: [
            { label: primaryCol, data: vals, backgroundColor: vals.map(v => v >= avg ? color.main + 'cc' : color.main + '55'), borderColor: color.main, borderWidth: 1, borderRadius: 3 },
            { label: 'Average', data: vals.map(()=>avg), type:'line', borderColor: color.main, borderWidth: 1.5, borderDash:[5,3], pointRadius:0, fill:false }
          ]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend:{display:false}, tooltip:{ callbacks:{ label: ctx => ctx.dataset.label === 'Average' ? ` Avg: ${fmtU(ctx.parsed.y,unit,1)}` : ` ${fmtU(ctx.parsed.y,unit)}` } } },
          scales: {
            x:{ grid:{display:false}, ticks:{ font:{size:9,family:'DM Mono'}, maxRotation:45, autoSkip:true, maxTicksLimit:8 } },
            y:{ grid:{color:'#f0ede8'}, ticks:{ font:{size:9,family:'DM Mono'}, callback: v=>fmt(v)+(unit?' '+unit:'') } }
          }
        }
      });
    }, 60 + si * 40);
  });
  container.appendChild(trendGrid);

  // ═══════════════════════════════════════════════════════════════════════════
  // SECTION 3.5 — METRIC COMPARISONS
  // ═══════════════════════════════════════════════════════════════════════════
  const compSection = document.createElement('div');
  compSection.className = 'ov-sec';
  compSection.textContent = '📊 Metric Comparisons';
  container.appendChild(compSection);

  // Helper function to get specific metric data - improved column detection
  function getComparisonData(sheetName, metricKeywords, excludeKeywords) {
    const sheet = allData[sheetName];
    if (!sheet) return null;
    const nums = getNumCols(sheet.cols, sheet.rows);
    if (!nums.length) return null;
    
    let col = null;
    
    // First, try to find column with exact keyword match (more specific)
    for (const keyword of metricKeywords) {
      const candidates = sheet.cols.filter(c => {
        const lower = c.toLowerCase();
        // Exclude cumulative/total columns unless specifically asked
        if (excludeKeywords && excludeKeywords.some(ex => lower.includes(ex))) return false;
        return lower.includes(keyword.toLowerCase()) && nums.includes(c);
      });
      if (candidates.length > 0) {
        // Prefer columns that don't have "total" in the name for daily metrics
        col = candidates.find(c => !c.toLowerCase().includes('total')) || candidates[0];
        if (col) break;
      }
    }
    
    if (!col) col = nums[0];
    
    const dateCol = getDateCol(sheet.cols, sheet.rows);
    const rows = applyDateFilter(sheet.rows, dateCol);
    if (!rows.length) return null;
    
    const daily = getDailyAgg(rows, dateCol, [col], daysWindow);
    if (daily.length < 2) return null;
    
    return { col, daily, unit: detectUnit(sheetName, col) };
  }

  // Render comparison charts with improved column detection
  const compCharts = [
    {
      title: 'Sales (KSH) vs Collection (KSH)',
      canvasId: 'comp_sales_collection',
      series: [
        { name: 'Sales', sheet: 'Sales', keywords: ['sales'], excludeKeywords: [], color: TAB_COLORS[2] },
        { name: 'Collection', sheet: 'Finance', keywords: ['collection','received','cash'], excludeKeywords: ['pending'], color: TAB_COLORS[4] }
      ]
    },
    {
      title: 'Production (L) vs Sales Volume (L)',
      canvasId: 'comp_prod_sales',
      series: [
        { name: 'Production Output', sheet: 'Production', keywords: ['production','output'], excludeKeywords: ['total'], color: TAB_COLORS[1] },
        { name: 'Sales Volume', sheet: 'Sales', keywords: ['volume','litr','quantity'], excludeKeywords: ['total'], color: TAB_COLORS[2] }
      ]
    },
    {
      title: 'Milk Intake (L) vs Production (L) vs Sales (L)',
      canvasId: 'comp_milk_prod_sales',
      series: [
        { name: 'Milk Intake', sheet: 'Milk Intake', keywords: ['intake','received','milk'], excludeKeywords: ['total','production','sales'], color: TAB_COLORS[0] },
        { name: 'Production', sheet: 'Production', keywords: ['production','output'], excludeKeywords: ['total'], color: TAB_COLORS[1] },
        { name: 'Sales', sheet: 'Sales', keywords: ['volume','litr','quantity'], excludeKeywords: ['total'], color: TAB_COLORS[2] }
      ]
    }
  ];

  compCharts.forEach((comp, idx) => {
    const seriesData = comp.series.map(s => ({ 
      ...s, 
      data: getComparisonData(s.sheet, s.keywords, s.excludeKeywords) 
    })).filter(s => s.data);
    if (seriesData.length < 2) return;

    // Unify dates across all series
    const allDates = new Map();
    seriesData.forEach(s => s.data.daily.forEach(d => {
      if (!allDates.has(d.label)) allDates.set(d.label, d.d);
    }));
    const sortedDates = [...allDates.entries()].sort((a, b) => a[1] - b[1]).map(e => e[0]);

    // Build datasets for line charts
    const datasets = seriesData.map(s => {
      const byLabel = {};
      s.data.daily.forEach(d => { byLabel[d.label] = d.totals[s.data.col] || 0; });
      return {
        label: s.name,
        data: sortedDates.map(lbl => byLabel[lbl] || 0),
        borderColor: s.color.main,
        backgroundColor: s.color.main + '15',
        borderWidth: 2.5,
        fill: true,
        tension: 0.3,
        pointRadius: 3,
        pointHoverRadius: 5,
        pointBackgroundColor: s.color.main,
        pointBorderColor: '#fff',
        pointBorderWidth: 2
      };
    });

    // Create comparison chart card
    const compCard = document.createElement('div');
    compCard.className = 'ov-chart-card';
    compCard.style.marginBottom = '1rem';
    const { wrap: compWrap, canvas: compCanvas } = makeCanvas(comp.canvasId, 200);
    
    compCard.innerHTML = `
      <div class="ov-chart-head">
        <div>
          <div class="ov-chart-title">${comp.title}</div>
          <div class="ov-chart-sub">Daily comparison</div>
        </div>
      </div>`;
    compCard.appendChild(compWrap);
    container.appendChild(compCard);

    // Create chart
    const compChart = new Chart(compCanvas, {
      type: 'line',
      data: { labels: sortedDates, datasets },
      options: {
        responsive: true,
        maintainAspectRatio: true,
        interaction: { intersect: false, mode: 'index' },
        plugins: {
          legend: { position: 'bottom', labels: { padding: 12, font: { size: 10 }, boxWidth: 8 } },
          filler: { propagate: true }
        },
        scales: {
          x: { stacked: false },
          y: { stacked: false, grid: { color: '#f0ede8' }, ticks: { font: { size: 9, family: 'DM Mono' }, callback: v => fmt(v) } }
        }
      }
    });
    chartInst[comp.canvasId] = compChart;
  });

  // ═════════════════════════════════════════════════════════════════════════════
  const sec4 = document.createElement('div'); sec4.className = 'ov-sec'; sec4.textContent = 'All-Time Totals — Click to Drill Down';
  container.appendChild(sec4);

  const ddBar = document.createElement('div');
  ddBar.className = 'dd-bar';
  sheetMeta.forEach(({ name, color }) => {
    const sheet = allData[name];
    const nums  = getNumCols(sheet.cols, sheet.rows);
    if (!nums.length) return;
    // For milk intake, prefer TOTALS column; otherwise use first numeric
    const isMilk = name.toLowerCase().includes('milk') || name.toLowerCase().includes('intake');
    const primaryCol = isMilk
      ? (sheet.cols.find(c => /\btotals?\b/i.test(c) && nums.includes(c)) || nums[nums.length - 1])
      : nums[0];
    const unit  = detectUnit(name, primaryCol);
    const dateCol = getDateCol(sheet.cols, sheet.rows);
    const filteredRows = applyDateFilter(sheet.rows, dateCol);
    const total = sumCol(filteredRows, primaryCol);
    const { today: todayRows, label } = getLatestRows(filteredRows, dateCol);
    const todayVal = sumCol(todayRows, primaryCol);
    const filterDesc3 = filterDescription();

    const cell = document.createElement('div');
    cell.className = 'dd-cell';
    cell.onclick = () => switchTab(name);
    cell.innerHTML = `
      <div class="dd-lbl" style="color:${color.main}">${name}</div>
      <div class="dd-val">${fmtU(todayVal, unit) || '—'}</div>
      <div class="dd-sub">${label} · ${filterDesc3 ? 'Period' : 'All-time'}: ${fmtU(total, unit)}</div>`;
    ddBar.appendChild(cell);
  });
  container.appendChild(ddBar);
}

// ── Single sheet ──────────────────────────────────────────────────────────────
function renderSheet(name, sheet, container) {
  container.classList.add('fade-in');
  const { cols, rows: rawRows } = sheet;
  const color     = tabColor(name);
  const dateCol2raw = getDateCol(cols, rawRows);
  const rows      = applyDateFilter(rawRows, dateCol2raw);
  const nums      = getNumCols(cols, rows);
  const labelCol  = getLabelCol(cols, rows);
  const filterDesc = filterDescription();

  // Page header — title = exact sheet tab name; subtitle = exact column names
  const hdr = document.createElement('div');
  hdr.className = 'page-header';
  
  // For Production sheets, show date range information
  const isProdSheet = name.toLowerCase().includes('prod');
  let dateInfo = '';
  if (isProdSheet && dateCol2raw) {
    const validRows = rows.filter(r => rowHasRealData(r));
    if (validRows.length > 0) {
      const dates = validRows
        .map(r => parseRowDate(r[dateCol2raw]))
        .filter(d => d !== null)
        .sort((a, b) => a - b);
      if (dates.length > 0) {
        const firstDate = dates[0].toLocaleDateString('en-KE', { day: 'numeric', month: 'short', year: 'numeric' });
        const lastDate = dates[dates.length - 1].toLocaleDateString('en-KE', { day: 'numeric', month: 'short', year: 'numeric' });
        if (firstDate === lastDate) {
          dateInfo = `<span style="background:var(--green-light);color:#2d6a4f;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600">📅 ${firstDate}</span>`;
        } else {
          dateInfo = `<span style="background:var(--green-light);color:#2d6a4f;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600">📅 ${firstDate} to ${lastDate}</span>`;
        }
      }
    }
  }
  
  hdr.innerHTML = `
    <div class="page-title">${name}</div>
    <div class="page-subtitle">${dateInfo ? dateInfo + ' · ' : ''}${rows.length} rows${filterDesc ? ' <strong style="color:var(--green)">(filtered: ' + filterDesc + ')</strong>' : ''} · ${cols.length} columns: ${cols.join(', ')}</div>`;
  container.appendChild(hdr);

  // ── Filter bar ──────────────────────────────────────────────────────────────
  buildFilterBar(container);

  // ── Production Balance Panel (B/F → C/F) for production/balance sheets ──
  if (isProductionSheet(name, cols)) {
    function matchColLocal(patterns) {
      for (const pat of patterns) {
        const re = new RegExp(pat, 'i');
        const c = cols.find(c => re.test(c));
        if (c) return c;
      }
      return null;
    }
    const bfC   = matchColLocal(['b\\/?f','brought.forward','opening']);
    const cfC   = matchColLocal(['c\\/?f','carried.forward','closing']);
    const rcpC  = matchColLocal(['receipt','recon','received','incoming']);
    const prdC  = matchColLocal(['production','produced','output']);
    const dspC  = matchColLocal(['dispatch','transfer','other.location','sent']);
    const wstC  = matchColLocal(['waste','staff.tea','wastage','loss']);

    if (bfC && cfC) {
      const balPanel = document.createElement('div');
      balPanel.className = 'card';
      balPanel.style.marginBottom = '1rem';

      // Table: one row per data row showing all components
      const rowsHTML = rows.map((row, i) => {
        const label   = row[getLabelCol(cols, rows)] ?? `Row ${i+1}`;
        const bf      = typeof row[bfC]  === 'number' ? row[bfC]  : null;
        const rcpt    = rcpC && typeof row[rcpC] === 'number' ? row[rcpC] : null;
        const prod    = prdC && typeof row[prdC] === 'number' ? row[prdC] : null;
        const dsp     = dspC && typeof row[dspC] === 'number' ? row[dspC] : null;
        const wst     = wstC && typeof row[wstC] === 'number' ? row[wstC] : null;
        const cf      = typeof row[cfC]  === 'number' ? row[cfC]  : null;
        const isAuto  = row['_cf_calc'];
        const bfAuto  = row['_bf_auto'];

        const tdN = (v, color) => v != null
          ? `<td class="td-num" style="color:${color||'inherit'}">${fmt(v)} L</td>`
          : `<td class="td-num" style="color:var(--text-faint)">—</td>`;
        
        const tdBF = (v, color) => v != null
          ? `<td class="td-num" style="color:${color||'inherit'};background:#f3f1f0;border-left:3px solid #b3a5a0;border-right:1px solid #d0c8c0">${fmt(v)} L</td>`
          : `<td class="td-num" style="color:var(--text-faint);background:#f3f1f0;border-left:3px solid #b3a5a0;border-right:1px solid #d0c8c0">—</td>`;

        return `<tr>
          <td style="font-size:12px;white-space:nowrap">${String(label).substring(0,22)}</td>
          ${tdBF(bf,   bfAuto ? '#1b4f72' : null)}
          ${tdN(rcpt, '#2d6a4f')}
          ${tdN(prod, '#2d6a4f')}
          ${tdN(dsp,  '#b5460f')}
          ${tdN(wst,  '#a0402a')}
          <td class="td-num" style="font-weight:700;color:${cf != null && cf >= 0 ? '#2d6a4f' : '#a0402a'};background:var(--green-light);border-left:3px solid #2d6a4f;border-right:3px solid #2d6a4f">
            ${cf != null ? fmt(cf) + ' L' : '—'}${isAuto ? ' <span style="font-size:9px;font-weight:400;color:var(--text-faint)">⚙</span>' : ''}
          </td>
        </tr>`;
      }).join('');

      balPanel.innerHTML = `
        <div class="card-header">
          <div>
            <div class="card-title">🧮 Production Balance — B/F → C/F</div>
            <div class="card-sub">C/F = B/F + Receipts + Production − Dispatches − Wastage · <span style="color:#2d6a4f;font-weight:600">⚙ = auto-calculated</span> · B/F auto-carries from previous C/F</div>
          </div>
        </div>
        <div style="background:var(--green-light);border-left:4px solid #2d6a4f;padding:1rem;border-radius:8px;margin-bottom:1rem;">
          <div style="font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:0.5rem">📖 How to Read This Table</div>
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;font-size:11px;">
            <div><span style="font-weight:600;color:#1b4f72">B/F (L)</span><br><span style="color:var(--text-muted);font-size:10px">Brought Forward from previous day closing stock</span></div>
            <div><span style="font-weight:600;color:#2d6a4f">Receipts (L)</span><br><span style="color:var(--text-muted);font-size:10px">Milk received from other locations</span></div>
            <div><span style="font-weight:600;color:#2d6a4f">Production (L)</span><br><span style="color:var(--text-muted);font-size:10px">Processed output for the day</span></div>
            <div><span style="font-weight:600;color:#b5460f">Dispatches (L)</span><br><span style="color:var(--text-muted);font-size:10px">Milk sent to other locations</span></div>
            <div><span style="font-weight:600;color:#a0402a">Wastage (L)</span><br><span style="color:var(--text-muted);font-size:10px">Staff tea, spillage & loss</span></div>
            <div><span style="font-weight:600;color:#2d6a4f">C/F (L)</span><br><span style="color:var(--text-muted);font-size:10px">Closing Forward to next day</span></div>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr>
              <th>Location / Date</th>
              <th style="text-align:right;color:#1b4f72;position:relative;cursor:help" title="Brought Forward: Stock from previous day closing">B/F (L)</th>
              ${rcpC  ? `<th style="text-align:right;color:#2d6a4f;position:relative;cursor:help" title="Receipts: Milk received from other locations">Receipts (L)</th>` : ''}
              ${prdC  ? `<th style="text-align:right;color:#2d6a4f;position:relative;cursor:help" title="Production: Daily processed output">Production (L)</th>` : ''}
              ${dspC  ? `<th style="text-align:right;color:#b5460f;position:relative;cursor:help" title="Dispatches: Milk sent to other locations">Dispatches (L)</th>` : ''}
              ${wstC  ? `<th style="text-align:right;color:#a0402a;position:relative;cursor:help" title="Wastage: Staff tea, spillage & loss">Wastage (L)</th>` : ''}
              <th style="text-align:right;color:#2d6a4f;background:var(--green-light);position:relative;cursor:help" title="Closing Forward: Stock remaining for next day (auto-calculated)">C/F (L) ⚙</th>
            </tr></thead>
            <tbody>${rowsHTML}</tbody>
          </table>
        </div>`;

      // Totals row
      const totBF  = bfC  ? colSum(rows, bfC)  : null;
      const totRcp = rcpC ? colSum(rows, rcpC) : null;
      const totPrd = prdC ? colSum(rows, prdC) : null;
      const totDsp = dspC ? colSum(rows, dspC) : null;
      const totWst = wstC ? colSum(rows, wstC) : null;
      const totCF  = cfC  ? colSum(rows, cfC)  : null;

      const totalsBar = document.createElement('div');
      totalsBar.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap;padding:10px 14px 12px;border-top:1px solid var(--border);font-size:11px;';
      const addTot = (label, val, color) => {
        if (val == null) return;
        totalsBar.innerHTML += `<span style="background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:3px 10px;font-family:'DM Mono',monospace;"><span style="color:var(--text-muted)">${label}:</span> <strong style="color:${color}">${fmt(val)} L</strong></span>`;
      };
      addTot('Σ B/F', totBF, '#1b4f72');
      addTot('Σ Receipts', totRcp, '#2d6a4f');
      addTot('Σ Production', totPrd, '#2d6a4f');
      addTot('Σ Dispatches', totDsp, '#b5460f');
      addTot('Σ Wastage', totWst, '#a0402a');
      addTot('Σ C/F', totCF, '#2d6a4f');
      balPanel.appendChild(totalsBar);

      container.appendChild(balPanel);
    }
  }
  if (nums.length) {
    const isMilkIntake = name.toLowerCase().includes('milk') || name.toLowerCase().includes('intake');
    const dateCol2  = getDateCol(cols, rows);
    const { today: latestRows, prev: prevRows2, label: latestLabel, prevLabel: prevLabel2, todayMissing: detailMissing } = getLatestRows(rows, dateCol2);

    const isFiltered   = dateFilter.preset !== 'all';
    // When filtered: aggregate all filtered rows; when not: use latest day
    const aggRows2     = isFiltered ? rows      : latestRows;
    const aggPrev2     = isFiltered ? []         : prevRows2;
    const periodLabel  = isFiltered ? (filterDescription() || 'Filtered Period') : latestLabel;
    const prevLabel2F  = isFiltered ? null        : prevLabel2;

    // ── MILK INTAKE: per-station panel ────────────────────────────────────────
    if (isMilkIntake) {
      const totalsCol   = cols.find(c => /\btotal(s)?\b/i.test(c) && nums.includes(c));
      const stationCols = nums.filter(c => c !== totalsCol);

      const aggTotal   = totalsCol ? sumCol(aggRows2, totalsCol) : stationCols.reduce((s,c) => s + sumCol(aggRows2,c), 0);
      const prevTotal2 = totalsCol ? sumCol(aggPrev2, totalsCol) : stationCols.reduce((s,c) => s + sumCol(aggPrev2,c), 0);
      const chgTotal   = isFiltered ? null : pct(aggTotal, prevTotal2);
      const chgColor   = chgTotal === null ? 'var(--text-muted)' : chgTotal >= 0 ? '#1a7f4b' : '#a0402a';
      const chgArrow   = chgTotal === null ? '' : chgTotal >= 0 ? '▲' : '▼';
      const chgText    = chgTotal !== null
        ? `${chgArrow} ${Math.abs(chgTotal).toFixed(1)}% vs ${prevLabel2F} (${fmt(prevTotal2)} L)`
        : isFiltered ? `Period total across ${rows.length} day${rows.length !== 1 ? 's' : ''}` : '—';

      // All-time avg uses the full unfiltered dataset
      const allRows    = rawRows; // rawRows is available from renderSheet scope
      const allTimeAvg = totalsCol
        ? colSum(allRows, totalsCol) / Math.max(1, allRows.filter(r => typeof r[totalsCol] === 'number').length)
        : aggTotal; // fallback

      // Top summary bar
      const summaryBar = document.createElement('div');
      summaryBar.style.cssText = 'display:flex;gap:10px;flex-wrap:wrap;align-items:stretch;margin-bottom:1rem;';
      summaryBar.innerHTML = `
        <div style="flex:1;min-width:200px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1rem 1.25rem;border-top:3px solid ${color.main}">
          <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin-bottom:4px">Total Milk Received — ${periodLabel}</div>
          <div style="font-size:30px;font-weight:700;letter-spacing:-1px;color:${color.main};font-family:'DM Mono',monospace">${fmt(aggTotal)} <span style="font-size:16px;font-weight:400">L</span></div>
          <div style="font-size:12px;color:${chgColor};font-weight:600;margin-top:4px">${chgText}</div>

          borderColor: color.main, backgroundColor: color.main + '22',
          borderWidth: 2.5, tension: 0.3, pointRadius: 3, pointHoverRadius: 5, fill: true,
        } : null;

        window[lineId + '_milk'] = { labels: labels4, stDatasets, totalsDataset, stationCols: stationCols2, totalsCol: totalsCol2, palette: stPalette, color };

        setTimeout(() => {
          chartInst[lineId] = new Chart(lc, {
            type: 'line',
            data: { labels: labels4, datasets: [...stDatasets, ...(totalsDataset ? [totalsDataset] : [])] },
            options: {
              responsive: true, maintainAspectRatio: false,
              interaction: { mode: 'index', intersect: false },
              plugins: {
                legend: { display: false },
                tooltip: { callbacks: { label: ctx => ` ${ctx.dataset.label}: ${fmt(ctx.parsed.y)} L` } }
              },
              scales: {
                x: { grid: { display: false }, ticks: { font: { size: 10, family: 'DM Mono' }, maxRotation: 45, autoSkip: true, maxTicksLimit: 10 } },
                y: { grid: { color: '#f0ede8' }, ticks: { font: { size: 10, family: 'DM Mono' }, callback: v => fmt(v) + ' L' } }
              }
            }
          });
        }, 80);

      } else if (isFinanceSheet) {
        // ── FINANCE: Cash vs Credit vs Totals toggle chart ──────────────────
        const cashCol2   = findCol(cols, ['cash','paid','payment','received.cash','cash.in','cash.col']) || nums[0];
        const creditCol2 = findCol(cols, ['credit','mpesa','cheque','invoice','debt','pending','receivable','credit.sale']) || nums[1];
        const totalCol2  = findCol(cols, ['total','amount','revenue','income','collection','totals']) || nums.find(c => c !== cashCol2 && c !== creditCol2);

        const lineCard = document.createElement('div');
        lineCard.className = 'card';
        lineCard.style.gridColumn = '1 / -1';
        const lineId = name.replace(/\W/g,'') + '_line';

        lineCard.innerHTML = `
          <div class="card-header" style="flex-wrap:wrap;gap:8px;">
            <div>
              <div class="card-title">Collections Trend</div>
              <div class="card-sub" id="${lineId}_sub">Showing: Cash (KES)</div>
            </div>
            <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">
              <button id="${lineId}_btn_cash" onclick="finChartSwitch('${lineId}','cash')"
                style="padding:5px 14px;border-radius:20px;font-size:12px;font-weight:600;border:1.5px solid ${color.main};background:${color.main};color:#fff;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s">
                💵 Cash
              </button>
              <button id="${lineId}_btn_credit" onclick="finChartSwitch('${lineId}','credit')"
                style="padding:5px 14px;border-radius:20px;font-size:12px;font-weight:600;border:1.5px solid var(--border);background:var(--surface);color:var(--text-muted);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s">
                🧾 Credit
              </button>
              ${totalCol2 ? `<button id="${lineId}_btn_total" onclick="finChartSwitch('${lineId}','total')"
                style="padding:5px 14px;border-radius:20px;font-size:12px;font-weight:600;border:1.5px solid var(--border);background:var(--surface);color:var(--text-muted);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s">
                📊 Totals
              </button>` : ''}
              <button id="${lineId}_btn_both" onclick="finChartSwitch('${lineId}','both')"
                style="padding:5px 14px;border-radius:20px;font-size:12px;font-weight:600;border:1.5px solid var(--border);background:var(--surface);color:var(--text-muted);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s">
                ⚡ All
              </button>
            </div>
          </div>`;

        const { wrap: lw, canvas: lc } = makeCanvas(lineId, 280);
        lineCard.appendChild(lw);
        chartsRow.appendChild(lineCard);

        const labels3    = sliced.map(r => fmtChartLabel(r[labelCol]));
        const cashData   = sliced.map(r => cashCol2   && typeof r[cashCol2]   === 'number' ? r[cashCol2]   : 0);
        const creditData = sliced.map(r => creditCol2 && typeof r[creditCol2] === 'number' ? r[creditCol2] : 0);
        const totalData  = sliced.map(r => totalCol2  && typeof r[totalCol2]  === 'number' ? r[totalCol2]  : 0);

        const mkDS = (label, data, clr, fill) => ({
          label, data,
          borderColor: clr, backgroundColor: clr + (fill ? '22' : '00'),
          fill: !!fill, borderWidth: 2, tension: 0.35, pointRadius: 3, pointHoverRadius: 5,
        });
        const cashDS   = mkDS(`${cashCol2} (KES)`,   cashData,   color.main, true);
        const creditDS = mkDS(`${creditCol2} (KES)`, creditData, '#6b3fa0',  true);
        const totalDS  = mkDS(`${totalCol2} (KES)`,  totalData,  '#1b4f72',  false);

        window[lineId + '_fin'] = { labels: labels3, cashDS, creditDS, totalDS, cashCol: cashCol2, creditCol: creditCol2, totalCol: totalCol2, color, hasTotals: !!totalCol2 };

        setTimeout(() => {
          chartInst[lineId] = new Chart(lc, {
            type: 'line',
            data: { labels: labels3, datasets: [cashDS] },
            options: {
              responsive: true, maintainAspectRatio: false,
              interaction: { mode: 'index', intersect: false },
              plugins: {
                legend: { display: false },
                tooltip: { callbacks: { label: ctx => ` ${ctx.dataset.label}: KES ${fmt(ctx.parsed.y)}` } }
              },
              scales: {
                x: { grid: { display: false }, ticks: { font: { size: 10, family: 'DM Mono' }, maxRotation: 45, autoSkip: true, maxTicksLimit: 10 } },
                y: { grid: { color: '#f0ede8' }, ticks: { font: { size: 10, family: 'DM Mono' }, callback: v => fmt(v) } }
              }
            }
          });
        }, 80);

      } else if (!isFinanceSheet) {
        // ── GENERIC multi-series line for non-Sales, non-Finance sheets ──────
        const lineCard = document.createElement('div');
        lineCard.className = 'card';
        const palette = nums.map((_, i) => {
          const hues = [color.main, '#52b788','#95d5b2','#74b9e0','#f4a261','#e76f51','#a8dadc','#457b9d'];
          return hues[i % hues.length];
        });
        const legendEl = document.createElement('div');
        legendEl.className = 'legend';
        nums.forEach((col, i) => {
          const u = detectUnit(name, col);
          legendEl.innerHTML += `<div class="legend-item"><div class="legend-swatch" style="background:${palette[i]}"></div>${col}${u ? ' (' + u + ')' : ''}</div>`;
        });
        lineCard.innerHTML = `<div class="card-header"><div><div class="card-title">All metrics — trend</div><div class="card-sub">${nums.length} columns</div></div></div>`;
        lineCard.appendChild(legendEl);
        const lineId = name.replace(/\W/g,'') + '_line';
        const { wrap: lw, canvas: lc } = makeCanvas(lineId, 260);
        lineCard.appendChild(lw);
        chartsRow.appendChild(lineCard);
        setTimeout(() => {
          chartInst[lineId] = new Chart(lc, {
            type: 'line',
            data: {
              labels: sliced.map(r => fmtChartLabel(r[labelCol])),
              datasets: nums.map((col, i) => {
                const u = detectUnit(name, col);
                return { label: col + (u ? ' (' + u + ')' : ''), data: sliced.map(r => typeof r[col] === 'number' ? r[col] : 0), borderColor: palette[i], backgroundColor: 'transparent', borderWidth: 2, tension: 0.3, pointRadius: 3, borderDash: i % 2 === 1 ? [4,3] : [] };
              })
            },
            options: {
              responsive: true, maintainAspectRatio: false,
              plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => { const col = nums[ctx.datasetIndex]; return ` ${col}: ${fmtU(ctx.parsed.y, detectUnit(name, col))}`; } } } },
              scales: {
                x: { grid: { display: false }, ticks: { font: { size: 10, family: 'DM Mono' }, maxRotation: 45, autoSkip: true, maxTicksLimit: 8 } },
                y: { grid: { color: '#f0ede8' }, ticks: { font: { size: 10, family: 'DM Mono' }, callback: v => fmt(v) } }
              }
            }
          });
        }, 80);
      }
    }

    // ── Sales chart toggle function (global so onclick can reach it) ──────────
    window.salesChartSwitch = function(lineId, mode) {
      const inst = chartInst[lineId];
      const d    = window[lineId + '_data'];
      if (!inst || !d) return;

      // Update button styles
      ['vol','kes','both'].forEach(m => {
        const btn = document.getElementById(`${lineId}_btn_${m}`);
        if (!btn) return;
        const active = m === mode;
        btn.style.background    = active ? d.color.main : 'var(--surface)';
        btn.style.color         = active ? '#fff' : 'var(--text-muted)';
        btn.style.borderColor   = active ? d.color.main : 'var(--border)';
      });

      const subEl = document.getElementById(`${lineId}_sub`);

      if (mode === 'vol') {
        inst.data.datasets = [d.volDataset];
        inst.options.scales.y.display  = true;
        inst.options.scales.y2.display = false;
        inst.options.scales.y.ticks.callback = v => fmt(v) + (d.volUnit ? ' '+d.volUnit : '');
        if (subEl) subEl.textContent = `Showing: Volume (${d.volUnit || 'L'})`;
      } else if (mode === 'kes') {
        inst.data.datasets = [{ ...d.kesDataset, yAxisID: 'y' }];
        inst.options.scales.y.display  = true;
        inst.options.scales.y2.display = false;
        inst.options.scales.y.ticks.callback = v => fmt(v) + (d.kesUnit ? ' '+d.kesUnit : '');
        if (subEl) subEl.textContent = `Showing: Revenue (${d.kesUnit || 'KES'})`;
      } else {
        // Both — dual Y axes
        inst.data.datasets = [d.volDataset, d.kesDataset];
        inst.options.scales.y.display  = true;
        inst.options.scales.y2.display = true;
        inst.options.scales.y.ticks.callback  = v => fmt(v) + ' ' + (d.volUnit||'L');
        inst.options.scales.y2.ticks = { font: { size: 10, family: 'DM Mono' }, callback: v => fmt(v) + ' ' + (d.kesUnit||'KES') };
        if (subEl) subEl.textContent = 'Showing: Volume + Revenue';
      }
      inst.update();
    };

    // ── Finance chart toggle function ─────────────────────────────────────────
    window.finChartSwitch = function(lineId, mode) {
      const inst = chartInst[lineId];
      const d    = window[lineId + '_fin'];
      if (!inst || !d) return;

      const btns = ['cash','credit','total','both'];
      btns.forEach(m => {
        const btn = document.getElementById(`${lineId}_btn_${m}`);
        if (!btn) return;
        const active = m === mode;
        btn.style.background  = active ? d.color.main : 'var(--surface)';
        btn.style.color       = active ? '#fff' : 'var(--text-muted)';
        btn.style.borderColor = active ? d.color.main : 'var(--border)';
      });

      const subEl = document.getElementById(`${lineId}_sub`);
      inst.options.scales.y.ticks.callback = v => fmt(v);

      if (mode === 'cash') {
        inst.data.datasets = [d.cashDS];
        if (subEl) subEl.textContent = `Showing: Cash Collections (KES)`;
      } else if (mode === 'credit') {
        inst.data.datasets = [d.creditDS];
        if (subEl) subEl.textContent = `Showing: Credit Collections (KES)`;
      } else if (mode === 'total' && d.hasTotals) {
        inst.data.datasets = [d.totalDS];
        if (subEl) subEl.textContent = `Showing: Total Collections (KES)`;
      } else {
        // All — stack cash, credit, totals
        const ds = [d.cashDS, d.creditDS];
        if (d.hasTotals) ds.push(d.totalDS);
        inst.data.datasets = ds;
        if (subEl) subEl.textContent = 'Showing: Cash + Credit' + (d.hasTotals ? ' + Totals' : '');
      }
      inst.update();
    };

    // ── Milk Intake station toggle function ───────────────────────────────────
    window.milkChartSwitch = function(lineId, mode) {
      const inst = chartInst[lineId];
      const d    = window[lineId + '_milk'];
      if (!inst || !d) return;

      const subEl = document.getElementById(`${lineId}_sub`);

      // Reset all button styles
      const allBtn = document.getElementById(`${lineId}_btn_all`);
      const totBtn = document.getElementById(`${lineId}_btn_totals`);
      if (allBtn) { allBtn.style.background = 'var(--surface)'; allBtn.style.color = '#333'; }
      if (totBtn) { totBtn.style.background = 'var(--surface)'; totBtn.style.color = d.color.main; }
      d.stationCols.forEach((_, i) => {
        const btn = document.getElementById(`${lineId}_btn_${i}`);
        if (btn) { btn.style.background = 'var(--surface)'; btn.style.color = d.palette[i % d.palette.length]; }
      });

      if (mode === 'all') {
        inst.data.datasets = [...d.stDatasets, ...(d.totalsDataset ? [d.totalsDataset] : [])];
        if (allBtn) { allBtn.style.background = '#333'; allBtn.style.color = '#fff'; }
        if (subEl) subEl.textContent = 'Showing: All Stations';
      } else if (mode === 'totals' && d.totalsDataset) {
        inst.data.datasets = [d.totalsDataset];
        if (totBtn) { totBtn.style.background = d.color.main; totBtn.style.color = '#fff'; }
        if (subEl) subEl.textContent = `Showing: ${d.totalsCol} (L)`;
      } else if (typeof mode === 'number') {
        const ds  = d.stDatasets[mode];
        const btn = document.getElementById(`${lineId}_btn_${mode}`);
        inst.data.datasets = [ds];
        if (btn) { btn.style.background = d.palette[mode % d.palette.length]; btn.style.color = '#fff'; }
        if (subEl) subEl.textContent = `Showing: ${d.stationCols[mode]} (L)`;
      }
      inst.update();
    };

    container.appendChild(chartsRow);
  }

  // Data table — headers = exact column names from sheet; all rows with pagination
  const PAGE = 50;
  if (!tableShown[name]) tableShown[name] = PAGE;

  function buildTable(shown) {
    const tableCard = document.createElement('div');
    tableCard.className = 'card';
    tableCard.id = 'table-card-' + name.replace(/\W/g,'');
    tableCard.innerHTML = `
      <div class="card-header">
        <div>
          <div class="card-title">Data — ${name}</div>
          <div class="card-sub">Showing ${Math.min(shown, rows.length)} of ${rows.length} rows · ${cols.length} columns</div>
        </div>
      </div>`;
    const wrap  = document.createElement('div'); wrap.className = 'table-wrap';
    const table = document.createElement('table');
    
    // TH = exact column header; append detected unit in parentheses
    table.innerHTML = `<thead><tr>${cols.map(c => {
      const u = detectUnit(name, c);
      return `<th>${c}${u ? ' (' + u + ')' : ''}</th>`;
    }).join('')}</tr></thead>`;
    
    const tbody = document.createElement('tbody');
    
    // For Production sheets, add date headers before each date's data
    const isProdSheet = name.toLowerCase().includes('prod');
    
    rows.slice(0, shown).forEach((row, rowIdx) => {
      const firstCol = cols[0];
      const firstColValue = row[firstCol];
      const parsedDate = parseRowDate(firstColValue);
      
      // If first column contains a date, add a green date header row first
      if (isProdSheet && parsedDate && !isNaN(parsedDate.getTime())) {
        const dateStr = parsedDate.toLocaleDateString('en-KE', { day: '2-digit', month: '2-digit', year: 'numeric' });
        const dateHeaderRow = document.createElement('tr');
        dateHeaderRow.style.cssText = 'background:var(--green-light);border-top:2px solid #2d6a4f;border-bottom:1px solid #2d6a4f;font-weight:700;';
        dateHeaderRow.innerHTML = `<td colspan="${cols.length}" style="padding:10px 12px;color:#2d6a4f;font-size:13px;font-weight:700;">📅 ${dateStr}</td>`;
        tbody.appendChild(dateHeaderRow);
      }
      
      // Add the data row
      const tr = document.createElement('tr');
      tr.innerHTML = cols.map(c => {
        const v   = row[c];
        const isN = typeof v === 'number';
        const u   = isN ? detectUnit(name, c) : '';
        let display;
        if (v == null) {
          display = '—';
        } else if (isN) {
          display = fmtU(v, u, v % 1 !== 0 ? 2 : 0);
        } else {
          const parsed = parseRowDate(v);
          if (parsed && !isNaN(parsed.getTime())) {
            const dd = String(parsed.getDate()).padStart(2, '0');
            const mm = String(parsed.getMonth() + 1).padStart(2, '0');
            const yyyy = parsed.getFullYear();
            display = `${dd}/${mm}/${yyyy}`;
          } else {
            display = String(v);
          }
        }
        return `<td class="${isN ? 'td-num' : ''}">${display}</td>`;
      }).join('');
      tbody.appendChild(tr);
    });
    
    table.appendChild(tbody);
    wrap.appendChild(table);
    tableCard.appendChild(wrap);
    
    // Show more / show all buttons
    if (shown < rows.length) {
      const btnWrap = document.createElement('div');
      btnWrap.className = 'show-more-wrap';
      btnWrap.innerHTML = `
        <button class="btn" onclick="showMoreRows('${name}',${shown + PAGE})">Show ${Math.min(PAGE, rows.length - shown)} more rows</button>
        &nbsp;
        <button class="btn" onclick="showMoreRows('${name}',${rows.length})">Show all ${rows.length} rows</button>`;
      tableCard.appendChild(btnWrap);
    }
    return tableCard;
  }

  container.appendChild(buildTable(tableShown[name]));
  container._buildTable = buildTable; // store ref for show-more
}

// Called by "Show more" buttons
function showMoreRows(sheetName, newCount) {
  tableShown[sheetName] = newCount;
  const cardId = 'table-card-' + sheetName.replace(/\W/g,'');
  const old    = document.getElementById(cardId);
  if (old) {
    const parent = old.parentElement;
    const built  = parent._buildTable ? parent._buildTable(newCount) : null;
    if (built) { parent.replaceChild(built, old); }
  }
}

// ── Export functions ──────────────────────────────────────────────────────────
function toggleExportMenu(e) {
  e.stopPropagation();
  const dd = document.getElementById('export-dropdown');
  if (dd) dd.classList.toggle('open');
}
// Close export menu on outside click
document.addEventListener('click', () => {
  const dd = document.getElementById('export-dropdown');
  if (dd) dd.classList.remove('open');
});

// Build CSV string from cols + rows
function buildCSV(cols, rows) {
  const escape = v => {
    if (v == null) return '';
    const s = String(v);
    return s.includes(',') || s.includes('"') || s.includes('\n')
      ? '"' + s.replace(/"/g, '""') + '"'
      : s;
  };
  const header = cols.map(escape).join(',');
  const body   = rows.map(r => cols.map(c => {
    const v = r[c];
    // Format dates nicely
    const d = parseRowDate(v);
    if (d && (v instanceof Date || (typeof v === 'string' && /^Date\(/.test(v)))) {
      return escape(d.toLocaleDateString('en-KE'));
    }
    return escape(v);
  }).join(',')).join('\n');
  return header + '\n' + body;
}

function downloadCSV(csv, filename) {
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  document.getElementById('export-dropdown')?.classList.remove('open');
}

// Export current view — respects active tab + date filter
function exportCurrentCSV() {
  const filterDesc = filterDescription();
  const safeName   = n => n.replace(/[^a-z0-9]/gi, '_');
  if (activeTab === '__overview__') {
    // Export all sheets combined as separate blocks
    const parts = [];
    sheetMeta.forEach(({ name }) => {
      const { cols, rows: rawRows } = allData[name];
      const dateCol = getDateCol(cols, rawRows);
      const rows    = applyDateFilter(rawRows, dateCol);
      if (!rows.length) return;
      parts.push('--- ' + name + ' ---');
      parts.push(buildCSV(cols, rows));
    });
    const suffix = filterDesc ? '_' + filterDesc.replace(/[^a-z0-9]/gi, '_') : '';
    downloadCSV(parts.join('\n\n'), 'departmental_overview' + suffix + '.csv');
  } else {
    const { cols, rows: rawRows } = allData[activeTab] || { cols: [], rows: [] };
    const dateCol = getDateCol(cols, rawRows);
    const rows    = applyDateFilter(rawRows, dateCol);
    const suffix  = filterDesc ? '_' + filterDesc.replace(/[^a-z0-9]/gi, '_') : '';
    downloadCSV(buildCSV(cols, rows), safeName(activeTab) + suffix + '.csv');
  }
}

// Export all data for current tab (no filter)
function exportAllCSV() {
  const safeName = n => n.replace(/[^a-z0-9]/gi, '_');
  if (activeTab === '__overview__') {
    const parts = [];
    sheetMeta.forEach(({ name }) => {
      const { cols, rows } = allData[name];
      parts.push('--- ' + name + ' ---');
      parts.push(buildCSV(cols, rows));
    });
    downloadCSV(parts.join('\n\n'), 'departmental_all_data.csv');
  } else {
    const { cols, rows } = allData[activeTab] || { cols: [], rows: [] };
    downloadCSV(buildCSV(cols, rows), safeName(activeTab) + '_all_data.csv');
  }
}

// Copy current view as tab-separated (Excel-friendly)
function copyTableToClipboard() {
  const filterDesc = filterDescription();
  let text = '';
  if (activeTab === '__overview__') {
    sheetMeta.forEach(({ name }) => {
      const { cols, rows: rawRows } = allData[name];
      const dateCol = getDateCol(cols, rawRows);
      const rows    = applyDateFilter(rawRows, dateCol);
      if (!rows.length) return;
      text += name + '\n';
      text += cols.join('\t') + '\n';
      text += rows.map(r => cols.map(c => r[c] ?? '').join('\t')).join('\n') + '\n\n';
    });
  } else {
    const { cols, rows: rawRows } = allData[activeTab] || { cols: [], rows: [] };
    const dateCol = getDateCol(cols, rawRows);
    const rows    = applyDateFilter(rawRows, dateCol);
    text = cols.join('\t') + '\n';
    text += rows.map(r => cols.map(c => r[c] ?? '').join('\t')).join('\n');
  }
  navigator.clipboard.writeText(text).then(() => {
    // Brief toast
    const btn = document.querySelector('.export-btn');
    if (btn) { const orig = btn.innerHTML; btn.innerHTML = '✓ Copied!'; setTimeout(() => { btn.innerHTML = orig; }, 1800); }
    document.getElementById('export-dropdown')?.classList.remove('open');
  }).catch(() => alert('Copy failed — please use Download CSV instead.'));
}

// ── Mobile sidebar toggle ──────────────────────────────────────────────────────
function toggleMobileNav() {
  const sidebar  = document.getElementById('sidebar');
  const overlay  = document.getElementById('sidebar-overlay');
  const closeBtn = document.getElementById('sidebar-close-btn');
  const isOpen   = sidebar.classList.contains('mobile-open');
  if (isOpen) {
    sidebar.classList.remove('mobile-open');
    overlay.classList.remove('open');
  } else {
    sidebar.classList.add('mobile-open');
    overlay.classList.add('open');
  }
  // Show close button only on mobile
  if (closeBtn) closeBtn.style.display = window.innerWidth <= 768 ? 'block' : 'none';
}

// Close sidebar when a nav item is tapped on mobile
const _origSwitchTab = typeof switchTab !== 'undefined' ? switchTab : null;
document.addEventListener('click', e => {
  const item = e.target.closest('.nav-item');
  if (item && window.innerWidth <= 768) {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebar-overlay');
    if (sidebar) sidebar.classList.remove('mobile-open');
    if (overlay) overlay.classList.remove('open');
  }
});
