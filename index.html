      // Any other numeric cols not captured above
      nums.filter(c => c !== cashCol && c !== creditCol && c !== totalCol).slice(0,2).forEach(col => {
        const v = sumCol(todayRows,col), u = detectUnit(name,col);
        if (v > 0) body.innerHTML += `<div class="snap-row" style="margin-top:1px;"><span class="snap-lbl" style="font-size:10px;padding-left:8px;">↳ ${col}</span><span style="font-size:11px;font-weight:600;font-family:'DM Mono',monospace;color:var(--text-muted)">${fmtU(v,u)}</span></div>`;
      });

    // ── FALLBACK for any other sheet ─────────────────────────────────────────
    } else {
      nums.slice(0, 4).forEach((col, i) => {
        const unit = detectUnit(name, col);
        const todayVal = sumCol(todayRows, col);
        const prevVal  = sumCol(prevRows,  col);
        const chg = pct(todayVal, prevVal);
        if (i > 0) body.innerHTML += `<div class="snap-divider"></div>`;
        body.innerHTML += `
          <div class="snap-row"><span class="snap-lbl">${col}</span>${trendBadge(chg)}</div>
          <div class="snap-row">
            <span class="snap-val" style="color:${color.main}">${fmtU(todayVal, unit)}</span>
            <span class="snap-sub">prev ${fmtU(prevVal, unit)}</span>
          </div>`;
      });
    }

    card.appendChild(body);
    snapStrip.appendChild(card);
  });
  container.appendChild(snapStrip);

  // ═══════════════════════════════════════════════════════════════════════════
  // SECTION 2 — MANAGEMENT ALERTS
  // ═══════════════════════════════════════════════════════════════════════════
  if (alerts.length) {
    const sec2 = document.createElement('div'); sec2.className = 'ov-sec'; sec2.textContent = 'Management Alerts';
    container.appendChild(sec2);
    alerts.forEach(a => {
      const div = document.createElement('div');
      div.className = `alert-row alert-${a.type}`;
      div.innerHTML = `<div class="alert-icon">${a.type === 'warn' ? '⚠️' : '✅'}</div>
        <div class="alert-body"><div class="alert-ttl">${a.msg}</div><div class="alert-sub">${a.sub}</div></div>`;
      container.appendChild(div);
    });
  }

  // ═══════════════════════════════════════════════════════════════════════════
  // SECTION 3 — 14-DAY TREND CHARTS (primary metric per department)
  // ═══════════════════════════════════════════════════════════════════════════
  const sec3 = document.createElement('div'); sec3.className = 'ov-sec'; sec3.textContent = '14-Day Trend — Primary Metric per Department';
  container.appendChild(sec3);

  const trendGrid = document.createElement('div');
  trendGrid.className = 'trend-grid';

  sheetMeta.forEach(({ name, color }, si) => {
    const sheet   = allData[name];
    const nums    = getNumCols(sheet.cols, sheet.rows);
    if (!nums.length || sheet.rows.length < 2) return;
    const dateCol  = getDateCol(sheet.cols, sheet.rows);

    // Pick the most meaningful primary column per dept
    const n = name.toLowerCase();
    let primaryCol = nums[0];
    if (n.includes('milk') || n.includes('intake')) {
      // Prefer the TOTALS column; otherwise sum all stations via a virtual approach — use totals if present
      primaryCol = sheet.cols.find(c => /\btotals?\b/i.test(c) && nums.includes(c)) || nums[nums.length - 1];
    }
    if (n.includes('sale'))   primaryCol = findCol(sheet.cols, ['volume','litr','ltr','qty','quantity']) || nums[0];
    if (n.includes('financ') || n.includes('cash')) primaryCol = findCol(sheet.cols, ['total','amount','revenue','cash','collection']) || nums[0];
    if (n.includes('prod'))   primaryCol = findCol(sheet.cols, ['production','produced','output','volume','litr']) || nums[0];

    const unit  = detectUnit(name, primaryCol);
    const daily = getDailyAgg(sheet.rows, dateCol, [primaryCol], 14);
    const vals  = daily.map(d => d.totals[primaryCol] || 0);
    const avg   = vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : 0;
    const latest = vals[vals.length-1] || 0;
    const chg = pct(latest, avg);

    const card = document.createElement('div');
    card.className = 'card';
    card.style.cursor = 'pointer';
    card.onclick = () => switchTab(name);
    card.innerHTML = `
      <div class="card-header">
        <div>
          <div class="card-title">${name} — ${primaryCol}</div>
          <div class="card-sub">${daily.length}-day window · avg ${fmtU(avg, unit, 1)} · latest ${fmtU(latest, unit)}</div>
        </div>
        ${trendBadge(chg)}
      </div>`;
    const cid = 'ov14_' + name.replace(/\W/g,'');
    const { wrap, canvas } = makeCanvas(cid, 155);
    card.appendChild(wrap);
    trendGrid.appendChild(card);

    setTimeout(() => {
      chartInst[cid] = new Chart(canvas, {
        type: 'bar',
        data: {
          labels: daily.map(d => d.label),
          datasets: [
            { label: primaryCol, data: vals, backgroundColor: vals.map(v => v >= avg ? color.main + 'cc' : color.main + '55'), borderColor: color.main, borderWidth: 1, borderRadius: 3 },
            { label: 'Average', data: vals.map(()=>avg), type:'line', borderColor: color.main, borderWidth: 1.5, borderDash:[5,3], pointRadius:0, fill:false }
          ]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend:{display:false}, tooltip:{ callbacks:{ label: ctx => ctx.dataset.label === 'Average' ? ` Avg: ${fmtU(ctx.parsed.y,unit,1)}` : ` ${fmtU(ctx.parsed.y,unit)}` } } },
          scales: {
            x:{ grid:{display:false}, ticks:{ font:{size:9,family:'DM Mono'}, maxRotation:45, autoSkip:true, maxTicksLimit:8 } },
            y:{ grid:{color:'#f0ede8'}, ticks:{ font:{size:9,family:'DM Mono'}, callback: v=>fmt(v)+(unit?' '+unit:'') } }
          }
        }
      });
    }, 60 + si * 40);
  });
  container.appendChild(trendGrid);

  // ═══════════════════════════════════════════════════════════════════════════
  // SECTION 4 — QUICK-ACCESS DRILL-DOWN BAR
  // ═══════════════════════════════════════════════════════════════════════════
  const sec4 = document.createElement('div'); sec4.className = 'ov-sec'; sec4.textContent = 'All-Time Totals — Click to Drill Down';
  container.appendChild(sec4);

  const ddBar = document.createElement('div');
  ddBar.className = 'dd-bar';
  sheetMeta.forEach(({ name, color }) => {
    const sheet = allData[name];
    const nums  = getNumCols(sheet.cols, sheet.rows);
    if (!nums.length) return;
    // For milk intake, prefer TOTALS column; otherwise use first numeric
    const isMilk = name.toLowerCase().includes('milk') || name.toLowerCase().includes('intake');
    const primaryCol = isMilk
      ? (sheet.cols.find(c => /\btotals?\b/i.test(c) && nums.includes(c)) || nums[nums.length - 1])
      : nums[0];
    const unit  = detectUnit(name, primaryCol);
    const total = sumCol(sheet.rows, primaryCol);
    const dateCol = getDateCol(sheet.cols, sheet.rows);
    const { today: todayRows, label } = getLatestRows(sheet.rows, dateCol);
    const todayVal = sumCol(todayRows, primaryCol);

    const cell = document.createElement('div');
    cell.className = 'dd-cell';
    cell.onclick = () => switchTab(name);
    cell.innerHTML = `
      <div class="dd-lbl" style="color:${color.main}">${name}</div>
      <div class="dd-val">${fmtU(todayVal, unit) || '—'}</div>
      <div class="dd-sub">${label} · All-time: ${fmtU(total, unit)}</div>`;
    ddBar.appendChild(cell);
  });
  container.appendChild(ddBar);
}

// ── Single sheet ──────────────────────────────────────────────────────────────
function renderSheet(name, sheet, container) {
  container.classList.add('fade-in');
  const { cols, rows } = sheet;
  const color     = tabColor(name);
  const nums      = getNumCols(cols, rows);
  const labelCol  = getLabelCol(cols, rows);

  // Page header — title = exact sheet tab name; subtitle = exact column names
  const hdr = document.createElement('div');
  hdr.className = 'page-header';
  hdr.innerHTML = `
    <div class="page-title">${name}</div>
    <div class="page-subtitle">${rows.length} rows · ${cols.length} columns: ${cols.join(', ')}</div>`;
  container.appendChild(hdr);

  // ── Production Balance Panel (B/F → C/F) for production/balance sheets ──
  if (isProductionSheet(name, cols)) {
    function matchColLocal(patterns) {
      for (const pat of patterns) {
        const re = new RegExp(pat, 'i');
        const c = cols.find(c => re.test(c));
        if (c) return c;
      }
      return null;
    }
    const bfC   = matchColLocal(['b\\/?f','brought.forward','opening']);
    const cfC   = matchColLocal(['c\\/?f','carried.forward','closing']);
    const rcpC  = matchColLocal(['receipt','recon','received','incoming']);
    const prdC  = matchColLocal(['production','produced','output']);
    const dspC  = matchColLocal(['dispatch','transfer','other.location','sent']);
    const wstC  = matchColLocal(['waste','staff.tea','wastage','loss']);

    if (bfC && cfC) {
      const balPanel = document.createElement('div');
      balPanel.className = 'card';
      balPanel.style.marginBottom = '1rem';

      // Table: one row per data row showing all components
      const rowsHTML = rows.map((row, i) => {
        const label   = row[getLabelCol(cols, rows)] ?? `Row ${i+1}`;
        const bf      = typeof row[bfC]  === 'number' ? row[bfC]  : null;
        const rcpt    = rcpC && typeof row[rcpC] === 'number' ? row[rcpC] : null;
        const prod    = prdC && typeof row[prdC] === 'number' ? row[prdC] : null;
        const dsp     = dspC && typeof row[dspC] === 'number' ? row[dspC] : null;
        const wst     = wstC && typeof row[wstC] === 'number' ? row[wstC] : null;
        const cf      = typeof row[cfC]  === 'number' ? row[cfC]  : null;
        const isAuto  = row['_cf_calc'];
        const bfAuto  = row['_bf_auto'];

        const tdN = (v, color) => v != null
          ? `<td class="td-num" style="color:${color||'inherit'}">${fmt(v)} L</td>`
          : `<td class="td-num" style="color:var(--text-faint)">—</td>`;

        return `<tr>
          <td style="font-size:12px;white-space:nowrap">${String(label).substring(0,22)}</td>
          ${tdN(bf,   bfAuto ? '#1b4f72' : null)}
          ${tdN(rcpt, '#2d6a4f')}
          ${tdN(prod, '#2d6a4f')}
          ${tdN(dsp,  '#b5460f')}
          ${tdN(wst,  '#a0402a')}
          <td class="td-num" style="font-weight:700;color:${cf != null && cf >= 0 ? '#2d6a4f' : '#a0402a'};background:var(--green-light)">
            ${cf != null ? fmt(cf) + ' L' : '—'}${isAuto ? ' <span style="font-size:9px;font-weight:400;color:var(--text-faint)">⚙</span>' : ''}
          </td>
        </tr>`;
      }).join('');

      balPanel.innerHTML = `
        <div class="card-header">
          <div>
            <div class="card-title">🧮 Production Balance — B/F → C/F</div>
            <div class="card-sub">C/F = B/F + Receipts + Production − Dispatches − Wastage · <span style="color:#2d6a4f;font-weight:600">⚙ = auto-calculated</span> · B/F auto-carries from previous C/F</div>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr>
              <th>Period / Row</th>
              <th style="text-align:right;color:#1b4f72">B/F (L)</th>
              ${rcpC  ? `<th style="text-align:right;color:#2d6a4f">Receipts (L)</th>` : ''}
              ${prdC  ? `<th style="text-align:right;color:#2d6a4f">Production (L)</th>` : ''}
              ${dspC  ? `<th style="text-align:right;color:#b5460f">Dispatches (L)</th>` : ''}
              ${wstC  ? `<th style="text-align:right;color:#a0402a">Wastage (L)</th>` : ''}
              <th style="text-align:right;color:#2d6a4f;background:var(--green-light)">C/F (L) ⚙</th>
            </tr></thead>
            <tbody>${rowsHTML}</tbody>
          </table>
        </div>`;

      // Totals row
      const totBF  = bfC  ? colSum(rows, bfC)  : null;
      const totRcp = rcpC ? colSum(rows, rcpC) : null;
      const totPrd = prdC ? colSum(rows, prdC) : null;
      const totDsp = dspC ? colSum(rows, dspC) : null;
      const totWst = wstC ? colSum(rows, wstC) : null;
      const totCF  = cfC  ? colSum(rows, cfC)  : null;

      const totalsBar = document.createElement('div');
      totalsBar.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap;padding:10px 14px 12px;border-top:1px solid var(--border);font-size:11px;';
      const addTot = (label, val, color) => {
        if (val == null) return;
        totalsBar.innerHTML += `<span style="background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:3px 10px;font-family:'DM Mono',monospace;"><span style="color:var(--text-muted)">${label}:</span> <strong style="color:${color}">${fmt(val)} L</strong></span>`;
      };
      addTot('Σ B/F', totBF, '#1b4f72');
      addTot('Σ Receipts', totRcp, '#2d6a4f');
      addTot('Σ Production', totPrd, '#2d6a4f');
      addTot('Σ Dispatches', totDsp, '#b5460f');
      addTot('Σ Wastage', totWst, '#a0402a');
      addTot('Σ C/F', totCF, '#2d6a4f');
      balPanel.appendChild(totalsBar);

      container.appendChild(balPanel);
    }
  }
  if (nums.length) {
    const isMilkIntake = name.toLowerCase().includes('milk') || name.toLowerCase().includes('intake');
    const dateCol2  = getDateCol(cols, rows);
    const { today: latestRows, prev: prevRows2, label: latestLabel, prevLabel: prevLabel2 } = getLatestRows(rows, dateCol2);

    // ── MILK INTAKE: per-station latest day panel ──────────────────────────────
    if (isMilkIntake) {
      // Identify the TOTALS column (if any) and station columns separately
      const totalsCol   = cols.find(c => /\btotal(s)?\b/i.test(c) && nums.includes(c));
      const stationCols = nums.filter(c => c !== totalsCol);

      // Summary strip: Latest Day TOTAL vs Previous Day
      const latestTotal = totalsCol ? sumCol(latestRows, totalsCol) : stationCols.reduce((s,c) => s + sumCol(latestRows,c), 0);
      const prevTotal2  = totalsCol ? sumCol(prevRows2, totalsCol)  : stationCols.reduce((s,c) => s + sumCol(prevRows2,c), 0);
      const chgTotal    = pct(latestTotal, prevTotal2);
      const chgColor    = chgTotal === null ? 'var(--text-muted)' : chgTotal >= 0 ? '#1a7f4b' : '#a0402a';
      const chgArrow    = chgTotal === null ? '' : chgTotal >= 0 ? '▲' : '▼';
      const chgText     = chgTotal !== null ? `${chgArrow} ${Math.abs(chgTotal).toFixed(1)}%` : '—';

      // Top summary bar
      const summaryBar = document.createElement('div');
      summaryBar.style.cssText = 'display:flex;gap:10px;flex-wrap:wrap;align-items:stretch;margin-bottom:1rem;';
      summaryBar.innerHTML = `
        <div style="flex:1;min-width:200px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1rem 1.25rem;border-top:3px solid ${color.main}">
          <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin-bottom:4px">🥛 Total Milk Received — ${latestLabel}</div>
          <div style="font-size:30px;font-weight:700;letter-spacing:-1px;color:${color.main};font-family:'DM Mono',monospace">${fmt(latestTotal)} <span style="font-size:16px;font-weight:400">L</span></div>
          <div style="font-size:12px;color:${chgColor};font-weight:600;margin-top:4px">${chgText} vs ${prevLabel2} (${fmt(prevTotal2)} L)</div>
        </div>
        <div style="flex:1;min-width:200px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1rem 1.25rem;">
          <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin-bottom:6px">Stations Contributing — ${latestLabel}</div>
          <div style="font-size:22px;font-weight:700;letter-spacing:-.5px">${stationCols.filter(c => sumCol(latestRows,c) > 0).length} <span style="font-size:13px;font-weight:400;color:var(--text-muted)">of ${stationCols.length} active</span></div>
          <div style="font-size:11px;color:var(--text-muted);margin-top:4px">All-time avg/day: ${fmt(totalsCol ? colSum(rows,totalsCol)/rows.length : latestTotal)} L</div>
        </div>`;
      container.appendChild(summaryBar);

      // Per-station cards
      const stGrid = document.createElement('div');
      stGrid.style.cssText = 'display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px;margin-bottom:1.25rem;';
      stationCols.forEach(col => {
        const todayVal  = sumCol(latestRows, col);
        const prevVal   = sumCol(prevRows2,  col);
        const allTimeTotal = colSum(rows, col);
        const allTimeAvg   = allTimeTotal / rows.filter(r => typeof r[col] === 'number').length;
        const chg = pct(todayVal, prevVal);
        const chgCol = chg === null ? 'var(--text-muted)' : chg >= 0 ? '#1a7f4b' : '#a0402a';
        const badge  = chg !== null
          ? `<span style="display:inline-block;background:${chg>=0?'var(--green-light)':'var(--amber-light)'};color:${chgCol};padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700">${chg>=0?'▲':'▼'} ${Math.abs(chg).toFixed(1)}%</span>`
          : '';
        const card2 = document.createElement('div');
        card2.className = 'metric-card';
        card2.style.borderTop = `3px solid ${color.main}88`;
        card2.innerHTML = `
          <div class="metric-label" style="margin-bottom:3px">${col}</div>
          <div style="font-size:22px;font-weight:700;letter-spacing:-.6px;color:${color.main};font-family:'DM Mono',monospace">${fmt(todayVal)}<span style="font-size:12px;font-weight:400;color:var(--text-muted);margin-left:2px">L</span></div>
          <div style="font-size:10px;color:var(--text-muted);margin:2px 0 4px">prev ${fmt(prevVal)} L</div>
          ${badge}
          <div style="font-size:10px;color:var(--text-faint);margin-top:5px">avg/day ${fmt(allTimeAvg)} L</div>`;
        stGrid.appendChild(card2);
      });

      // TOTALS card (if column exists)
      if (totalsCol) {
        const allTimeAvgTot = colSum(rows, totalsCol) / rows.filter(r => typeof r[totalsCol] === 'number').length;
        const chg2 = pct(latestTotal, prevTotal2);
        const chgCol2 = chg2 === null ? 'var(--text-muted)' : chg2 >= 0 ? '#1a7f4b' : '#a0402a';
        const totCard = document.createElement('div');
        totCard.className = 'metric-card';
        totCard.style.cssText += `border-top:3px solid ${color.main};background:var(--green-light);`;
        totCard.innerHTML = `
          <div class="metric-label" style="margin-bottom:3px;color:${color.main}">TOTALS</div>
          <div style="font-size:22px;font-weight:700;letter-spacing:-.6px;color:${color.main};font-family:'DM Mono',monospace">${fmt(latestTotal)}<span style="font-size:12px;font-weight:400;color:var(--text-muted);margin-left:2px">L</span></div>
          <div style="font-size:10px;color:var(--text-muted);margin:2px 0 4px">prev ${fmt(prevTotal2)} L</div>
          <span style="display:inline-block;background:${chg2>=0?'#b7e4c7':'#fde0d8'};color:${chgCol2};padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700">${chg2>=0?'▲':'▼'} ${chg2 !== null ? Math.abs(chg2).toFixed(1)+'%' : '—'}</span>
          <div style="font-size:10px;color:var(--text-faint);margin-top:5px">avg/day ${fmt(allTimeAvgTot)} L</div>`;
        stGrid.appendChild(totCard);
      }
      container.appendChild(stGrid);

    } else {
      // ── DEFAULT: generic metric cards (all-time totals) ──────────────────────
      const grid = document.createElement('div');
      grid.className = 'metrics-grid';
      nums.forEach(col => {
        const unit   = detectUnit(name, col);
        const total  = colSum(rows, col);
        const valid  = rows.filter(r => typeof r[col] === 'number');
        const avg    = valid.length ? total / valid.length : 0;
        const dp     = total > 999 ? 0 : 1;
        const card   = document.createElement('div');
        card.className = 'metric-card';
        card.innerHTML = `
          <div class="metric-label">${col}</div>
          <div class="metric-value">${fmt(total, dp)}<span class="metric-unit">${unit}</span></div>
          <div class="metric-badge badge-${color.badge}">avg ${fmtU(avg, unit, avg > 100 ? 0 : 1)}</div>`;
        grid.appendChild(card);
      });
      container.appendChild(grid);
    }
  }

  // Charts
  if (nums.length && rows.length > 1) {
    const chartsRow = document.createElement('div');
    chartsRow.className = 'charts-row';
    const MAX_CHART_ROWS = 30;
    const sliced = rows.slice(0, MAX_CHART_ROWS);
    const isSalesSheet   = name.toLowerCase().includes('sale');
    const isFinanceSheet = name.toLowerCase().includes('financ') || name.toLowerCase().includes('cash') || name.toLowerCase().includes('credit') || name.toLowerCase().includes('payment');

    const isMilkSheet = name.toLowerCase().includes('milk') || name.toLowerCase().includes('intake');

    // Bar chart — skip for Sales, Finance and Milk Intake sheets (replaced by better charts)
    if (!isSalesSheet && !isFinanceSheet && !isMilkSheet) {
      const primaryCol  = nums[0];
      const primaryUnit = detectUnit(name, primaryCol);
      const barCard = document.createElement('div');
      barCard.className = 'card';
      barCard.innerHTML = `
        <div class="card-header">
          <div>
            <div class="card-title">${primaryCol}${primaryUnit ? ' (' + primaryUnit + ')' : ''}</div>
            <div class="card-sub">by ${labelCol}${rows.length > MAX_CHART_ROWS ? ' · first ' + MAX_CHART_ROWS + ' rows' : ''}</div>
          </div>
        </div>`;
      const barId = name.replace(/\W/g,'') + '_bar';
      const { wrap: bw, canvas: bc } = makeCanvas(barId, 260);
      barCard.appendChild(bw);
      chartsRow.appendChild(barCard);
      setTimeout(() => {
        chartInst[barId] = new Chart(bc, {
          type: 'bar',
          data: {
            labels: sliced.map(r => r[labelCol] != null ? String(r[labelCol]).substring(0, 14) : ''),
            datasets: [{ label: primaryCol, data: sliced.map(r => typeof r[primaryCol] === 'number' ? r[primaryCol] : 0), backgroundColor: color.main + 'cc', borderColor: color.main, borderWidth: 1, borderRadius: 4 }]
          },
          options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => ` ${primaryCol}: ${fmtU(ctx.parsed.y, primaryUnit)}` } } },
            scales: {
              x: { grid: { display: false }, ticks: { font: { size: 10, family: 'DM Mono' }, maxRotation: 45, autoSkip: rows.length > 14 } },
              y: { grid: { color: '#f0ede8' }, ticks: { font: { size: 10, family: 'DM Mono' }, callback: v => fmt(v) + (primaryUnit ? ' ' + primaryUnit : '') } }
            }
          }
        });
      }, 50);
    }

    // ── Trend chart: dynamic toggle for Sales/Finance, generic for others ────
    if (nums.length > 1) {

      if (isSalesSheet) {
        // ── SALES: Volume vs Revenue toggle chart ────────────────────────────
        const volCol2 = findCol(cols, ['volume','litr','ltr','qty','quantity','sold','dispatched']) || nums.find(c => detectUnit(name,c) === 'L') || nums[0];
        const kesCol2 = findCol(cols, ['amount','revenue','ksh','kes','value','total','income','payment']) || nums.find(c => detectUnit(name,c) === 'KES') || nums[1];

        const volUnit = detectUnit(name, volCol2);
        const kesUnit = detectUnit(name, kesCol2);

        const lineCard = document.createElement('div');
        lineCard.className = 'card';
        const lineId = name.replace(/\W/g,'') + '_line';

        // Build toggle buttons + chart
        lineCard.innerHTML = `
          <div class="card-header" style="flex-wrap:wrap;gap:8px;">
            <div>
              <div class="card-title">Trend</div>
              <div class="card-sub" id="${lineId}_sub">Showing: Volume (L)</div>
            </div>
            <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">
              <button id="${lineId}_btn_vol" onclick="salesChartSwitch('${lineId}','vol')"
                style="padding:5px 14px;border-radius:20px;font-size:12px;font-weight:600;border:1.5px solid ${color.main};background:${color.main};color:#fff;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s">
                📦 Volume (L)
              </button>
              <button id="${lineId}_btn_kes" onclick="salesChartSwitch('${lineId}','kes')"
                style="padding:5px 14px;border-radius:20px;font-size:12px;font-weight:600;border:1.5px solid var(--border);background:var(--surface);color:var(--text-muted);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s">
                💰 Revenue (KES)
              </button>
              <button id="${lineId}_btn_both" onclick="salesChartSwitch('${lineId}','both')"
                style="padding:5px 14px;border-radius:20px;font-size:12px;font-weight:600;border:1.5px solid var(--border);background:var(--surface);color:var(--text-muted);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s">
                ⚡ Both
              </button>
            </div>
          </div>`;

        const { wrap: lw, canvas: lc } = makeCanvas(lineId, 270);
        lineCard.appendChild(lw);
        chartsRow.appendChild(lineCard);

        const labels2 = sliced.map(r => r[labelCol] != null ? String(r[labelCol]).substring(0, 10) : '');
        const volData  = sliced.map(r => typeof r[volCol2] === 'number' ? r[volCol2] : 0);
        const kesData  = sliced.map(r => typeof r[kesCol2] === 'number' ? r[kesCol2] : 0);

        const volDataset = {
          label: `${volCol2} (${volUnit||'L'})`,
          data: volData,
          borderColor: color.main,
          backgroundColor: color.main + '18',
          fill: true,
          borderWidth: 2,
          tension: 0.35,
          pointRadius: 3,
          pointHoverRadius: 5,
          yAxisID: 'y',
        };
        const kesDataset = {
          label: `${kesCol2} (${kesUnit||'KES'})`,
          data: kesData,
          borderColor: '#1b4f72',
          backgroundColor: '#1b4f7218',
          fill: true,
          borderWidth: 2,
          tension: 0.35,
          pointRadius: 3,
          pointHoverRadius: 5,
          yAxisID: 'y2',
        };

        // Store data on window for the toggle function to access
        window[lineId + '_data'] = { labels: labels2, volDataset, kesDataset, volCol: volCol2, kesCol: kesCol2, volUnit, kesUnit, color };

        setTimeout(() => {
          chartInst[lineId] = new Chart(lc, {
            type: 'line',
            data: { labels: labels2, datasets: [volDataset] },
            options: {
              responsive: true, maintainAspectRatio: false,
              interaction: { mode: 'index', intersect: false },
              plugins: {
                legend: { display: false },
                tooltip: { callbacks: { label: ctx => ` ${ctx.dataset.label}: ${fmt(ctx.parsed.y)}` } }
              },
              scales: {
                x: { grid: { display: false }, ticks: { font: { size: 10, family: 'DM Mono' }, maxRotation: 45, autoSkip: true, maxTicksLimit: 10 } },
                y: { grid: { color: '#f0ede8' }, ticks: { font: { size: 10, family: 'DM Mono' }, callback: v => fmt(v) + (volUnit ? ' '+volUnit : '') }, position: 'left' },
                y2: { display: false, position: 'right', grid: { drawOnChartArea: false } }
              }
            }
          });
        }, 80);

      } else if (isMilkSheet) {
        // ── MILK INTAKE: per-station toggle chart ────────────────────────────
        const totalsCol2  = cols.find(c => /\btotals?\b/i.test(c) && nums.includes(c));
        const stationCols2 = nums.filter(c => c !== totalsCol2);
        // Colour palette per station
        const stPalette = ['#2d6a4f','#52b788','#1b4f72','#c97b2a','#6b3fa0','#a0402a','#0e6655','#74b9e0','#f4a261','#457b9d'];

        const lineCard = document.createElement('div');
        lineCard.className = 'card';
        lineCard.style.gridColumn = '1 / -1';
        const lineId = name.replace(/\W/g,'') + '_line';

        // Build station toggle buttons
        const stBtns = stationCols2.map((col, i) => `
          <button id="${lineId}_btn_${i}" onclick="milkChartSwitch('${lineId}',${i})"
            style="padding:4px 12px;border-radius:20px;font-size:11px;font-weight:600;border:1.5px solid ${stPalette[i % stPalette.length]};background:var(--surface);color:${stPalette[i % stPalette.length]};cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;white-space:nowrap">
            ${col}
          </button>`).join('');
        const allBtnStyle = `padding:4px 12px;border-radius:20px;font-size:11px;font-weight:600;border:1.5px solid #333;background:#333;color:#fff;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s`;
        const totalsBtnStyle = totalsCol2
          ? `padding:4px 12px;border-radius:20px;font-size:11px;font-weight:600;border:1.5px solid ${color.main};background:var(--surface);color:${color.main};cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s`
          : '';

        lineCard.innerHTML = `
          <div class="card-header" style="flex-wrap:wrap;gap:8px;margin-bottom:.5rem;">
            <div>
              <div class="card-title">Station Intake Trend</div>
              <div class="card-sub" id="${lineId}_sub">Showing: All Stations</div>
            </div>
            <div style="display:flex;gap:5px;align-items:center;flex-wrap:wrap;">
              <button id="${lineId}_btn_all" onclick="milkChartSwitch('${lineId}','all')"
                style="${allBtnStyle}">⚡ All</button>
              ${totalsCol2 ? `<button id="${lineId}_btn_totals" onclick="milkChartSwitch('${lineId}','totals')"
                style="${totalsBtnStyle}">📊 Totals</button>` : ''}
              ${stBtns}
            </div>
          </div>`;

        const { wrap: lw, canvas: lc } = makeCanvas(lineId, 290);
        lineCard.appendChild(lw);
        chartsRow.appendChild(lineCard);

        const labels4 = sliced.map(r => r[labelCol] != null ? String(r[labelCol]).substring(0, 10) : '');
        const stDatasets = stationCols2.map((col, i) => ({
          label: col + ' (L)',
          data: sliced.map(r => typeof r[col] === 'number' ? r[col] : 0),
          borderColor: stPalette[i % stPalette.length],
          backgroundColor: stPalette[i % stPalette.length] + '18',
          borderWidth: 2, tension: 0.3, pointRadius: 2, pointHoverRadius: 5, fill: false,
        }));
        const totalsDataset = totalsCol2 ? {
          label: totalsCol2 + ' (L)',
          data: sliced.map(r => typeof r[totalsCol2] === 'number' ? r[totalsCol2] : 0),
          borderColor: color.main, backgroundColor: color.main + '22',
          borderWidth: 2.5, tension: 0.3, pointRadius: 3, pointHoverRadius: 5, fill: true,
        } : null;

        window[lineId + '_milk'] = { labels: labels4, stDatasets, totalsDataset, stationCols: stationCols2, totalsCol: totalsCol2, palette: stPalette, color };

        setTimeout(() => {
          chartInst[lineId] = new Chart(lc, {
            type: 'line',
            data: { labels: labels4, datasets: [...stDatasets, ...(totalsDataset ? [totalsDataset] : [])] },
            options: {
              responsive: true, maintainAspectRatio: false,
              interaction: { mode: 'index', intersect: false },
              plugins: {
                legend: { display: false },
                tooltip: { callbacks: { label: ctx => ` ${ctx.dataset.label}: ${fmt(ctx.parsed.y)} L` } }
              },
              scales: {
                x: { grid: { display: false }, ticks: { font: { size: 10, family: 'DM Mono' }, maxRotation: 45, autoSkip: true, maxTicksLimit: 10 } },
                y: { grid: { color: '#f0ede8' }, ticks: { font: { size: 10, family: 'DM Mono' }, callback: v => fmt(v) + ' L' } }
              }
            }
          });
        }, 80);

      } else if (isFinanceSheet) {
        // ── FINANCE: Cash vs Credit vs Totals toggle chart ──────────────────
        const cashCol2   = findCol(cols, ['cash','paid','payment','received.cash','cash.in','cash.col']) || nums[0];
        const creditCol2 = findCol(cols, ['credit','mpesa','cheque','invoice','debt','pending','receivable','credit.sale']) || nums[1];
        const totalCol2  = findCol(cols, ['total','amount','revenue','income','collection','totals']) || nums.find(c => c !== cashCol2 && c !== creditCol2);

        const lineCard = document.createElement('div');
        lineCard.className = 'card';
        lineCard.style.gridColumn = '1 / -1';
        const lineId = name.replace(/\W/g,'') + '_line';

        lineCard.innerHTML = `
          <div class="card-header" style="flex-wrap:wrap;gap:8px;">
            <div>
              <div class="card-title">Collections Trend</div>
              <div class="card-sub" id="${lineId}_sub">Showing: Cash (KES)</div>
            </div>
            <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">
              <button id="${lineId}_btn_cash" onclick="finChartSwitch('${lineId}','cash')"
                style="padding:5px 14px;border-radius:20px;font-size:12px;font-weight:600;border:1.5px solid ${color.main};background:${color.main};color:#fff;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s">
                💵 Cash
              </button>
              <button id="${lineId}_btn_credit" onclick="finChartSwitch('${lineId}','credit')"
                style="padding:5px 14px;border-radius:20px;font-size:12px;font-weight:600;border:1.5px solid var(--border);background:var(--surface);color:var(--text-muted);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s">
                🧾 Credit
              </button>
              ${totalCol2 ? `<button id="${lineId}_btn_total" onclick="finChartSwitch('${lineId}','total')"
                style="padding:5px 14px;border-radius:20px;font-size:12px;font-weight:600;border:1.5px solid var(--border);background:var(--surface);color:var(--text-muted);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s">
                📊 Totals
              </button>` : ''}
              <button id="${lineId}_btn_both" onclick="finChartSwitch('${lineId}','both')"
                style="padding:5px 14px;border-radius:20px;font-size:12px;font-weight:600;border:1.5px solid var(--border);background:var(--surface);color:var(--text-muted);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s">
                ⚡ All
              </button>
            </div>
          </div>`;

        const { wrap: lw, canvas: lc } = makeCanvas(lineId, 280);
        lineCard.appendChild(lw);
        chartsRow.appendChild(lineCard);

        const labels3    = sliced.map(r => r[labelCol] != null ? String(r[labelCol]).substring(0, 10) : '');
        const cashData   = sliced.map(r => cashCol2   && typeof r[cashCol2]   === 'number' ? r[cashCol2]   : 0);
        const creditData = sliced.map(r => creditCol2 && typeof r[creditCol2] === 'number' ? r[creditCol2] : 0);
        const totalData  = sliced.map(r => totalCol2  && typeof r[totalCol2]  === 'number' ? r[totalCol2]  : 0);

        const mkDS = (label, data, clr, fill) => ({
          label, data,
          borderColor: clr, backgroundColor: clr + (fill ? '22' : '00'),
          fill: !!fill, borderWidth: 2, tension: 0.35, pointRadius: 3, pointHoverRadius: 5,
        });
        const cashDS   = mkDS(`${cashCol2} (KES)`,   cashData,   color.main, true);
        const creditDS = mkDS(`${creditCol2} (KES)`, creditData, '#6b3fa0',  true);
        const totalDS  = mkDS(`${totalCol2} (KES)`,  totalData,  '#1b4f72',  false);

        window[lineId + '_fin'] = { labels: labels3, cashDS, creditDS, totalDS, cashCol: cashCol2, creditCol: creditCol2, totalCol: totalCol2, color, hasTotals: !!totalCol2 };

        setTimeout(() => {
          chartInst[lineId] = new Chart(lc, {
            type: 'line',
            data: { labels: labels3, datasets: [cashDS] },
            options: {
              responsive: true, maintainAspectRatio: false,
              interaction: { mode: 'index', intersect: false },
              plugins: {
                legend: { display: false },
                tooltip: { callbacks: { label: ctx => ` ${ctx.dataset.label}: KES ${fmt(ctx.parsed.y)}` } }
              },
              scales: {
                x: { grid: { display: false }, ticks: { font: { size: 10, family: 'DM Mono' }, maxRotation: 45, autoSkip: true, maxTicksLimit: 10 } },
                y: { grid: { color: '#f0ede8' }, ticks: { font: { size: 10, family: 'DM Mono' }, callback: v => fmt(v) } }
              }
            }
          });
        }, 80);

      } else if (!isFinanceSheet) {
        // ── GENERIC multi-series line for non-Sales, non-Finance sheets ──────
        const lineCard = document.createElement('div');
        lineCard.className = 'card';
        const palette = nums.map((_, i) => {
          const hues = [color.main, '#52b788','#95d5b2','#74b9e0','#f4a261','#e76f51','#a8dadc','#457b9d'];
          return hues[i % hues.length];
        });
        const legendEl = document.createElement('div');
        legendEl.className = 'legend';
        nums.forEach((col, i) => {
          const u = detectUnit(name, col);
          legendEl.innerHTML += `<div class="legend-item"><div class="legend-swatch" style="background:${palette[i]}"></div>${col}${u ? ' (' + u + ')' : ''}</div>`;
        });
        lineCard.innerHTML = `<div class="card-header"><div><div class="card-title">All metrics — trend</div><div class="card-sub">${nums.length} columns</div></div></div>`;
        lineCard.appendChild(legendEl);
        const lineId = name.replace(/\W/g,'') + '_line';
        const { wrap: lw, canvas: lc } = makeCanvas(lineId, 260);
        lineCard.appendChild(lw);
        chartsRow.appendChild(lineCard);
        setTimeout(() => {
          chartInst[lineId] = new Chart(lc, {
            type: 'line',
            data: {
              labels: sliced.map(r => r[labelCol] != null ? String(r[labelCol]).substring(0, 10) : ''),
              datasets: nums.map((col, i) => {
                const u = detectUnit(name, col);
                return { label: col + (u ? ' (' + u + ')' : ''), data: sliced.map(r => typeof r[col] === 'number' ? r[col] : 0), borderColor: palette[i], backgroundColor: 'transparent', borderWidth: 2, tension: 0.3, pointRadius: 3, borderDash: i % 2 === 1 ? [4,3] : [] };
              })
            },
            options: {
              responsive: true, maintainAspectRatio: false,
              plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => { const col = nums[ctx.datasetIndex]; return ` ${col}: ${fmtU(ctx.parsed.y, detectUnit(name, col))}`; } } } },
              scales: {
                x: { grid: { display: false }, ticks: { font: { size: 10, family: 'DM Mono' }, maxRotation: 45, autoSkip: true, maxTicksLimit: 8 } },
                y: { grid: { color: '#f0ede8' }, ticks: { font: { size: 10, family: 'DM Mono' }, callback: v => fmt(v) } }
              }
            }
          });
        }, 80);
      }
    }

    // ── Sales chart toggle function (global so onclick can reach it) ──────────
    window.salesChartSwitch = function(lineId, mode) {
      const inst = chartInst[lineId];
      const d    = window[lineId + '_data'];
      if (!inst || !d) return;

      // Update button styles
      ['vol','kes','both'].forEach(m => {
        const btn = document.getElementById(`${lineId}_btn_${m}`);
        if (!btn) return;
        const active = m === mode;
        btn.style.background    = active ? d.color.main : 'var(--surface)';
        btn.style.color         = active ? '#fff' : 'var(--text-muted)';
        btn.style.borderColor   = active ? d.color.main : 'var(--border)';
      });

      const subEl = document.getElementById(`${lineId}_sub`);

      if (mode === 'vol') {
        inst.data.datasets = [d.volDataset];
        inst.options.scales.y.display  = true;
        inst.options.scales.y2.display = false;
        inst.options.scales.y.ticks.callback = v => fmt(v) + (d.volUnit ? ' '+d.volUnit : '');
        if (subEl) subEl.textContent = `Showing: Volume (${d.volUnit || 'L'})`;
      } else if (mode === 'kes') {
        inst.data.datasets = [{ ...d.kesDataset, yAxisID: 'y' }];
        inst.options.scales.y.display  = true;
        inst.options.scales.y2.display = false;
        inst.options.scales.y.ticks.callback = v => fmt(v) + (d.kesUnit ? ' '+d.kesUnit : '');
        if (subEl) subEl.textContent = `Showing: Revenue (${d.kesUnit || 'KES'})`;
      } else {
        // Both — dual Y axes
        inst.data.datasets = [d.volDataset, d.kesDataset];
        inst.options.scales.y.display  = true;
        inst.options.scales.y2.display = true;
        inst.options.scales.y.ticks.callback  = v => fmt(v) + ' ' + (d.volUnit||'L');
        inst.options.scales.y2.ticks = { font: { size: 10, family: 'DM Mono' }, callback: v => fmt(v) + ' ' + (d.kesUnit||'KES') };
        if (subEl) subEl.textContent = 'Showing: Volume + Revenue';
      }
      inst.update();
    };

    // ── Finance chart toggle function ─────────────────────────────────────────
    window.finChartSwitch = function(lineId, mode) {
      const inst = chartInst[lineId];
      const d    = window[lineId + '_fin'];
      if (!inst || !d) return;

      const btns = ['cash','credit','total','both'];
      btns.forEach(m => {
        const btn = document.getElementById(`${lineId}_btn_${m}`);
        if (!btn) return;
        const active = m === mode;
        btn.style.background  = active ? d.color.main : 'var(--surface)';
        btn.style.color       = active ? '#fff' : 'var(--text-muted)';
        btn.style.borderColor = active ? d.color.main : 'var(--border)';
      });

      const subEl = document.getElementById(`${lineId}_sub`);
      inst.options.scales.y.ticks.callback = v => fmt(v);

      if (mode === 'cash') {
        inst.data.datasets = [d.cashDS];
        if (subEl) subEl.textContent = `Showing: Cash Collections (KES)`;
      } else if (mode === 'credit') {
        inst.data.datasets = [d.creditDS];
        if (subEl) subEl.textContent = `Showing: Credit Collections (KES)`;
      } else if (mode === 'total' && d.hasTotals) {
        inst.data.datasets = [d.totalDS];
        if (subEl) subEl.textContent = `Showing: Total Collections (KES)`;
      } else {
        // All — stack cash, credit, totals
        const ds = [d.cashDS, d.creditDS];
        if (d.hasTotals) ds.push(d.totalDS);
        inst.data.datasets = ds;
        if (subEl) subEl.textContent = 'Showing: Cash + Credit' + (d.hasTotals ? ' + Totals' : '');
      }
      inst.update();
    };

    // ── Milk Intake station toggle function ───────────────────────────────────
    window.milkChartSwitch = function(lineId, mode) {
      const inst = chartInst[lineId];
      const d    = window[lineId + '_milk'];
      if (!inst || !d) return;

      const subEl = document.getElementById(`${lineId}_sub`);

      // Reset all button styles
      const allBtn = document.getElementById(`${lineId}_btn_all`);
      const totBtn = document.getElementById(`${lineId}_btn_totals`);
      if (allBtn) { allBtn.style.background = 'var(--surface)'; allBtn.style.color = '#333'; }
      if (totBtn) { totBtn.style.background = 'var(--surface)'; totBtn.style.color = d.color.main; }
      d.stationCols.forEach((_, i) => {
        const btn = document.getElementById(`${lineId}_btn_${i}`);
        if (btn) { btn.style.background = 'var(--surface)'; btn.style.color = d.palette[i % d.palette.length]; }
      });

      if (mode === 'all') {
        inst.data.datasets = [...d.stDatasets, ...(d.totalsDataset ? [d.totalsDataset] : [])];
        if (allBtn) { allBtn.style.background = '#333'; allBtn.style.color = '#fff'; }
        if (subEl) subEl.textContent = 'Showing: All Stations';
      } else if (mode === 'totals' && d.totalsDataset) {
        inst.data.datasets = [d.totalsDataset];
        if (totBtn) { totBtn.style.background = d.color.main; totBtn.style.color = '#fff'; }
        if (subEl) subEl.textContent = `Showing: ${d.totalsCol} (L)`;
      } else if (typeof mode === 'number') {
        const ds  = d.stDatasets[mode];
        const btn = document.getElementById(`${lineId}_btn_${mode}`);
        inst.data.datasets = [ds];
        if (btn) { btn.style.background = d.palette[mode % d.palette.length]; btn.style.color = '#fff'; }
        if (subEl) subEl.textContent = `Showing: ${d.stationCols[mode]} (L)`;
      }
      inst.update();
    };

    container.appendChild(chartsRow);
  }

  // Data table — headers = exact column names from sheet; all rows with pagination
  const PAGE = 50;
  if (!tableShown[name]) tableShown[name] = PAGE;

  function buildTable(shown) {
    const tableCard = document.createElement('div');
    tableCard.className = 'card';
    tableCard.id = 'table-card-' + name.replace(/\W/g,'');
    tableCard.innerHTML = `
      <div class="card-header">
        <div>
          <div class="card-title">Data — ${name}</div>
          <div class="card-sub">Showing ${Math.min(shown, rows.length)} of ${rows.length} rows · ${cols.length} columns</div>
        </div>
      </div>`;
    const wrap  = document.createElement('div'); wrap.className = 'table-wrap';
    const table = document.createElement('table');
    // TH = exact column header; append detected unit in parentheses
    table.innerHTML = `<thead><tr>${cols.map(c => {
      const u = detectUnit(name, c);
      return `<th>${c}${u ? ' (' + u + ')' : ''}</th>`;
    }).join('')}</tr></thead>`;
    const tbody = document.createElement('tbody');
    rows.slice(0, shown).forEach(row => {
      const tr = document.createElement('tr');
      tr.innerHTML = cols.map(c => {
        const v   = row[c];
        const isN = typeof v === 'number';
        const u   = isN ? detectUnit(name, c) : '';
        const d   = v == null ? '—' : isN ? fmtU(v, u, v % 1 !== 0 ? 2 : 0) : String(v);
        return `<td class="${isN ? 'td-num' : ''}">${d}</td>`;
      }).join('');
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    wrap.appendChild(table);
    tableCard.appendChild(wrap);
    // Show more / show all buttons
    if (shown < rows.length) {
      const btnWrap = document.createElement('div');
      btnWrap.className = 'show-more-wrap';
      btnWrap.innerHTML = `
        <button class="btn" onclick="showMoreRows('${name}',${shown + PAGE})">Show ${Math.min(PAGE, rows.length - shown)} more rows</button>
        &nbsp;
        <button class="btn" onclick="showMoreRows('${name}',${rows.length})">Show all ${rows.length} rows</button>`;
      tableCard.appendChild(btnWrap);
    }
    return tableCard;
  }

  container.appendChild(buildTable(tableShown[name]));
  container._buildTable = buildTable; // store ref for show-more
}

// Called by "Show more" buttons
function showMoreRows(sheetName, newCount) {
  tableShown[sheetName] = newCount;
  const cardId = 'table-card-' + sheetName.replace(/\W/g,'');
  const old    = document.getElementById(cardId);
  if (old) {
    const parent = old.parentElement;
    const built  = parent._buildTable ? parent._buildTable(newCount) : null;
    if (built) { parent.replaceChild(built, old); }
  }
}

// ── Boot ──────────────────────────────────────────────────────────────────────
loadAllData();
</script>
</body>
</html>
